tiers = [70, 185, 375]
name = "Whitescale in the Pass"

[[hunt]]
id = "deadwind_pass_night_tower"
class = "species.any"
conditions = { time = [[1320, 120]] }
tiers = [20, 50, 105]
name = "Under the Old Tower"
