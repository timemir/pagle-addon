# The Hunt list (DATA-R85): Hunt sets, fixed classes and Hunts, in the order the board shows them (HNT-R1).
# scripts/generate-data.py checks it (DATA-R92) and emits addons/Pagle_Hunts/data/HuntList.lua (DATA-R93); keys are
# docs/spec/content-data.md › Data, and what each field means is docs/spec/hunts.md's.
#
#   [[set]]    id, name, title, note?
#   [[class]]  id = "fixed.<name>", members = [itemID, …]   (every member must ship)
#   [[hunt]]   id, set, kind ("natural" / "imposed"), since (YYYY-MM-DD, 00:00 UTC), retired?,
#              species? or class?, minBand? (2-4, species only), window? (natural) or conditions? (imposed),
#              tiers (strictly ascending, the first is completion), name, note?
#
# The generated classes quality.uncommon, quality.rare and species.any need no [[class]] (DATA-R91). A Hunt's and a
# set's name, title and note are lore (DATA-R105): never in a Hunt's hash or the list's fingerprint (DATA-R94). From
# 1.0 a released Hunt never changes: a fix is a new Hunt plus a retired date on the old one (ADR 0005, DATA-R96).
#
# The v1 list (hunts.md › Data) arrives with ticket #182.
