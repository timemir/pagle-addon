# Core's lore (DATA-R100), emitted into addons/Pagle/data/Lore.lua as ns.L entries (DATA-R104): the names and
# descriptions of Core's own goods (SHOP-R25), one table per [good."<goodID>"] with its name and description
# (DATA-R101), every good manifest.toml lists under [core.good] (DATA-R106). Lore is never part of the catalogue and
# changes no count (DATA-R109).
# The M4 batch, drafted from VOICE.md, came with Core's lore check (DATA-R111, #161). The comment after each table
# is the good's slot, for review only.
#
# The Curio Shop shows a good's name and description beside its preview, under its slot and Module
# (wallet-and-shop.md › UI), so a description is about the look or the sound itself, never the shop or the addon.
# Each crest but Plain is a zone's shield (SHOP-R25): its name is the landmark on it, its description Pagle's word on
# the water there. Neither names the zone or any other place from the game (DATA-R3).

[good."core.toaststyle.page"] # Toast style, the default, was "Timber"
name = "Torn Page"
description = "A fresh page torn from the logbook and pinned to a leather spine. Brass trim, red ink."

[good."core.toaststyle.ripple"] # Toast style, tier 1
name = "Ripple"
description = "Blue leather and silver trim, with faint rings spreading across the page as if something just bit."

[good."core.toaststyle.lanternglow"] # Toast style, tier 2
name = "Lantern Glow"
description = "A warm lamp glowing behind each catch, for anglers who stay out past dark."

[good."core.soundset.driftwood"] # Sound set, the default
name = "Driftwood"
description = "Soft wooden knocks, like a hull bumping the jetty."

[good."core.soundset.gilded"] # Sound set, tier 2
name = "Gilded"
description = "Small, bright bells. A touch grand for a mackerel, and none the worse for it."

[good."core.crest.plain"] # Bookplate crest, the default
name = "Plain"
description = "No emblem, only the owner's name. Plenty of fine anglers never wanted more."

[good."core.crest.elwynn"] # Bookplate crest, tier 1: Elwynn Forest
name = "The Old Oak"
description = "The first lake most anglers ever saw, and the oak they sat under."

[good."core.crest.westfall"] # Bookplate crest, tier 1: Westfall
name = "The Windmill"
description = "Sails turning over the coast road. The sea is closer than the farmers admit."

[good."core.crest.darkshore"] # Bookplate crest, tier 1: Darkshore
name = "The Crescent"
description = "A crescent over grey water, for anglers who fish after dark."

[good."core.crest.redridge"] # Bookplate crest, tier 2: Redridge Mountains
name = "Three Peaks"
description = "Three red peaks standing in a mountain lake, and every one of them reflected."

[good."core.crest.wetlands"] # Bookplate crest, tier 2: Wetlands
name = "The Anchor"
description = "A harbour's anchor, hauled up from the mud. Still smells faintly of it."

[good."core.crest.stranglethorn"] # Bookplate crest, tier 2: Stranglethorn Vale
name = "The Leap"
description = "A fish leaping clear of the jungle surf, as if it heard about the contest."

[good."core.crest.dustwallow"] # Bookplate crest, tier 2: Dustwallow Marsh
name = "The Lantern"
description = "A lantern left burning on a fisherman's hut in the marsh fog."

[good."core.crest.feralas"] # Bookplate crest, tier 3: Feralas
name = "The Falls"
description = "Water falling between the giant trees, for anglers who take the long way."

[good."core.crest.tanaris"] # Bookplate crest, tier 3: Tanaris
name = "The Desert Sun"
description = "A desert sun over the only shade for miles: the shoreline."

[good."core.crest.winterspring"] # Bookplate crest, tier 3: Winterspring
name = "The Frost"
description = "A snowflake over still water, where ice fishing is real fishing."
