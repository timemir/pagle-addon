# Core's lore (DATA-R100), emitted into addons/Pagle/data/Lore.lua as ns.L entries (DATA-R104): the names and
# descriptions of Core's own goods (SHOP-R25), one table per [good."<goodID>"] with its name and description
# (DATA-R101), every good manifest.toml lists under [core.good] (DATA-R106). Lore is never part of the catalogue and
# changes no count (DATA-R109).
# The M4 batch, drafted from VOICE.md, came with Core's lore check (DATA-R111, #161). The comment after each table
# is the good's slot, for review only.
#
# The Curio Shop shows a good's name and description beside its preview, under its slot and Module
# (wallet-and-shop.md › UI), so a description is about the look or the sound itself, never the shop or the addon.
# Plain is Core's only crest: the zone crests are the Ledger's earned goods, their lore in ledger.toml (LED-R113).

[good."core.toaststyle.page"] # Toast style, the default, was "Timber"
name = "Torn Page"
description = "A fresh page torn from the logbook and pinned to a leather spine. Brass trim, red ink."

[good."core.toaststyle.ripple"] # Toast style, tier 1
name = "Ripple"
description = "Blue leather and silver trim, with faint rings spreading across the page as if something just bit."

[good."core.toaststyle.lanternglow"] # Toast style, tier 2
name = "Lantern Glow"
description = "A warm lamp glowing behind each catch, for anglers who stay out past dark."

[good."core.soundset.driftwood"] # Sound set, the default
name = "Driftwood"
description = "Soft wooden knocks, like a hull bumping the jetty."

[good."core.soundset.gilded"] # Sound set, tier 2
name = "Gilded"
description = "Small, bright bells. A touch grand for a mackerel, and none the worse for it."

[good."core.crest.plain"] # Bookplate crest, the default
name = "Plain"
description = "No emblem, only the owner's name. Plenty of fine anglers never wanted more."
