# Core's lore in Russian (ruRU), over data/lore/core.toml (DATA-R113, DATA-R114).
# Machine-drafted: written by an AI model (Claude) for 1.1 and not yet reviewed by a native Russian speaker.

[good."core.toaststyle.page"]
name.value = "Рваная страница"
name.en = "Torn Page"
description.value = "Свежая страница, вырванная из рыбацкой тетради и приколотая к кожаному корешку. Латунная окантовка, красные чернила."
description.en = "A fresh page torn from the logbook and pinned to a leather spine. Brass trim, red ink."

[good."core.toaststyle.ripple"]
name.value = "Круги на воде"
name.en = "Ripple"
description.value = "Синяя кожа и серебряная окантовка, а по странице расходятся едва заметные круги — будто только что клюнуло."
description.en = "Blue leather and silver trim, with faint rings spreading across the page as if something just bit."

[good."core.toaststyle.lanternglow"]
name.value = "Свет фонаря"
name.en = "Lantern Glow"
description.value = "Тёплый огонёк за каждым уловом — для тех, кто засиживается у воды затемно."
description.en = "A warm lamp glowing behind each catch, for anglers who stay out past dark."

[good."core.soundset.driftwood"]
name.value = "Коряга"
name.en = "Driftwood"
description.value = "Мягкий деревянный стук, будто борт лодки толкается о причал."
description.en = "Soft wooden knocks, like a hull bumping the jetty."

[good."core.soundset.gilded"]
name.value = "Позолота"
name.en = "Gilded"
description.value = "Маленькие звонкие колокольчики. Для скумбрии пышновато, но ей это не вредит."
description.en = "Small, bright bells. A touch grand for a mackerel, and none the worse for it."

[good."core.crest.plain"]
name.value = "Простой"
name.en = "Plain"
description.value = "Никакой эмблемы, только имя владельца. Многим славным рыболовам большего и не требовалось."
description.en = "No emblem, only the owner's name. Plenty of fine anglers never wanted more."

[good."core.toaststyle.ship"]
name.value = "Судовой журнал"
name.en = "Ship's Log"
description.value = "Лист из судового журнала, принайтовленный к парусиновому корешку. Графы приливов расчерчены тёмно-синим, на полях — якорь."
description.en = "A page from the ship’s log, lashed to a sailcloth spine. Tide columns ruled in navy, an anchor in the margin."

[good."core.toaststyle.birch"]
name.value = "Берестяной свиток"
name.en = "Birch Scroll"
description.value = "Написано на полоске снятой бересты и перевязано бечёвкой. Чернила уходят вглубь и остаются там."
description.en = "Written on a strip of peeled bark and tied with twine. The ink sinks in and stays."

[good."core.toaststyle.tidepool"]
name.value = "Приливная заводь"
name.en = "Tidepool"
description.value = "Страница побывала в воде и вернулась обратно. Песок в сгибе, ракушка на память."
description.en = "A page that went in the water and came back out. Sand in the fold, a shell left behind."

[good."core.toaststyle.chart"]
name.value = "Морская карта"
name.en = "Sea Chart"
description.value = "Обрывок карты, которую не стоило продавать никому. Промеры глубин, румбы и роза ветров, что по-прежнему указывает на север."
description.en = "Torn from a chart nobody should have sold. Soundings, rhumb lines and a compass rose that still points north."

[good."core.toaststyle.frost"]
name.value = "Иней"
name.en = "Frostbitten"
description.value = "Забыли на ночь на льду. Иней пророс от углов, пока чернила ещё не высохли."
description.en = "Left out overnight on the ice. The rime grew in from the corners while the ink was still wet."

[good."core.toaststyle.goblin"]
name.value = "Гоблинская лента"
name.en = "Goblin Ticker"
description.value = "Отпечатано на аппарате, который не останавливается ни на миг. Заклёпки несущие. Что делает шестерёнка, не знает никто."
description.en = "Printed on a ticker that never stops. The rivets are load-bearing. Nobody knows what the gear does."

[good."core.toaststyle.kelp"]
name.value = "Водоросли и жемчуг"
name.en = "Kelp & Pearl"
description.value = "Корешок, обёрнутый водорослями и усаженный жемчугом; страница сияет, как изнанка раковины."
description.en = "A spine wrapped in kelp and studded with pearls, the page shining like the inside of a shell."

[good."core.toaststyle.moon"]
name.value = "Лунный пергамент"
name.en = "Moonlit Vellum"
description.value = "Ночно-синий пергамент, исписанный серебром, — для уловов, что приходят уже после фонарей."
description.en = "Night-blue vellum written in silver, for the catches that come in after the lanterns."

[good."core.toaststyle.leaf"]
name.value = "Засушенный лист"
name.en = "Pressed Leaf"
description.value = "Один огромный лист, высушенный до золота между двумя тяжёлыми книгами. Вместо линовки — прожилки."
description.en = "One great leaf, pressed flat between two heavy books and dried gold. The veins do the ruling."

[good."core.toaststyle.bottle"]
name.value = "Бутылка морского стекла"
name.en = "Driftglass Bottle"
description.value = "Свёрнуто, закупорено и отдано волнам. Вернулось с уловом получше, чем уходило."
description.en = "Rolled up, corked and given to the tide. It washed back with a better catch than it left with."

[good."core.toaststyle.rune"]
name.value = "Рунная пластина"
name.en = "Rune-Plate"
description.value = "Вовсе не бумага: бронзовая пластина, улов выбит молотком, а руны вырезаны вокруг, чтобы всё было по-честному."
description.en = "Not paper at all: a bronze plate, the catch hammered in and the runes cut round it to keep it honest."

[good."core.toaststyle.folio"]
name.value = "Расписной фолиант"
name.en = "Illuminated Folio"
description.value = "Сусальное золото, лазурит и киноварь на пергаменте — работа писца, у которого было слишком много времени и слишком мало рыбы."
description.en = "Gold leaf, lapis and vermilion, laid on vellum by a scribe with too much time and not enough fish."

[good."core.soundset.rain"]
name.value = "Дождь на озере"
name.en = "Rain on the Lake"
description.value = "Капли падают на тихую воду одна за другой, а за ними — едва слышный шум дождя."
description.en = "Drops landing on still water, one after another, and the faint hush of rain behind them."

[good."core.soundset.marimba"]
name.value = "Маримба у берега"
name.en = "Marimba Shore"
description.value = "Тёплые деревянные пластины, быстрый пробег вверх по звукоряду — словно набегает волна."
description.en = "Warm wooden bars, rolled quickly up the scale like a wave coming in."

[good."core.soundset.shipbell"]
name.value = "Судовой колокол"
name.en = "Ship's Bell"
description.value = "Латунный колокол на мачте звонит в честь улова, а под ним скрипят канаты и обшивка."
description.en = "The brass bell on the mast, rung for the catch, with the rope and timbers creaking under it."

[good."core.soundset.squeaky"]
name.value = "Пищалка"
name.en = "Squeaky"
description.value = "Резиновая уточка с твёрдым мнением о вашем улове. Два писка, один всплеск, никаких сожалений."
description.en = "A rubber duck with big opinions about your catch. Two squeaks, one splash, no regrets."

[good."core.soundset.bubbleworks"]
name.value = "Пузыри из глубины"
name.en = "Bubbleworks"
description.value = "Крупные круглые пузыри всплывают из глубины и лопаются, а где-то вдалеке очень приветливый кит здоровается."
description.en = "Big round bubbles popping up from the deep, and somewhere far off a very friendly whale saying hello."

[good."core.soundset.kalimba"]
name.value = "Калимба у ручья"
name.en = "Kalimba Creek"
description.value = "Щипковые язычки у бегущей воды: две ноты и лёгкое дребезжание, словно их тронул сам ручей."
description.en = "A thumb piano by running water, two notes and a little buzz, as if the creek plucked them."

[good."core.soundset.musicbox"]
name.value = "Музыкальная шкатулка"
name.en = "Music Box"
description.value = "Крошечная заводная мелодия из шкатулки с рыбой на крышке. Два оборота ключа, не больше."
description.en = "A tiny wind-up tune from a box with a fish painted on the lid. Two turns of the key, no more."

[good."core.soundset.glass"]
name.value = "Стеклянные поплавки"
name.en = "Glass Floats"
description.value = "Зелёные стеклянные поплавки стукаются друг о друга в сети, а мимо поднимаются пузырьки."
description.en = "Green glass floats knocking together on a net, with bubbles rising past them."

[good."core.soundset.steelpan"]
name.value = "Стальные барабаны лагуны"
name.en = "Steel Pan Lagoon"
description.value = "Звонкие стальные барабаны с тёплой лагуны: две ноты, и кажется, что прилив на вашей стороне."
description.en = "Bright steel drums from a warm lagoon, two notes that sound like the tide is on your side."

[good."core.soundset.dulcimer"]
name.value = "Цимбалы из таверны"
name.en = "Tavern Dulcimer"
description.value = "Цимбалы из угла портовой таверны — удары быстрые и звонкие."
description.en = "A hammered dulcimer from the corner of a dockside tavern, struck quick and bright."

[good."core.soundset.goblintill"]
name.value = "Гоблинская касса"
name.en = "Goblin Till"
description.value = "Гоблинская касса срывает куш: монеты во все стороны, хозяин хохочет. Деньги назад не выдаются."
description.en = "A goblin's cash register going off like a jackpot, coins everywhere, and the owner laughing about it. No refunds."

[good."core.soundset.kazoo"]
name.value = "Парад казу"
name.en = "Kazoo Parade"
description.value = "Казу, свистулька с поршнем и праздничный рожок шагают по гавани, будто сегодня праздник. Теперь — да."
description.en = "A kazoo, a slide whistle and a party horn marching through the harbour as if it were a holiday. It is now."

[good."core.soundset.arcade"]
name.value = "Игровой автомат"
name.en = "Arcade Cabinet"
description.value = "Звяканье монет и победная мелодийка из автомата в глубине таверны. Чтобы продолжить, опустите одну рыбу."
description.en = "Coin blips and a level-up jingle from the cabinet in the back of the tavern. Insert one fish to continue."

[good."core.soundset.boing"]
name.value = "Пружинка"
name.en = "Boing!"
description.value = "Пружина, шлепок и всплеск — в том порядке, какой выберет рыба. Никто не пострадал."
description.en = "A spring, a slap and a splash, in whatever order the fish decides. Nobody is hurt."

[good."core.soundset.slime"]
name.value = "Зелёный хлюп"
name.en = "Slime Time"
description.value = "Нечто зелёное и трясучее в восторге от вашего улова и одобрительно хлюпает."
description.en = "Something green and wobbly is delighted about your catch and squelches its approval."

[good."core.soundset.frost"]
name.value = "Ледяные колокольцы"
name.en = "Frost Chimes"
description.value = "Сосульки звенят друг о друга на холодном ветру и поют ещё долго после того, как замерли."
description.en = "Icicles chiming against one another in a cold wind, ringing long after they stop moving."

[good."core.soundset.harp"]
name.value = "Арфа лесной поляны"
name.en = "Harp of the Glade"
description.value = "Арфа на лесной поляне: короткий перебор струн, и листва отвечает."
description.en = "A harp in a forest glade, a short sweep of strings and the leaves answering."

[good."core.soundset.gizmo"]
name.value = "Гномья штуковина"
name.en = "Gnomish Gizmo"
description.value = "Тиканье часового механизма, сорвавшаяся пружина и два бодрых писка. Почти наверняка работает."
description.en = "Clockwork ticking, a spring letting go and two cheerful bleeps. It almost certainly works."

[good."core.soundset.mrglglgl"]
name.value = "Мрглглгл"
name.en = "Mrglglgl"
description.value = "Мурлок заметил ваш улов, и у него есть мнение на этот счёт. Мргл… Мрглглгл."
description.en = "A murloc has spotted your catch and has opinions about it. Mrgl! Mrglglgl!"

[good."core.soundset.parrot"]
name.value = "Пиратский попугай"
name.en = "Pirate Parrot"
description.value = "Попугай с пристани, корабельная пушка и колокол. Попугай объявляет, пираты ликуют."
description.en = "A parrot off the docks, a ship's cannon and a bell. The parrot announces, the pirates cheer."

[good."core.soundset.laser"]
name.value = "Гномий лазер"
name.en = "Gnomish Laser"
description.value = "Гномий прибор жужжит, дрожит и гудит, а под конец бодро звякает. Не оружие. Скорее всего."
description.en = "A gnome gadget that zaps, wobbles and hums, then finishes with a cheerful ding. Not a weapon, probably."

[good."core.soundset.silithid"]
name.value = "Рой силитидов"
name.en = "Silithid Swarm"
description.value = "Рой осоподобных силитидов проносится мимо вашего улова, щёлкая и визжа. Пальцы держите в лодке."
description.en = "A swarm of silithid wasps buzzing past your catch, clicking and shrieking. Keep your fingers in the boat."

[good."core.soundset.succubus"]
name.value = "Шёпот суккуба"
name.en = "Succubus' Whisper"
description.value = "Суккуб под стропилами мурлычет и хохочет над вашим уловом. Никому ни слова."
description.en = "A succubus in the rafters, purring and cackling about your catch. Tell no one."

[good."core.soundset.wardrums"]
name.value = "Боевые барабаны"
name.en = "War Drums"
description.value = "Низкие барабаны и глухой рог с холмов: улов объявлен, как начало похода."
description.en = "Deep drums and a low horn from the hills: a catch announced like the start of a march."

[good."core.soundset.dragonroost"]
name.value = "Драконий утёс"
name.en = "Dragon's Roost"
description.value = "Дракон на высоком уступе, хлопают крылья, на рёв отвечает рог. Ради такой рыбы стоило его разбудить."
description.en = "A dragon on a high ledge, wings beating and a horn answering its roar. The fish was worth waking it up."

[good."core.toaststyle.sonar"]
name.value = "Эхолот"
name.en = "Sonar Scope"
description.value = "Собран инженером, который хотел видеть рыбу раньше, чем она увидит его. Гудит, пищит и ни разу не ошибся с отзвуком."
description.en = "Built by an engineer who wanted to see the fish before they saw him. It hums, it pings, and it has never once been wrong about a ping."

[good."core.toaststyle.foil"]
name.value = "Призовая фольга"
name.en = "Prize Foil"
description.value = "Та самая редкая, вытянутая из пачки с первой попытки. Поднесите к свету — и по ней пробежит всё озеро."
description.en = "The rare one, pulled from the pack on the first try. Hold it to the light and the whole lake runs through it."

[good."core.toaststyle.storm"]
name.value = "Штормовой фронт"
name.en = "Storm Front"
description.value = "Улов, взятый, когда все благоразумные давно ушли с воды. Вымпел говорит «шторм», рыболов — «ещё один заброс»."
description.en = "The catch you made when everyone sensible had gone in. The pennant says gale; the angler says one more cast."

[good."core.toaststyle.hive"]
name.value = "Хитин улья"
name.en = "Hive Chitin"
description.value = "Сброшен кем-то огромным, кто живёт под дюнами и выходит наверх, когда поёт песок. Пластины всё ещё гудят, глаза всё ещё следят."
description.en = "Shed by something big that lives under the dunes and comes up when the sand sings. The plates still hum; the eyes still watch."

[good."core.toaststyle.ooze"]
name.value = "Слизь"
name.en = "Ooze"
description.value = "Нечто выползло из болота и решило, что ваш улов — лучшее, что оно ело в жизни. Кости до сих пор переваривает."
description.en = "Something crawled out of the swamp and decided your catch was the best thing it had ever eaten. It is still digesting the bones."

[good."core.toaststyle.robot"]
name.value = "Механический рыболов"
name.en = "Mechanical Angler"
description.value = "Построен, чтобы рыбачить, пока создатель спит. Сам ни разу не спал, ни разу не моргнул и ни разу не упустил рыбу. Красный глаз значит, что он думает."
description.en = "Built to fish while its maker slept. It has never slept, never blinked and never once let a fish go. The red eye means it is thinking."

[good."core.toaststyle.spider"]
name.value = "Паутина вдовы"
name.en = "Widow's Web"
description.value = "Сплетена за ночь поперёк окна лодочного сарая. Всё, что в неё попалось, сперва принадлежало ей; вам она лишь одалживает название."
description.en = "Spun across the boathouse window overnight. Whatever got caught in it was hers first; she is only letting you borrow the name."

[good."core.toaststyle.glacier"]
name.value = "Сердце ледника"
name.en = "Glacier Heart"
description.value = "Вырезано из синего сердца ледника, что старше первой лодки: холод пронизывает его насквозь, а свет выходит с другой стороны иным."
description.en = "Cut from the blue heart of a glacier older than the first boat, where the cold goes all the way through and light comes out the other side changed."

[good."core.toaststyle.magma"]
name.value = "Поток магмы"
name.en = "Magma Flow"
description.value = "Зачерпнуто из реки расплавленного камня кем-то, кто забыл взять сковороду. Корка остывает, улов — нет. Не трогать."
description.en = "Scooped from a river of molten rock by someone who forgot to bring a pan. The crust is cooling; the catch is not. Do not touch."

[good."core.toaststyle.arcane"]
name.value = "Чародейский знак"
name.en = "Arcane Sigil"
description.value = "Начертан в парящем городе фиолетовых башен магом, которому было любопытно, можно ли призвать рыбу. Можно. Рыба была не в восторге."
description.en = "Inscribed in a floating city of violet towers, by a mage who wanted to know whether a fish could be summoned. It could. It was not pleased."

[good."core.toaststyle.pirate"]
name.value = "Чёрный флаг"
name.en = "Black Flag"
description.value = "Отодран от палубы корабля, что ходил лишь под одним флагом. Команды давно нет; попугай помнит каждую рыбу и охотно, громко о ней расскажет."
description.en = "Prised off the deck of a ship that only ever flew one flag. The crew are long gone; the parrot remembers every fish and will tell you about them, loudly."

[good."core.crest.fish.1467"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Солнечный окунь на поле озёрной зелени. Для рыболова, повидавшего все его пятна до единого."
description.en = "A sunfish on a field of lake green. For the angler who has seen every spot it can wear."

[good."core.crest.fish.4603"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Желтохвост поднимается сквозь синюю воду — хвостом вперёд во всех смыслах."
description.en = "A yellowtail rising through blue water, tail first in every sense."

[good."core.crest.fish.6289"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Луциан, весь из одной пасти, на прудовой зелени. Добыт укус за укусом."
description.en = "A snapper all jaw, on pond green. Earned one bite at a time."

[good."core.crest.fish.6291"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Самая маленькая рыба на любом щите — и та, которую труднее всего перестать ловить."
description.en = "The smallest fish on any shield, and the hardest to stop catching."

[good."core.crest.fish.6299"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Унылая серая рыба на тёмной воде. Кому-то надо было собрать их всех. Это были вы."
description.en = "A sad grey fish on dark water. Somebody had to collect them all. It was you."

[good."core.crest.fish.6303"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Полосатая скумбрия в открытом море — как всегда, ускользает из рамки."
description.en = "A barred mackerel on open sea, slipping out of the frame as usual."

[good."core.crest.fish.6308"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Усы, обида и речная зелень. Все до единого успели подуться у вас на леске."
description.en = "Whiskers, grudge and river green. Every last one of them has sulked on your line."

[good."core.crest.fish.6317"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Зубы на поле озёрной воды. Дворфы одобрили бы — а потом пересчитали пальцы."
description.en = "Teeth on a field of loch water. Dwarves would approve, then count their fingers."

[good."core.crest.fish.6358"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Маслянистый лосось на синем, весь лоснится. Каждый цвет, какой только способна дать масляная плёнка, — на счету."
description.en = "An oily salmon on blue, gleaming. Every colour the oil could make, accounted for."

[good."core.crest.fish.6359"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Красный луциан поднимается сквозь тёплую воду — для рыболова, видевшего его во всех цветах, какие у него бывают."
description.en = "A red snapper rising through warm water, for the angler who has seen it in every colour it comes in."

[good."core.crest.fish.6361"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Альбакор с широко раскинутыми радужными плавниками. На щите эти цвета не выцветают."
description.en = "An albacore with its rainbow fins spread wide, colours that never fade on a shield."

[good."core.crest.fish.6362"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Пятнистая треска на глубокой синеве, упрямая, как камни, среди которых она прячется."
description.en = "A mottled cod on deep blue, stubborn as the rocks it hides among."

[good."core.crest.fish.6458"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Маленькая рыбка на мутной воде. Чище она уже не станет."
description.en = "A small fish on murky water, as clean as it will ever be."

[good."core.crest.fish.6522"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Нечто со слишком многими глазами на поле дурной воды. Свидетельство крепкого желудка."
description.en = "Something with too many eyes on a field of bad water. Proof of a strong stomach."

[good."core.crest.fish.8365"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Форель с сияющей головой на речной зелени. Кузнец больше не спрашивает."
description.en = "A trout with a shining head, on river green. The smith has stopped asking."

[good."core.crest.fish.12238"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Широкий серый групер на сером море тех берегов, что дали ему имя. Рот, как всегда, разинут."
description.en = "A broad grey grouper on the grey sea it is named for, mouth open as ever."

[good."core.crest.fish.13422"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Угорь в каменной чешуе, свернувшийся поперёк синей воды. Бронники заглядываются на этот щит."
description.en = "A stone-scaled eel coiled across blue water. Armourers covet the shield."

[good."core.crest.fish.13754"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Тяжёлая синяя рыба в открытом море, сбитая, как кулак."
description.en = "A heavy blue fish on the open sea, built like a fist."

[good."core.crest.fish.13755"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Бледный кальмар на зимней ледяной синеве. Все щупальца наконец распутаны."
description.en = "A pale squid on winter ice-blue, every arm untangled at last."

[good."core.crest.fish.13756"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Окунь на озёрной зелени, и пасть такая, что в неё поместится целый сезон."
description.en = "A bass on lake green, mouth wide enough for the whole season."

[good."core.crest.fish.13757"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Угорь на грозовом поле, по краям ещё пробегают искры."
description.en = "An eel across a stormy field, sparks still at its edges."

[good."core.crest.fish.13758"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Полосатый окунь на поле цвета углей. Ярче всего на нём жабры."
description.en = "A barred perch on a field of ember red. The gills are the brightest thing on it."

[good."core.crest.fish.13759"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Фиолетовый луциан на ночной воде. Добыт в темноте — по большей части."
description.en = "A violet snapper on night water. Earned in the dark, mostly."

[good."core.crest.fish.13760"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Лосось в золотых крапинах поднимается сквозь зелёную воду, ловя каждый час света."
description.en = "A gold-flecked salmon rising through green water, catching every hour of light."

[good."core.crest.fish.13888"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Омар на синем, клешнями вперёд — он на этом настаивает."
description.en = "A lobster on the blue, claws first, as it insists."

[good."core.crest.fish.13889"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Бледный, как иней, лосось на холодной синеве. Все его окраски пойманы, пока не растаяли."
description.en = "A frost-pale salmon on cold blue. Every colour of it, caught before it melted."

[good."core.crest.fish.13890"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Рыба в костяных пластинах на ледяной синеве. Её броня наконец не устояла."
description.en = "A fish in bony plates on ice-blue, its armour finally outmatched."

[good."core.crest.fish.13893"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Старший родственник на поле глубокого моря. Не раз требовал обеих рук — и друга в придачу."
description.en = "The big cousin on a field of deep sea. Took both hands, and a friend, many times."

[good."core.crest.fish.16967"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Желтопёрый тунец на речной зелени, длинные плавники откинуты назад, как знамёна."
description.en = "A yellowfin tuna on river green, long fins swept back like banners."

[good."core.crest.fish.16968"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Полосатый хищник пересекает синюю воду — зубами вперёд."
description.en = "A barred hunter crossing blue water, teeth first."

[good."core.crest.fish.16969"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Парусник на зелёно-синих водах у берега джунглей. Парус поднят для публики."
description.en = "A sailfish on the jungle coast's green-blue, sail raised for the audience."

[good."core.crest.fish.16970"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Зелёно-золотая корифена у берега джунглей, яркая, как в день, когда её вытащили."
description.en = "A green and gold mahi on the jungle coast, bright as the day it was landed."

[good."core.crest.fish.19807"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Рыбка в веснушках у берега, где проходят состязания. Во всех расцветках, на всех состязаниях."
description.en = "A freckled fish on the contest coast. Every kind of it, every contest."

[good."core.crest.fish.19975"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Приземистая бурая рыба на мутной воде. Щит, к счастью, не пахнет."
description.en = "A squat brown fish on murky water. The shield, mercifully, does not smell."

[good."core.crest.fish.21071"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Небольшая рыба с поднятым высоким плавником на зелени горного ручья."
description.en = "A small fish with its tall fin raised, on hillside-stream green."

[good."core.crest.fish.21153"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Старейшина своего рода, состарившийся и величавый; плавник — как знамя над зелёной водой."
description.en = "The elder of its kind, grown old and grand, its fin a banner on green water."

[good."core.crest.fish.251524"]
name.value = "Герб: {fish}"
name.en = "{fish} Crest"
description.value = "Золотая рыбка в шлейфе голубого шёлка на зелёной воде. Как она сюда попала, до сих пор никто не знает."
description.en = "A gold fish trailing blue silk on green water. Still nobody knows how it got here."

[good."core.crate"]
name.value = "Ящик диковин"
name.en = "Curio crate"
description.value = "Упакован в доках кем-то, кто никогда не говорит, что внутри. Почти в каждом ящике найдётся облик, которого у вас ещё нет, и чем глубже копнёте, тем он реже. В основном солома."
description.en = "Packed down at the docks by someone who never says what's in them. Nearly every crate holds one look you don't yet own, rarer the deeper you dig. Straw, mostly."

# Machine-drafted (Claude) for the news sign's looks (SHOP-R60); awaits a native speaker's review.

[good."core.newssign.wood"]
name.value = "Дерево"
name.en = "Wood"
description.value = "Обветренные доски на двух верёвках. Опускается, качается, успокаивается и говорит своё. Просто, и этим гордится."
description.en = "Weathered planks on two ropes. It drops, sways, settles and says its piece. Plain, and proud of it."

[good."core.newssign.scroll"]
name.value = "Свиток"
name.en = "Scroll"
description.value = "Свёрнутую карту спускают за красно-белым поплавком. Она разворачивается вместе с новостью и для верности получает сургучную печать."
description.en = "A rolled chart reeled down behind a red and white bobber. It unrolls with the news and takes a wax seal for good measure."

[good."core.newssign.lantern"]
name.value = "Фонарь"
name.en = "Lantern"
description.value = "Латунный фонарь опускают на цепи перед тёмным стеклом. Он загорается, строки проступают одна за другой, а светлячки остаются."
description.en = "A brass lantern lowered on a chain before a dark pane. It lights, the lines come up one by one, and the fireflies stay."

[good."core.newssign.kraken"]
name.value = "Кракен"
name.en = "Kraken"
description.value = "Два щупальца опускают обросшую водорослями каменную табличку, держа её за углы. С неё капает. Присоски пульсируют. Где остальное, никто не спрашивает."
description.en = "Two tentacles bring down a weed-hung stone tablet, gripping its corners. It drips. Its suckers pulse. Nobody asks where the rest is."

[good."core.newssign.astro"]
name.value = "Астролябия"
name.en = "Astrolabe"
description.value = "Падает звезда, и вокруг неё раскручивается латунная астролябия, пока её диск не откроется ночному небу. При звёздах новости читаются лучше."
description.en = "A star falls, and a brass astrolabe spins up round it until its plate opens on the night sky. The news reads better by starlight."

[good."core.newssign.coral"]
name.value = "Коралл"
name.en = "Coral"
description.value = "Падает капля, и из всплеска поднимается табличка в жемчужной оправе, обрастая водорослями и кораллами. Поднимаются пузыри. Кто-то там внизу читает."
description.en = "A drop falls, and a pearl-rimmed plaque surfaces from the splash, kelp and coral growing round it. Bubbles rise. Something down there is reading."

[binding.field]
name.value = "Полевая кожа"
name.en = "Field Leather"
description.value = "Простая коричневая кожа, сделанная, чтобы мокнуть под дождём. Обычно и мокнет."
description.en = "Plain brown leather, made to be rained on, and it usually is."

[binding.birch]
name.value = "Береста"
name.en = "Birch Bark"
description.value = "Бледная и тонкая, как бумага, с тёмными крапинами. Пожалуй, единственная книга здесь, что удержится на воде."
description.en = "Pale and papery, with dark flecks. Likely the only book here that would float."

[binding.chartlinen]
name.value = "Лён с картой приливов"
name.en = "Tide-Chart Linen"
description.value = "Бледный лён с отпечатанной старой картой; линии глубин на уголках стёрты пальцами за несколько сезонов."
description.en = "Pale linen printed with an old chart, its depth lines worn soft at the corners by a few seasons of thumbs."

[binding.sailcloth]
name.value = "Смолёная парусина"
name.en = "Tarred Sailcloth"
description.value = "Старый парус, просмолённый дочерна от непогоды и обмётанный по краям бечёвкой."
description.en = "Old sail, tarred black against the weather and whipped round the edges with twine."

[binding.oilskin]
name.value = "Жёлтый дождевик"
name.en = "Oilskin Yellow"
description.value = "Вощёная жёлтая ткань, с которой скатываются дождь и брызги. Её можно найти на дне лодки — в том-то и смысл."
description.en = "Waxed yellow cloth that sheds rain and spray. You can find it at the bottom of the boat, which is the point."

[binding.canvas]
name.value = "Холщовый блокнот"
name.en = "Canvas Field Pad"
description.value = "Простой холст цвета хаки с номером по трафарету — кто его присвоил, никто не помнит. Влезает в карман куртки, едва-едва."
description.en = "Plain khaki canvas, stencilled with a number nobody remembers assigning. Fits a coat pocket, just."

[binding.kraft]
name.value = "Вощёная крафт-бумага"
name.en = "Waxed Kraft"
description.value = "Бурая бумага, натёртая пчелиным воском, пока не перестала бояться дождя. Перевязана бечёвкой: пуговицы отрываются."
description.en = "Brown paper rubbed with beeswax until it shrugs off rain. Tied with twine, because buttons fall off."

[binding.tartan]
name.value = "Клетчатая шерсть"
name.en = "Tartan Wool"
description.value = "Толстая шерсть в зелёно-синюю клетку с красной полосой. Тёплые руки, сырые страницы, никаких сожалений."
description.en = "Thick green-and-navy wool with a red line through it. Warm hands, damp pages, no regrets."

[binding.buckram]
name.value = "Коленкор цвета волны"
name.en = "Sea-Green Buckram"
description.value = "Жёсткая ткань цвета морской волны с кремовыми линейками. Брызги собираются в капли и тут же скатываются."
description.en = "Stiff sea-green cloth with cream rules. Spray beads up and rolls straight off."

[binding.moss]
name.value = "Во мху"
name.en = "Mossbound"
description.value = "Кожа, слишком долго пролежавшая на сыром берегу. Мох прижился, и книга, кажется, этому только рада."
description.en = "Leather left too long on a damp bank. The moss took hold, and the book seems happier for it."

[binding.driftwood]
name.value = "Доски из плавника"
name.en = "Driftwood Boards"
description.value = "Три доски серого плавника, прибитые к кожаному корешку. Вещь тяжёлая, честная и чуть солёная."
description.en = "Three boards of grey driftwood, nailed to a leather spine. Heavy, honest and faintly salty."

[binding.eelskin]
name.value = "Угриная кожа"
name.en = "Eelskin"
description.value = "Полоски угриной кожи, сшитые бок о бок, тёмные и скользкие, с блеском, который движется вслед за светом."
description.en = "Strips of eelskin sewn side by side, dark and slick, with a shine that moves when the light does."

[binding.kodo]
name.value = "Шкура кодо"
name.en = "Kodo Hide"
description.value = "Толстая шкура с равнин, местами вытертая до голой кожи, зашнурована сыромятью. Переживёт рыболова."
description.en = "A thick plains hide with the hair worn off in patches, laced shut with rawhide. It will outlast the angler."

[binding.frosthide]
name.value = "Шкура, дублённая морозом"
name.en = "Frost-Tanned Hide"
description.value = "Шкура, выделанная на холоде до белизны, с мехом вдоль корешка — для рук без перчаток."
description.en = "Hide cured in the cold until it went white, trimmed with fur along the spine for gloveless hands."

[binding.netcork]
name.value = "Сеть на пробке"
name.en = "Net over Cork"
description.value = "Пробковые доски под узловатой сетью, с привязанным поплавком. Не тонет — а это больше, чем можно сказать о большинстве книг."
description.en = "Cork boards under a knotted net, with a float tied on. It will not sink, which is more than most books can say."

[binding.tooled]
name.value = "Тиснёная кожа"
name.en = "Tooled Leather"
description.value = "Тёмная кожа с тиснёными камышами и прыгающими рыбами — работа того, у кого был острый нож и долгая зима."
description.en = "Dark leather tooled with reeds and leaping fish, by someone with a sharp knife and a long winter."

[binding.maplinen]
name.value = "Карта на льне"
name.en = "Map Linen"
description.value = "Рисованная от руки карта на льне: тропа красным пунктиром и крестик там, где, как клянутся, живёт та самая, большая."
description.en = "A hand-drawn map on linen, the trail dotted in red and an X where somebody swears the big one lives."

[binding.planks]
name.value = "Доски на ремнях"
name.en = "Bound Planks"
description.value = "Тонкие доски, стянутые кожаными ремнями с латунными пряжками. На худой конец сойдёт за разделочную."
description.en = "Thin planks strapped together with leather and brass buckles. Doubles as a cutting board in a pinch."

[binding.sharkskin]
name.value = "Акулья кожа"
name.en = "Sharkskin"
description.value = "Грубая серая шкура с серебряным тиснением. Из мокрой руки не выскользнет."
description.en = "Rough grey hide with silver tooling. It won't slip out of a wet hand."

[binding.copper]
name.value = "Медь на заклёпках"
name.en = "Riveted Copper"
description.value = "Медные пластины, приклёпанные к доскам, позеленели на швах. Захлопывается громко, помять невозможно."
description.en = "Copper plates riveted over boards, gone green at the seams. Loud to close, impossible to dent."

[binding.velvet]
name.value = "Ночной бархат"
name.en = "Night Velvet"
description.value = "Бархат цвета полуночи, расшитый серебряными звёздами и луной. Лучше всего читать при фонаре — тогда его и читают."
description.en = "Midnight velvet embroidered with silver stars and a moon. Best read by lantern, which is when it gets read."

[binding.turtle]
name.value = "Черепаховый панцирь"
name.en = "Turtle Shell"
description.value = "Пластины полированного панциря, янтарные и дымчатые, в тёмной оправе. Старше книги и, скорее всего, её переживёт."
description.en = "Polished shell plates, amber and smoke, set into a dark frame. Older than the book, and likely to outlive it."

[binding.morocco]
name.value = "Золочёный сафьян"
name.en = "Gilded Morocco"
description.value = "Красный козий сафьян, сплошь тиснённый золотой решёткой, — такие переплёты обычно держат за стеклом."
description.en = "Red goatskin tooled all over in gold lattice, the kind of binding usually kept behind glass."

[binding.verdigris]
name.value = "Ярь-медянка"
name.en = "Verdigris"
description.value = "Медные уголки и медная застёжка позеленели на морском воздухе. Когда-то они блестели. Недолго."
description.en = "Copper corners and a copper clasp, gone green in the sea air. It was bright once, briefly."

[binding.snakeskin]
name.value = "Змеиная кожа"
name.en = "Snakeskin"
description.value = "Кожа длинной болотной змеи, всё ещё в тех ромбах, с которыми та охотилась. Всегда прохладная на ощупь."
description.en = "A long swamp snake’s skin, still patterned with the diamonds it hunted by. Cool to the touch, always."

[binding.shagreen]
name.value = "Шагрень ската"
name.en = "Stingray Shagreen"
description.value = "Кожа ската, в пупырышках, как изморозь, с бледной звездой посередине — старые мастера её всегда сохраняли."
description.en = "Ray skin, pebbled like frost, with the pale star at its centre the old makers always kept."

[binding.lacquer]
name.value = "Красный лак"
name.en = "Lacquered Red"
description.value = "Слой за слоем красного лака, отполированного до отражения, и в нём плывёт золочёный карп."
description.en = "Layer upon layer of red lacquer, polished until it holds a reflection, with a gilt carp swimming in it."

[binding.bone]
name.value = "Кость и сыромять"
name.en = "Bone & Rawhide"
description.value = "Сыромятная кожа, туго натянутая на раму и застёгнутая на две резные костяные палочки. Скрипит на холоде."
description.en = "Rawhide stretched taut over a frame and shut with two carved bone toggles. Creaks in the cold."

[binding.brasscase]
name.value = "Латунный охотничий футляр"
name.en = "Brass Hunter's Case"
description.value = "Латунный футляр с гравировкой: рыба прыгает над камышами. Защёлка щёлкает так, будто говорит всерьёз."
description.en = "A brass case engraved with a leaping fish over the reeds, with a latch that clicks like it means it."

[binding.coral]
name.value = "Коралловая инкрустация"
name.en = "Coral Inlay"
description.value = "Ветви красного коралла, вставленные в кожу цвета морской волны, с жемчужинами на концах ветвей."
description.en = "Branches of red coral set into sea-green leather, with pearls where the branches end."

[binding.scrimshaw]
name.value = "Резьба по кости"
name.en = "Scrimshaw Panel"
description.value = "Старая пластина моржовой кости, на которой какой-то моряк процарапал корабль и рыбу: плавание было долгим, а нож острым."
description.en = "An old ivory panel scratched with a ship and a fish by some sailor with a long voyage and a sharp knife."

[binding.shagreenbone]
name.value = "Шагрень и кость"
name.en = "Shagreen and Bone"
description.value = "Зелёная кожа ската, до последнего пупырышка, с костью, выложенной, как восход. Сделано для капитана, любившего, чтобы книги подходили к кают-компании."
description.en = "Green ray-skin, every pebble of it, with bone laid in like a sunrise. Made for a captain who liked his books to match the saloon."

[binding.pearl]
name.value = "Перламутр"
name.en = "Mother-of-Pearl"
description.value = "Обложка из раковин, вырезанных по кусочку и подогнанных, как плитка. Меняет цвет всякий раз, как книгу поворачивают."
description.en = "A cover of shell, cut piece by piece and fitted like tiles. It shifts colour every time the book is turned."

[binding.trophycase]
name.value = "Золочёная витрина"
name.en = "Gilded Trophy Case"
description.value = "Футляр тёмного дерева со стеклянной дверцей, а за стеклом — рыба, отлитая из золота. Открывается, как шкафчик."
description.en = "A dark wood case with a glass front, and behind the glass a fish cast in gold. Opens like a cabinet."

[variety."1467.sunset-breasted"]
name.value = "Закатная грудка"
name.en = "Sunset-breasted"
description.value = "Оливковые бока, тёмные пятна и грудка цвета заката над озером. Этот наряд знает каждый."
description.en = "Olive flanks, dark spots, a breast like a sunset over the lake. The one everybody knows."

[variety."1467.pale-shallows"]
name.value = "Бледное мелководье"
name.en = "Pale Shallows"
description.value = "Окрас выгорает на тёплом мелководье за долгие послеполуденные часы. Пятна почти не утруждаются."
description.en = "Bleached by warm shallows and long afternoons. The spots barely bother."

[variety."1467.copper-breasted"]
name.value = "Медная грудка"
name.en = "Copper-breasted"
description.value = "Грудка как начищенный котелок. Повара на миг задумываются."
description.en = "A breast like a polished kettle. The cooks hesitate, briefly."

[variety."1467.peppered"]
name.value = "С перчинкой"
name.en = "Peppered"
description.value = "Пятна смолоты в перец. Та же рыба, только приправа тоньше."
description.en = "Spots ground down to pepper. Same fish, finer seasoning."

[variety."1467.blue-cheeked"]
name.value = "С синими щеками"
name.en = "Blue-cheeked"
description.value = "По две синие линии на каждой щеке — боевая раскраска для очень маленькой войны."
description.en = "Two blue lines on each cheek, like war paint for a very small war."

[variety."1467.barred"]
name.value = "В полоску"
name.en = "Barred"
description.value = "Бледные полосы по бокам, как у молоди. Иные так из них и не вырастают."
description.en = "Faint bars down the flanks, the way the young wear them. Some never grow out of it."

[variety."1467.ember-spotted"]
name.value = "Угольки"
name.en = "Ember-spotted"
description.value = "В тёплые месяцы пятна краснеют, будто рыба слишком долго сидела у костра."
description.en = "The spots run red in the warm months, as if it sat too close to the fire."

[variety."1467.golden"]
name.value = "Золото"
name.en = "Golden"
description.value = "Вся зелень ушла, осталось одно золото. Цапли замечают такое с другого берега."
description.en = "All the green gone, only gold left. Herons see it from across the lake."

[variety."1467.midnight"]
name.value = "Полночь"
name.en = "Midnight"
description.value = "Цвет озёрного ила, пятна и всё прочее. Легко не заметить, в чём, собственно, и смысл."
description.en = "Black as lake mud, spots and all. Easy to miss, which is rather the point."

[variety."1467.sunburst"]
name.value = "Солнечный венец"
name.en = "Sunburst"
description.value = "От глаза расходятся оранжевые лучи, как утро над тихой водой. В ладони долго хранит тепло."
description.en = "Orange rays run out from the eye like morning over still water. It stays warm in the hand."

[variety."4603.classic"]
name.value = "Классика"
name.en = "Classic"
description.value = "Сине-серая спина, жёлтый хвост, россыпь тёмных пятен. Именно этого ждёт любой прибрежный повар."
description.en = "Blue-grey back, yellow tail, a scatter of dark spots. The look every coastal cook expects."

[variety."4603.gold-striped"]
name.value = "Золотая полоса"
name.en = "Gold-striped"
description.value = "Жёлтая линия от носа до хвоста, будто кто-то взял и подчеркнул."
description.en = "A yellow line runs nose to tail, as if somebody underlined it."

[variety."4603.greenback"]
name.value = "Зелёная спина"
name.en = "Greenback"
description.value = "Спина зеленее — от берегов, заросших водорослями. Хвост по-прежнему гордо жёлтый."
description.en = "Greener along the back, from weedy coasts. The tail stays proudly yellow."

[variety."4603.silverside"]
name.value = "Серебряный бок"
name.en = "Silverside"
description.value = "Бока скорее зеркало, чем рыба. Пятен мало, и те стесняются."
description.en = "More mirror than fish down the flanks. Spots few and shy."

[variety."4603.dusky"]
name.value = "Сумрак"
name.en = "Dusky"
description.value = "Тёмный окрас глубокой воды; жёлтое потускнело до старой латуни."
description.en = "Dark from deep water, the yellow dulled to old brass."

[variety."4603.leopard"]
name.value = "Леопард"
name.en = "Leopard"
description.value = "Пятна разжадничались и срослись. Красиво, хоть и тесновато."
description.en = "The spots grew greedy and joined up. Handsome, in a crowded way."

[variety."4603.sunset-tailed"]
name.value = "Закатный хвост"
name.en = "Sunset-tailed"
description.value = "Хвост горит оранжевым, а не жёлтым. Гордости от этого только прибавилось, хотя куда уж больше."
description.en = "The tail burns orange instead of yellow. Even prouder of itself, if that were possible."

[variety."4603.all-gold"]
name.value = "Сплошное золото"
name.en = "All-gold"
description.value = "Желтизна от хвоста до носа. Чайки провожают лодку не одну милю."
description.en = "Yellow from tail to nose. Gulls follow the boat for miles."

[variety."4603.ghost"]
name.value = "Призрак"
name.en = "Ghost"
description.value = "Почти белизна, лишь у хвоста слабый жёлтый румянец. Даже на берегу выглядит так, будто всё ещё под водой."
description.en = "Nearly white, with a faint yellow blush at the tail. Looks underwater even out of it."

[variety."4603.tidecaller"]
name.value = "Зов прилива"
name.en = "Tidecaller"
description.value = "Вдоль боков светится тонкая синяя сетка. Старые моряки уверяют: стоит вытащить такой улов — и прилив поворачивает вспять."
description.en = "Fine blue netting glows along its flanks. Old sailors say the tide turns when one is landed."

[variety."6289.mudbank"]
name.value = "Илистый берег"
name.en = "Mudbank"
description.value = "Бурая спина, светлое брюхо, а впереди всего — челюсть. Похоже, такой обитатель есть в каждом пруду на свете."
description.en = "Brown above, tan below, jaw first. The snapper every pond in the world seems to have."

[variety."6289.reedbed"]
name.value = "Камыши"
name.en = "Reedbed"
description.value = "Слабые зелёные полосы — от жизни среди камыша. Привычка кусать без раздумий никуда не делась."
description.en = "Faint green bars, from hiding among the reeds. Still bites first."

[variety."6289.red-clay"]
name.value = "Красная глина"
name.en = "Red Clay"
description.value = "Ржаво-красный окрас с берегов из красной глины. Вкус тот же, вид погорячее."
description.en = "Rust-red, from riverbanks of red clay. Tastes the same, looks hotter."

[variety."6289.speckled"]
name.value = "Веснушки"
name.en = "Speckled"
description.value = "Веснушки по всему телу, как у батрака после жатвы."
description.en = "Freckled all over, like a farmhand after harvest."

[variety."6289.blackjaw"]
name.value = "Чёрная челюсть"
name.en = "Blackjaw"
description.value = "Челюсть до самых жабр черна как чернила. Мнения имеются, и ими охотно делятся."
description.en = "The jaw is ink-dark to the gills. It has opinions and it shares them."

[variety."6289.brindle"]
name.value = "Тигровая масть"
name.en = "Brindle"
description.value = "Полосы, как на шкуре гончей. Иные рыболовы клянутся, что слышали рычание."
description.en = "Streaked like a hound's coat. Some anglers swear it growls."

[variety."6289.lantern-eyed"]
name.value = "Глаза-фонари"
name.en = "Lantern-eyed"
description.value = "Глаза ловят свет, как лампа в окне. В сумерках найти проще."
description.en = "Eyes that catch the light like a lamp in a window. Easier to find at dusk."

[variety."6289.golden"]
name.value = "Самородок"
name.en = "Golden"
description.value = "Золото из бурого пруда. Пруд удивлён не меньше остальных."
description.en = "A gold snapper from a brown pond. The pond seems as surprised as anyone."

[variety."6289.pale"]
name.value = "Молочная белизна"
name.en = "Pale"
description.value = "Бледность парного молока, розовое у плавников. Слишком красиво для такой челюсти."
description.en = "Milk-pale, pink at the fins. Too pretty for the jaw it carries."

[variety."6289.old-bootbiter"]
name.value = "Гроза сапог"
name.en = "Old Bootbiter"
description.value = "Шрамы от крючков, рваный плавник и выражение полной уверенности в себе. Такой старожил есть в каждом пруду."
description.en = "Hook scars, a torn fin and an expression of total confidence. Every pond keeps one."

[variety."6291.silver"]
name.value = "Серебро"
name.en = "Silver"
description.value = "Простое серебро, что сотнями блестит на мелководье. С этой рыбы начинается не одна рыбацкая тетрадь."
description.en = "Plain silver, flashing in the shallows by the hundred. The first fish in a great many books."

[variety."6291.blue-striped"]
name.value = "Синяя полоска"
name.en = "Blue-striped"
description.value = "Аккуратная синяя полоска на каждом боку, будто для солидности."
description.en = "A neat blue stripe down each side, as if it were trying to look official."

[variety."6291.greenback"]
name.value = "Зелёная спина"
name.en = "Greenback"
description.value = "Спина зелёная — от мелкой заросшей воды. Заметить вдвое труднее."
description.en = "Green across the back, from shallow weedy water. Twice as hard to spot."

[variety."6291.dotted"]
name.value = "Строчка"
name.en = "Dotted"
description.value = "Ряд мелких точек вдоль бока, ровный, как шов."
description.en = "A row of small dots along the flank, neat as stitching."

[variety."6291.redfin"]
name.value = "Красные плавники"
name.en = "Redfin"
description.value = "Плавники будто обмакнули в красное. Красуется в стае, в одиночку — редко."
description.en = "Fins dipped in red. Shows off in a school, rarely alone."

[variety."6291.rainbow"]
name.value = "Радуга"
name.en = "Rainbow"
description.value = "На повороте переливается, как мыльный пузырь. На берегу сразу сереет."
description.en = "Throws colours like a soap bubble when it turns. Gone grey once landed."

[variety."6291.glass"]
name.value = "Стекло"
name.en = "Glass"
description.value = "Хребет виден насквозь. С той стороны ваш, вероятно, виден не хуже."
description.en = "You can see its backbone. It can probably see yours."

[variety."6291.golden"]
name.value = "Золотая монетка"
name.en = "Golden"
description.value = "Золотая монета с плавниками. Дети просят оставить себе. Рыболовы, впрочем, тоже."
description.en = "A gold coin with fins. Children want to keep it. Anglers want to keep it too."

[variety."6291.inkfin"]
name.value = "Чернила"
name.en = "Inkfin"
description.value = "Цвет кончика пера. Плавает среди ярких и никого не обманывает."
description.en = "Dark as a quill's tip. Swims with the bright ones and fools nobody."

[variety."6291.starlit"]
name.value = "Звёздная ночь"
name.en = "Starlit"
description.value = "Вдоль спины мерцают крошечные бледные искры, как в ясную ночь. Для такой крохи — поразительно."
description.en = "Tiny pale specks glow along its back like a clear night. Remarkable, for something this small."

[variety."6299.greyish"]
name.value = "Серость"
name.en = "Greyish"
description.value = "Серость, вялость и лёгкое чувство вины. Выглядит плохо, пахнет хуже."
description.en = "Grey, limp and faintly apologetic. It looks bad and smells worse."

[variety."6299.greenish"]
name.value = "Прозелень"
name.en = "Greenish"
description.value = "Зелёные пятна там, где им быть не положено. Запах прибывает раньше рыбы."
description.en = "Patches of green that should not be there. The smell arrives before the fish does."

[variety."6299.blotchy"]
name.value = "Бурые кляксы"
name.en = "Blotchy"
description.value = "Сплошь в унылых бурых пятнах. Откуда они, никто не спрашивает."
description.en = "Covered in sad brown blotches. Nobody asks what caused them."

[variety."6299.bony"]
name.value = "Кожа да кости"
name.en = "Bony"
description.value = "Рёбер больше, чем рыбы. Старалась как могла."
description.en = "More ribs than fish. It tried its best."

[variety."6299.bilious"]
name.value = "Желчь"
name.en = "Bilious"
description.value = "Желтизна с зеленцой, как тяжёлое утро. Брать в перчатках."
description.en = "Yellow-green, like a bad morning. Handle with gloves."

[variety."6299.bruised"]
name.value = "В синяках"
name.en = "Bruised"
description.value = "Лиловые и синие пятна, будто проиграла драку течению."
description.en = "Purple and blue in patches, as if it lost a fight with the current."

[variety."6299.wheezing"]
name.value = "Одышка"
name.en = "Wheezing"
description.value = "Жабры хлопают так, что слышится почти вздох. Всё понимает."
description.en = "Gills flap in a way that sounds almost like a sigh. It knows."

[variety."6299.recovered"]
name.value = "На поправке"
name.en = "Recovered"
description.value = "Здоровее остальных. И всё же как-то безошибочно из той же компании."
description.en = "Healthier than the rest. Still unmistakably one of them, somehow."

[variety."6299.ashen"]
name.value = "Пепел"
name.en = "Ashen"
description.value = "Серость до самых костей, будто рыба проплыла сквозь пепел. Даже мухи держатся подальше."
description.en = "Grey to the bone, like it swam through ash. Even the flies keep their distance."

[variety."6299.blighted"]
name.value = "Порча"
name.en = "Blighted"
description.value = "Под чешуёй слабо светятся зелёные прожилки. Иные воды помнят, что в них когда-то пролили."
description.en = "Faint green veins glow under the scales. Some waters remember what was spilled in them."

[variety."6303.tiger-backed"]
name.value = "Тигровая спина"
name.en = "Tiger-backed"
description.value = "Волнистые тёмные полосы по сине-зелёной спине, будто застывшая рябь."
description.en = "Wavy dark bars across a blue-green back, like ripples frozen in place."

[variety."6303.blueback"]
name.value = "Синяя спина"
name.en = "Blueback"
description.value = "Синева открытого моря. Жарится ничуть не хуже."
description.en = "Bluer, from the open sea. Fries up just as well."

[variety."6303.spotted"]
name.value = "В крапинку"
name.en = "Spotted"
description.value = "Точки там, где положено быть полосам. Скумбрия к правилам относится небрежно."
description.en = "Dots where the bars should be. Mackerel are not careful about the rules."

[variety."6303.shallow-water"]
name.value = "Песчаная бухта"
name.en = "Shallow-water"
description.value = "Бледнее обычного — из песчаных бухт у самого берега. Скользит по-прежнему."
description.en = "Paler, from sandy bays near the shore. Still slithers."

[variety."6303.emerald"]
name.value = "Изумруд"
name.en = "Emerald"
description.value = "Зелень водорослей и перелив, который гаснет за час."
description.en = "Green as kelp, with a shimmer that fades within the hour."

[variety."6303.bronze"]
name.value = "Бронза"
name.en = "Bronze"
description.value = "Бронза по спине, как на старой монете. Для скумбрии странно. Её это не волнует."
description.en = "Bronze along the back like an old coin. Odd for a mackerel. It doesn't care."

[variety."6303.plainback"]
name.value = "Гладкая спина"
name.en = "Plainback"
description.value = "Ни одной полосы. Без них, похоже, выскальзывает из рук ещё быстрее."
description.en = "No bars at all. Slips through the hands faster without them, apparently."

[variety."6303.golden"]
name.value = "Позолота"
name.en = "Golden"
description.value = "Золотые полосы по золоту. Выглядит дорого. Жарится как скумбрия."
description.en = "Gold bars on gold. Looks expensive. Fries like a mackerel."

[variety."6303.pearl"]
name.value = "Жемчуг"
name.en = "Pearl"
description.value = "Белизна ракушки, а от полос осталась одна тень. Красиво и всё так же скользко."
description.en = "White as a shell, the bars only a ghost of themselves. Lovely, and still slippery."

[variety."6303.sea-witch"]
name.value = "Морская ведьма"
name.en = "Sea-witch"
description.value = "В темноте полосы светятся морской зеленью. Моряки таких отпускают. Потом жалеют."
description.en = "Bars that glow sea-green in the dark. Sailors throw these back. Then they regret it."

[variety."6308.mudback"]
name.value = "Илистая спина"
name.en = "Mudback"
description.value = "Илисто-бурый верх, кремовый низ, усы во все стороны. Такой сом, похоже, живёт в каждой реке."
description.en = "Mud-brown above, cream below, whiskers everywhere. The catfish every river seems to keep."

[variety."6308.spotted"]
name.value = "В крапинку"
name.en = "Spotted"
description.value = "Тёмные пятна вдоль боков, как у молодого канального сома."
description.en = "Dark spots along the flanks, like a channel catfish in its youth."

[variety."6308.slate"]
name.value = "Сланец"
name.en = "Slate"
description.value = "Цвет речного камня. Упрямства столько же."
description.en = "Blue-grey as river stone. Just as stubborn."

[variety."6308.yellowbelly"]
name.value = "Жёлтое брюхо"
name.en = "Yellowbelly"
description.value = "Жёлтое брюхо — и ни капли стыда. Дерётся всё равно."
description.en = "A yellow belly and no shame about it. Fights anyway."

[variety."6308.marbled"]
name.value = "Мраморный узор"
name.en = "Marbled"
description.value = "Разводы как у речного дна, где и проходит вся жизнь."
description.en = "Mottled like a riverbed, which is exactly where it spends its time."

[variety."6308.long-whiskered"]
name.value = "Длинные усы"
name.en = "Long-whiskered"
description.value = "Усы вдвое длиннее обычного. Вид мудрый. Только вид."
description.en = "Whiskers twice the usual length. Wise-looking. Isn't."

[variety."6308.black-barbel"]
name.value = "Чёрный ус"
name.en = "Black Barbel"
description.value = "Чернота от усов до хвоста. Глотает свет и почти всю наживку."
description.en = "Inky from whisker to tail. Swallows the light and most of the bait."

[variety."6308.calico"]
name.value = "Трёхцветка"
name.en = "Calico"
description.value = "Рыжие, белые и чёрные пятна, как у амбарной кошки. И впечатлить так же трудно."
description.en = "Orange, white and black in patches, like a barn cat. Just as unimpressed."

[variety."6308.albino"]
name.value = "Альбинос"
name.en = "Albino"
description.value = "Белая кожа, розовые глаза. Солнца здесь явно не видали и видеть не собираются."
description.en = "White with pink eyes. Has clearly never seen the sun, and does not intend to."

[variety."6308.riverbed-king"]
name.value = "Король речного дна"
name.en = "Riverbed King"
description.value = "Усы толщиной с канат и пасть как дверь в погреб. Река кормит этого старика не первый год."
description.en = "Whiskers thick as rope and a mouth like a cellar door. The river has been feeding it for years."

[variety."6317.slate-backed"]
name.value = "Сланцевая спина"
name.en = "Slate-backed"
description.value = "Серая спина, красное брюхо, зубы. Имя дано за то, как ведёт себя в руках."
description.en = "Grey back, red belly, teeth. Named for how it behaves when held."

[variety."6317.redbelly"]
name.value = "Красное брюхо"
name.en = "Redbelly"
description.value = "Брюхо красное, как кузнечный горн. Зубы те же."
description.en = "A belly red as a forge. The teeth are the same."

[variety."6317.peat-stained"]
name.value = "Торф"
name.en = "Peat-stained"
description.value = "Бурый оттенок торфяной воды. Слегка отдаёт дымком."
description.en = "Brown from peaty water. Tastes faintly of smoke."

[variety."6317.silverflank"]
name.value = "Серебряный бок"
name.en = "Silverflank"
description.value = "Яркое серебро боков и блеск чешуи. Зубов не меньше."
description.en = "Bright silver flanks with a glitter of scales. Still all teeth."

[variety."6317.ironjaw"]
name.value = "Железная челюсть"
name.en = "Ironjaw"
description.value = "Челюсть темна, как старое железо, и почти так же тверда. Перчатки не помешают."
description.en = "Jaw dark as old iron, and almost as hard. Gloves are advised."

[variety."6317.ale-barred"]
name.value = "Полосы эля"
name.en = "Ale-barred"
description.value = "Янтарные полосы, как в хорошо налитом эле. Дворфы зовут таких ласково."
description.en = "Amber bars like a well-poured ale. Dwarves name these fondly."

[variety."6317.snowmelt"]
name.value = "Талая вода"
name.en = "Snowmelt"
description.value = "Бледность из самого холодного угла озера. Кусается ничуть не слабее."
description.en = "Pale from the coldest corner of the loch. Bites just as hard."

[variety."6317.ruby"]
name.value = "Рубин"
name.en = "Ruby"
description.value = "Краснота от головы до хвоста, как самоцвет в шахтёрской лампе. Кто-нибудь всегда пытается это продать."
description.en = "Red all over, like a gem in a miner's lamp. Somebody always tries to sell it."

[variety."6317.blackwater"]
name.value = "Чёрная вода"
name.en = "Blackwater"
description.value = "Черно, как на дне шахты. Зубы белые."
description.en = "Black as the bottom of a mine shaft. The teeth are white."

[variety."6317.dam-breaker"]
name.value = "Крушитель плотин"
name.en = "Dam-Breaker"
description.value = "Зубы как стамески, в челюсти застряли старые щепки. Байки у озера с этого зверя начинаются и им же кончаются."
description.en = "Teeth like chisels and a jaw full of old splinters. Loch-side stories begin and end with this one."

[variety."6358.black-gummed"]
name.value = "Чёрные дёсны"
name.en = "Black-gummed"
description.value = "Чёрные дёсны, пятнистая спина, жирный блеск. Алхимикам нужен жир."
description.en = "Black gums, spotted back, an oily sheen. Alchemists want the oil."

[variety."6358.greenback"]
name.value = "Зелёная спина"
name.en = "Greenback"
description.value = "Спина зеленее — с берегов, заросших водорослями. Жира не меньше."
description.en = "Greener above, from kelp coasts. Just as oily."

[variety."6358.bright-silver"]
name.value = "Яркое серебро"
name.en = "Bright Silver"
description.value = "Прямо из открытой воды и блестит, как клинок. Жир на месте, как ни крути."
description.en = "Fresh from open water and bright as a blade. The oil is there all the same."

[variety."6358.spotless"]
name.value = "Ни пятнышка"
name.en = "Spotless"
description.value = "Ни единого пятнышка. Всё украшение — жирный блеск."
description.en = "Not a single spot. The oil does the decorating."

[variety."6358.rainbow-slicked"]
name.value = "Радужная плёнка"
name.en = "Rainbow-slicked"
description.value = "На солнце жир отливает всеми цветами. Слишком красиво для такой скользкой твари."
description.en = "The oil shows every colour in sunlight. Prettier than anything this greasy deserves."

[variety."6358.redflank"]
name.value = "Красный бок"
name.en = "Redflank"
description.value = "Бока покраснели к нересту. Жира больше, чем когда-либо."
description.en = "Gone red along the flanks for spawning. Oilier than ever."

[variety."6358.hooknose"]
name.value = "Крючконос"
name.en = "Hooknose"
description.value = "Крючковатая челюсть после нерестового хода. Вид вечно оскорблённый."
description.en = "A hooked jaw from its spawning run. Looks offended at all times."

[variety."6358.pearl"]
name.value = "Жемчуг"
name.en = "Pearl"
description.value = "Белизна с жемчужным отливом от всего этого жира. Красивее своей репутации."
description.en = "White, with a pearly sheen from all that oil. Prettier than its reputation."

[variety."6358.tar-black"]
name.value = "Смоль"
name.en = "Tar-black"
description.value = "Черно от пасти до хвоста и скользко, как смола. Пачкает всё, к чему прикоснётся."
description.en = "Black from mouth to tail and slick as tar. Leaves a mark on everything it touches."

[variety."6358.lampblack"]
name.value = "Ламповая сажа"
name.en = "Lampblack"
description.value = "По чешуе сочится золотистый жир и слабо светится. Ламповщики отдали бы что угодно. Обычно и отдают."
description.en = "Gold oil seeps along its scales and glows faintly. Lamp-makers would pay anything. They usually do."

[variety."6359.flame-finned"]
name.value = "Огненные плавники"
name.en = "Flame-finned"
description.value = "Красное тело, плавники как пламя. Именно это представляет рыболов, услышав название."
description.en = "Red body, fins like flame. The colour most anglers picture when they hear the name."

[variety."6359.coral"]
name.value = "Коралл"
name.en = "Coral"
description.value = "Розовее — из воды у рифов. В руке чуть прохладнее."
description.en = "Pinker, from reef water. A little cooler in the hand."

[variety."6359.ember-spotted"]
name.value = "Угольки"
name.en = "Ember-spotted"
description.value = "Тёмные пятна, как угли на красном. Свежий улов слегка пахнет дымом."
description.en = "Dark spots like cinders on red. Smells faintly of smoke when landed."

[variety."6359.goldfin"]
name.value = "Золотой плавник"
name.en = "Goldfin"
description.value = "Плавники золотые вместо красных. Тепло никуда не делось."
description.en = "Fins of gold instead of red. Still warm."

[variety."6359.deepwater"]
name.value = "Глубина"
name.en = "Deepwater"
description.value = "Тёмный багрянец глубокой воды. Тепло держит дольше."
description.en = "Dark crimson from deep water. Holds the heat longer."

[variety."6359.flame-striped"]
name.value = "Языки пламени"
name.en = "Flame-striped"
description.value = "Жёлтые линии бегут по телу, как пламя вверх по стене."
description.en = "Yellow lines run down it like flames up a wall."

[variety."6359.smouldering"]
name.value = "Тление"
name.en = "Smouldering"
description.value = "Темнота присыпанного костра, красное по краям. Долго в руках не удержать — горячо."
description.en = "Dark as a banked fire, red at the edges. Too warm to hold for long."

[variety."6359.white-flame"]
name.value = "Белое пламя"
name.en = "White-flame"
description.value = "Белое тело, плавники цвета раскалённого угля. Жар настоящий."
description.en = "White, with fins the pink of a hot coal. The heat is real."

[variety."6359.charred"]
name.value = "Головешка"
name.en = "Charred"
description.value = "Черно, как обгоревшее полено, а плавники ещё рдеют. С виду уже готово. Отнюдь."
description.en = "Black as a burnt log, fins still glowing red. Looks cooked. Isn't."

[variety."6359.phoenix-fin"]
name.value = "Плавник феникса"
name.en = "Phoenix-fin"
description.value = "Плавники горят золотом, тело светится, как горн. Вода вокруг парит, пока улов идёт к берегу."
description.en = "Fins burn gold and the body glows like a forge. Water steams around it as it lands."

[variety."6361.many-hued"]
name.value = "Многоцветье"
name.en = "Many-hued"
description.value = "Стально-синяя спина, серебряное брюхо, плавники всех цветов. Через час краски блёкнут, так что смотрите скорее."
description.en = "Steel-blue back, silver belly, fins in every colour. They fade within the hour, so look quickly."

[variety."6361.deep-blue"]
name.value = "Глубокая синева"
name.en = "Deep Blue"
description.value = "Темнее — из дальних вод. Плавники держат цвета чуть дольше."
description.en = "Darker, from far offshore. The fins keep their colours a little longer."

[variety."6361.barred"]
name.value = "В полоску"
name.en = "Barred"
description.value = "Бледные полосы по бокам — так альбакор расцвечивается, когда жадно кормится."
description.en = "Pale bars down the flanks, as albacore show when feeding hard."

[variety."6361.silverflank"]
name.value = "Серебряный бок"
name.en = "Silverflank"
description.value = "Серебра больше, чем синевы. Радуга живёт только в плавниках."
description.en = "More silver than blue. The rainbow lives in the fins alone."

[variety."6361.sunset-finned"]
name.value = "Закатные плавники"
name.en = "Sunset-finned"
description.value = "Плавники оранжевые и розовые, как небо в конце удачного рыбацкого дня."
description.en = "Fins of orange and rose, like a sky at the end of a good day's fishing."

[variety."6361.violet"]
name.value = "Лиловый отлив"
name.en = "Violet"
description.value = "Лиловый отлив вдоль спины. На берегу краски тускнеют до обиженной серости."
description.en = "A violet sheen along the back. Colours fade to a sulky grey after landing."

[variety."6361.longfin"]
name.value = "Длинные плавники"
name.en = "Longfin"
description.value = "Грудные плавники длиной с предплечье. Держится так, будто море — личное владение."
description.en = "Pectoral fins as long as a forearm. Swims like it owns the sea."

[variety."6361.prism"]
name.value = "Призма"
name.en = "Prism"
description.value = "Белизна морской пены, и каждая полоса своего цвета. Держит их целые сутки."
description.en = "White as sea-foam, every stripe a different colour. Holds them for a whole day."

[variety."6361.stormback"]
name.value = "Грозовая спина"
name.en = "Stormback"
description.value = "Серость грозовых туч, плавники потускнели до олова. Лучше всего клюёт перед дождём."
description.en = "Grey as thunderheads, fins dulled to pewter. Bites best just before rain."

[variety."6361.aurora"]
name.value = "Сияние"
name.en = "Aurora"
description.value = "По телу волнами бегут цвета, от зелёного до фиолетового, и никогда не гаснут. Объяснить это не может никто."
description.en = "Colours ripple over it in waves, green to violet, and never fade. Nobody can explain why."

[variety."6362.rock-mottled"]
name.value = "Каменный узор"
name.en = "Rock-mottled"
description.value = "Бурые разводы, как камни, среди которых эта рыба прячется, и светлая линия вдоль каждого бока."
description.en = "Mottled brown like the rocks it hides among, with a pale line down each flank."

[variety."6362.kelp-green"]
name.value = "Цвет ламинарии"
name.en = "Kelp-green"
description.value = "Буро-зелёный окрас из зарослей ламинарии. Тянет сильнее, чем можно подумать."
description.en = "Green-brown from kelp beds. Pulls harder than it looks."

[variety."6362.sandy"]
name.value = "Песок"
name.en = "Sandy"
description.value = "Бледность пляжа, мелкие веснушки. На тарелке смотрится отлично."
description.en = "Pale as a beach, fine-freckled. Shows up well on a plate."

[variety."6362.harbour-grey"]
name.value = "Портовая серость"
name.en = "Harbour Grey"
description.value = "Серость портовой воды. На вкус после готовки ничуть не хуже."
description.en = "Grey from harbour water. Just as sweet once cooked."

[variety."6362.red-rock"]
name.value = "Красный камень"
name.en = "Red Rock"
description.value = "Ржаво-красный окрас с берегов из красного камня. Местные считают это другой рыбой. Зря."
description.en = "Rusty red, from red-rock coasts. Locals call it a different fish. It isn't."

[variety."6362.leopard"]
name.value = "Леопард"
name.en = "Leopard"
description.value = "Крупные тёмные пятна на песочном теле. Упрямства хватит даже по меркам трески."
description.en = "Bold dark spots on a sandy body. Stubborn even by cod standards."

[variety."6362.barnacled"]
name.value = "В ракушках"
name.en = "Barnacled"
description.value = "На голове ракушки, как на старом днище. Явно занимается этим не первый год."
description.en = "Barnacles on its head, like an old hull. Has clearly been at this a long time."

[variety."6362.golden"]
name.value = "Золото"
name.en = "Golden"
description.value = "Золотые разводы по золоту. Похоже на статую, которую забыли доделать."
description.en = "Gold mottling over gold. Looks like a statue someone forgot to finish."

[variety."6362.granite"]
name.value = "Гранит"
name.en = "Granite"
description.value = "Чёрно-белая крапь, как на жёрнове. И весит, будто жёрнов и есть."
description.en = "Black and white speckle like a millstone. Weighs as if it were one."

[variety."6362.stoneheart"]
name.value = "Каменное сердце"
name.en = "Stoneheart"
description.value = "Чешуя как сланец, между пластинами слабое свечение. Водится там, где утёсы встречаются с глубокой водой, и больше нигде."
description.en = "Scales like slate, a faint glow between them. Found where the cliffs meet deep water, and nowhere else."

[variety."6458.slicked"]
name.value = "В масле"
name.en = "Slicked"
description.value = "Мелкая рыбёшка под чёрной масляной шубой. Где-то выше по течению кто-то очень занят."
description.en = "A small fish under a black coat of oil. Somewhere upstream, somebody is very busy."

[variety."6458.rainbow-slick"]
name.value = "Радужное пятно"
name.en = "Rainbow Slick"
description.value = "Масло на солнце отливает радугой. Красивое зрелище и дурной знак."
description.en = "The oil throws rainbows in the sun. A pretty sight, and a bad sign."

[variety."6458.tarred"]
name.value = "В смоле"
name.en = "Tarred"
description.value = "Густая чёрная смола клочьями. Липнет к леске и к рыболову."
description.en = "Thick black tar in patches. Sticks to the line and the angler."

[variety."6458.muddy"]
name.value = "В грязи"
name.en = "Muddy"
description.value = "Грязи больше, чем масла. Своего рода улучшение."
description.en = "More mud than oil. An improvement, of a sort."

[variety."6458.half-clean"]
name.value = "Чистая половина"
name.en = "Half-clean"
description.value = "Масло досталось только половине. Вторая половина выглядит так, будто тихо выдохнула."
description.en = "The oil only got half of it. The other half looks quietly relieved."

[variety."6458.sulphur-stained"]
name.value = "Серные пятна"
name.en = "Sulphur-stained"
description.value = "Желтизна от чего-то похуже масла. И пахнет соответственно."
description.en = "Yellow from something worse than oil. Smells like it, too."

[variety."6458.rust-streaked"]
name.value = "Ржавые потёки"
name.en = "Rust-streaked"
description.value = "Ржавые потёки от старых машинных стоков. Почти рыба."
description.en = "Streaks of rust from old machine runoff. Very nearly a fish."

[variety."6458.somehow-clean"]
name.value = "Нежданная чистота"
name.en = "Somehow Clean"
description.value = "Чистая, яркая, здоровая. Должно быть, приплыла откуда-то ещё."
description.en = "Clean, bright, healthy. It must have swum in from somewhere else."

[variety."6458.black-gold"]
name.value = "Чёрное золото"
name.en = "Black Gold"
description.value = "Покрыта так густо, что блестит, как начищенный сапог. Старатели смотрят раз — и берутся за кирки."
description.en = "Coated so thick it gleams like a polished boot. Prospectors take one look and start digging."

[variety."6458.still-burning"]
name.value = "Всё ещё горит"
name.en = "Still Burning"
description.value = "Масло на спине всё ещё тлеет, и ничем его не потушить. Готовить лучше не в доме."
description.en = "The oil on its back still smoulders, and nothing puts it out. Best not cooked indoors."

[variety."6522.misshapen"]
name.value = "Уродец"
name.en = "Misshapen"
description.value = "Зелёная, бугристая и неправильная сразу в нескольких местах. Ешьте на свой страх и риск."
description.en = "Green, lumpy and wrong in several places at once. Eat at your own risk."

[variety."6522.purple-finned"]
name.value = "Лиловые плавники"
name.en = "Purple-finned"
description.value = "Плавники цвета синяка. Лучше это или хуже — мнения расходятся."
description.en = "Fins of bruise-purple. Nobody agrees on whether that's better or worse."

[variety."6522.two-tailed"]
name.value = "Два хвоста"
name.en = "Two-tailed"
description.value = "Два хвоста, и плывёт так, будто спорит сама с собой, каким из них пользоваться."
description.en = "Two tails, and it swims as if arguing with itself about which to use."

[variety."6522.spined"]
name.value = "Гребень шипов"
name.en = "Spined"
description.value = "Вдоль спины гребень шипов, которого ещё вчера не было."
description.en = "A ridge of spines down the back that weren't there yesterday."

[variety."6522.many-eyed"]
name.value = "Многоглазье"
name.en = "Many-eyed"
description.value = "Глазчатые пятна по всем бокам. Как минимум два из них моргают."
description.en = "Eyespots all down the flanks. At least two of them blink."

[variety."6522.glowgill"]
name.value = "Светящиеся жабры"
name.en = "Glowgill"
description.value = "Жабры слабо светятся зелёным. Похоже на предупреждение. Так и есть."
description.en = "Gills that glow faintly green. Reads as a warning, and it is."

[variety."6522.lizard-scaled"]
name.value = "Чешуя ящера"
name.en = "Lizard-scaled"
description.value = "Чешуя как шкура ящера. Наполовину рыба, наполовину нечто с собственным мнением."
description.en = "Scales like a raptor's hide. Half fish, half something with opinions."

[variety."6522.pale-nightmare"]
name.value = "Бледный кошмар"
name.en = "Pale Nightmare"
description.value = "Призрачная бледность, сквозь которую видны внутренности. Вид дурного сна посреди бела дня."
description.en = "Ghost-pale, organs faintly visible. Has the look of a bad dream at noon."

[variety."6522.crimson"]
name.value = "Багрянец"
name.en = "Crimson"
description.value = "Красная там, где должна быть зелёной. Байки о часе после такого ужина становятся всё мрачнее."
description.en = "Red where it should be green. The stories about the hour after eating one get worse."

[variety."6522.dreamers-spawn"]
name.value = "Порождение сна"
name.en = "Dreamer's Spawn"
description.value = "Под чешуёй пульсирует зелёный свет, медленный, как дыхание спящего. Пещерный кошмар оставил здесь свой след."
description.en = "Green light pulses beneath its scales, slow as breathing in sleep. The caverns' nightmare left its mark here."

[variety."8365.bright-headed"]
name.value = "Блестящая голова"
name.en = "Bright-headed"
description.value = "Оливковое тело, веснушчатые бока и голова, сияющая, как полированный металл. Обычная форель тёплых рек."
description.en = "Olive body, freckled flanks, a head that shines like polished metal. The usual trout of warm rivers."

[variety."8365.rainbow-banded"]
name.value = "Радужная полоса"
name.en = "Rainbow-banded"
description.value = "Розовая полоса вдоль бока, как у радужной форели."
description.en = "A pink band down the flank, as a rainbow trout wears it."

[variety."8365.brook-spotted"]
name.value = "Ручьевая крапинка"
name.en = "Brook-spotted"
description.value = "Светлые пятна по оливковому — из холодных быстрых ручьёв."
description.en = "Pale spots on olive, from cold quick streams."

[variety."8365.steelhead"]
name.value = "Стальная голова"
name.en = "Steelhead"
description.value = "Сине-серый блеск больших вод. Тянет всерьёз."
description.en = "Grey-blue and bright, from big waters. Pulls like it means it."

[variety."8365.red-spotted"]
name.value = "Красные крапины"
name.en = "Red-spotted"
description.value = "Красные крапины в синих кольцах. Достаточно красиво, чтобы рыболов замешкался перед сковородой."
description.en = "Red spots ringed in blue. Pretty enough to make an angler pause before the pan."

[variety."8365.goldhead"]
name.value = "Золотая голова"
name.en = "Goldhead"
description.value = "Золото там, где положено сиять серебру. Кузнец переспрашивает дважды."
description.en = "Gold where the shine should be silver. The smith asks twice."

[variety."8365.parr-marked"]
name.value = "Мальковые пятна"
name.en = "Parr-marked"
description.value = "Пятна вдоль боков, как отпечатки пальцев, — так их носит молодая форель. Взрослеет не спеша."
description.en = "Thumbprint marks down the flanks, as young trout wear. A late bloomer."

[variety."8365.golden"]
name.value = "Горное золото"
name.en = "Golden"
description.value = "Золото целиком, как у редкой форели высокогорных озёр."
description.en = "Gold all over, like the rare trout of high mountain lakes."

[variety."8365.ironhead"]
name.value = "Чугунная голова"
name.en = "Ironhead"
description.value = "Тёмный окрас и голова будто из чугуна. Готовить так же тяжело."
description.en = "Dark all over, the head like cast iron. Equally hard to cook."

[variety."8365.quicksilver"]
name.value = "Ртуть"
name.en = "Quicksilver"
description.value = "Серебро от носа до хвоста с бледно-голубым отблеском. Тут уж кузнецу есть над чем подумать."
description.en = "Silver from nose to tail, with a pale blue gleam. The smith finally has a case."

[variety."12238.coast-grey"]
name.value = "Береговая серость"
name.en = "Coast Grey"
description.value = "Серый окрас в тёмных разводах, а ширина как у щита. Двигается, только когда приходится."
description.en = "Grey mottled with darker grey, broad as a shield. Moves only when it must."

[variety."12238.mottled"]
name.value = "В пятнах"
name.en = "Mottled"
description.value = "Тёмные пятна, как камни под мелкой водой. Лежит неподвижно и ждёт."
description.en = "Dark blotches like rocks under shallow water. Sits still and waits."

[variety."12238.brown"]
name.value = "Бурый окрас"
name.en = "Brown"
description.value = "Бурый окрас мутных устьев. Похлёбка выходит та же."
description.en = "Brown from muddy estuaries. Makes the same stew."

[variety."12238.moon-pale"]
name.value = "Лунная бледность"
name.en = "Moon-pale"
description.value = "Бледная серость, будто луна выбелила. Похлёбка лучше первого впечатления."
description.en = "Pale grey, as if the moon bleached it. A better stew than first impression."

[variety."12238.rust-spotted"]
name.value = "Ржавые пятна"
name.en = "Rust-spotted"
description.value = "Ржавые пятна по серому, как на якоре, забытом под дождём."
description.en = "Rusty spots over grey, like an anchor left out too long."

[variety."12238.barred"]
name.value = "В полоску"
name.en = "Barred"
description.value = "Широкие тёмные полосы, которые бледнеют в покое. Покоя тут хватает."
description.en = "Broad dark bars that fade when it rests. It rests a lot."

[variety."12238.bigmouth"]
name.value = "Широкая пасть"
name.en = "Bigmouth"
description.value = "В такую пасть поместится фонарь. Возможно, уже помещался."
description.en = "A mouth that could swallow a lantern. Possibly did."

[variety."12238.night-dark"]
name.value = "Ночная тьма"
name.en = "Night-dark"
description.value = "Почти чернота — из самой глубокой части залива. Никто ничего не видит до самой поклёвки."
description.en = "Nearly black, from the deepest part of the bay. Nobody sees it until it bites."

[variety."12238.silverscale"]
name.value = "Серебряная чешуя"
name.en = "Silverscale"
description.value = "Серебро там, где положено быть серому. Береговые рыболовы считают это к удаче. Береговым рыболовам удача нужна."
description.en = "Silver where it should be grey. Coast anglers say it's lucky. Coast anglers need luck."

[variety."12238.moonkissed"]
name.value = "Поцелуй луны"
name.en = "Moonkissed"
description.value = "Бледные искры сияют на тёмном, как звёзды на ночной воде. Если верить байкам, ловится в полнолуние."
description.en = "Pale specks shine on it like stars on dark water. Caught under a full moon, if the stories are right."

[variety."13422.pebble-scaled"]
name.value = "Галька"
name.en = "Pebble-scaled"
description.value = "Чешуя как мелкие серые камешки. Бронники платят хорошо. Угорь против."
description.en = "Scales like small grey stones. Armourers pay well. The eel disagrees."

[variety."13422.slate"]
name.value = "Сланец"
name.en = "Slate"
description.value = "Сизый цвет кровельного сланца. Резать так же трудно."
description.en = "Blue-grey, like roofing slate. Just as hard to cut."

[variety."13422.sandstone"]
name.value = "Песчаник"
name.en = "Sandstone"
description.value = "Тёплая песочная чешуя с пустынных берегов. Кусается всё равно."
description.en = "Warm sandy scales, from desert coasts. Still bites."

[variety."13422.moray-spotted"]
name.value = "Пятна мурены"
name.en = "Moray-spotted"
description.value = "Тёмные пятна по всему телу, как у мурены. Радушия столько же."
description.en = "Dark spots all over, like a moray's hide. Equally pleased to see you."

[variety."13422.banded"]
name.value = "Каменные кольца"
name.en = "Banded"
description.value = "Кольца тёмного камня по всей длине, как на резной колонне."
description.en = "Rings of dark stone down its length, like a carved pillar."

[variety."13422.greenstone"]
name.value = "Замшелый камень"
name.en = "Greenstone"
description.value = "Мшисто-зелёная чешуя. Вид как у камня, что век пролежал на речном дне."
description.en = "Mossy green scales. Looks like it lay on a riverbed for a century."

[variety."13422.marble"]
name.value = "Мрамор"
name.en = "Marble"
description.value = "Белое в серых прожилках, как пол в храме. Бронники за такое дерутся."
description.en = "White veined with grey, like a temple floor. Armourers fight over it."

[variety."13422.obsidian"]
name.value = "Обсидиан"
name.en = "Obsidian"
description.value = "Чёрная стеклянная чешуя, и у каждой чешуйки острый край. Брать за хвост, и осторожно."
description.en = "Black glassy scales with an edge on every one. Handle by the tail, and carefully."

[variety."13422.gold-veined"]
name.value = "Золотая жила"
name.en = "Gold-veined"
description.value = "Золото проходит сквозь серое, как руда сквозь породу. Ювелиры, говорят, плачут."
description.en = "Gold runs through the grey like ore in rock. Jewellers have been known to weep."

[variety."13422.bedrock-ancient"]
name.value = "Древняя порода"
name.en = "Bedrock Ancient"
description.value = "Огромные каменные чешуи в трещинах, и в каждой — янтарный свет. По виду, ровесник утёса, откуда это вылезло."
description.en = "Huge stone scales, cracked and glowing amber in the seams. As old as the cliff it came from, by the look."

[variety."13754.polished"]
name.value = "Полировка"
name.en = "Polished"
description.value = "Коренастое тело, синева и блеск нового сапога. Тянет, как рыба вдвое крупнее."
description.en = "Stout, blue and polished like a new boot. Pulls like something twice its size."

[variety."13754.green-glass"]
name.value = "Зелёное стекло"
name.en = "Green Glass"
description.value = "Зелень бутылки на просвет. И весит так же."
description.en = "Green as a bottle held to the light. Just as heavy."

[variety."13754.dappled"]
name.value = "Солнечные блики"
name.en = "Dappled"
description.value = "Блики бегут по спине, как солнце сквозь мелкую воду."
description.en = "Light dapples across its back like sun through shallow water."

[variety."13754.bronzeback"]
name.value = "Бронзовая спина"
name.en = "Bronzeback"
description.value = "Бронзовая спина, светлое брюхо. Тяжести хватит, чтобы заякорить лодку."
description.en = "A bronze back and a pale belly. Heavy enough to anchor a skiff."

[variety."13754.barred"]
name.value = "В полоску"
name.en = "Barred"
description.value = "Широкие полосы поверх глянца, будто рыба оделась к битве."
description.en = "Broad bars across the gloss, like a fish dressed for battle."

[variety."13754.humpbacked"]
name.value = "С горбом"
name.en = "Humpbacked"
description.value = "За головой горб из мышц. Тянет, как мул."
description.en = "A hump of muscle behind the head. Pulls like a mule."

[variety."13754.mirror"]
name.value = "Зеркало"
name.en = "Mirror"
description.value = "Глянец такой, что рыболов может поправить в нём причёску. После схватки обычно не до того."
description.en = "So glossy the angler can check their hair in it. Most don't, after the fight."

[variety."13754.cobalt"]
name.value = "Кобальт"
name.en = "Cobalt"
description.value = "Глубокая кобальтовая синева с фиолетовым отливом. Выглядит как самоцвет. Весит как наковальня."
description.en = "Deep cobalt blue that shimmers violet. Looks like a jewel. Weighs like an anvil."

[variety."13754.onyx"]
name.value = "Оникс"
name.en = "Onyx"
description.value = "Чёрный глянец, словно лак. Глотает свет — и крючок."
description.en = "Black gloss, as if lacquered. Swallows the light, and the hook."

[variety."13754.tidemight"]
name.value = "Сила прилива"
name.en = "Tidemight"
description.value = "Под глянцем бегут линии морского света. Тянет так, будто на том конце сам прилив."
description.en = "Lines of sea-light run under the gloss. It pulls like the tide itself is on the other end."

[variety."13755.frost-pink"]
name.value = "Морозный румянец"
name.en = "Frost-pink"
description.value = "Бледно-розовая кожа в тёмных крапинах: они то проступают, то гаснут в такт дыханию. Приходит вместе с морозами."
description.en = "Pale pink, freckled with dark spots that come and go as it breathes. Arrives with the frost."

[variety."13755.blushing"]
name.value = "Краска смущения"
name.en = "Blushing"
description.value = "Сплошная краска, как у кальмаров, когда они пугаются. Пугает их обычно рыболов."
description.en = "Flushed red all over, the way squid go when startled. Usually by the angler."

[variety."13755.milky"]
name.value = "Молоко"
name.en = "Milky"
description.value = "Белизна, сквозь которую почти всё видно. Во льду теряется в два счёта."
description.en = "White and nearly see-through. Easy to lose in the ice."

[variety."13755.brindled"]
name.value = "Тёмные полосы"
name.en = "Brindled"
description.value = "Тёмные полосы по мантии, как трещины мороза на оконном стекле."
description.en = "Dark stripes along the mantle, like frost cracks in a window."

[variety."13755.long-armed"]
name.value = "Длинные руки"
name.en = "Long-armed"
description.value = "Щупальца вдвое длиннее обычного. Распутывать ещё дольше, хотя казалось, что дольше некуда."
description.en = "Arms twice the usual length. More to untangle, which seemed impossible."

[variety."13755.ring-spotted"]
name.value = "В кольцах"
name.en = "Ring-spotted"
description.value = "Тёмные кольца по мантии — словно ряд глаз, и все смотрят."
description.en = "Dark rings across the mantle like a row of watching eyes."

[variety."13755.blueflash"]
name.value = "Синяя вспышка"
name.en = "Blueflash"
description.value = "Вспыхивает синим от прикосновения. Прикосновений не любит."
description.en = "Flashes blue when touched. It is not pleased to be touched."

[variety."13755.crimson"]
name.value = "Багрянец"
name.en = "Crimson"
description.value = "Сплошной багрянец, цвет предостережения. Чернил выпускает вдвое больше."
description.en = "Deep crimson all over, the colour of a warning. Inks twice as much."

[variety."13755.glassfrost"]
name.value = "Стеклянный иней"
name.en = "Glassfrost"
description.value = "Прозрачность льда, по краям — изморозь. В руке будто подтаивает. Или так только кажется."
description.en = "Clear as ice, rimed at the edges. Melts a little in the hand, or seems to."

[variety."13755.frostlight"]
name.value = "Морозный свет"
name.en = "Frostlight"
description.value = "В темноте светится бледно-голубым, как луна на свежем снегу. Встречается только в самый лютый холод."
description.en = "Glows pale blue in the dark, like moonlight on new snow. Only seen in the deepest cold."

[variety."13756.lateral-lined"]
name.value = "Боковая линия"
name.en = "Lateral-lined"
description.value = "Зелёная чешуя, по каждому боку тёмная линия. Таится под всем, что даёт тень."
description.en = "Green with a dark line down each flank. Lurks under anything that gives shade."

[variety."13756.lily-pad"]
name.value = "Лист кувшинки"
name.en = "Lily-pad"
description.value = "Пятна, как пруд в кувшинках, — там и прячется."
description.en = "Mottled like a pond full of lily pads, which is exactly where it lurks."

[variety."13756.bronze"]
name.value = "Бронза"
name.en = "Bronze"
description.value = "Бронза с бледными поперечными полосами, из каменистых вод. Прыгает чаще зелёных."
description.en = "Bronze with faint bars, from rocky water. Jumps more than the green ones."

[variety."13756.sun-bleached"]
name.value = "Выгоревшая полоса"
name.en = "Sun-bleached"
description.value = "Бледность от мелкой летней воды, полоса выцвела до мазка. Держать в руке тепло."
description.en = "Pale from shallow summer water, the stripe faded to a smudge. Warm to hold."

[variety."13756.bucketmouth"]
name.value = "Пасть-ведро"
name.en = "Bucketmouth"
description.value = "Пасть как ведро. Глотает приманки целиком, а порой и утят."
description.en = "A mouth like a bucket. Swallows lures whole, and sometimes small ducks."

[variety."13756.red-eyed"]
name.value = "Красные глаза"
name.en = "Red-eyed"
description.value = "Глаза красные, как летний закат. Жаднее всего кормится в вечерний зной."
description.en = "Eyes red as a summer sunset. Feeds hardest in the evening heat."

[variety."13756.tiger"]
name.value = "Тигр"
name.en = "Tiger"
description.value = "Тёмные полосы с разрывами, как у тигра. И дерётся как тигр — недолго."
description.en = "Dark bars broken like tiger stripes. Fights like one, briefly."

[variety."13756.golden"]
name.value = "Золото"
name.en = "Golden"
description.value = "Золото с бронзовой полосой. Целый летний полдень, только в чешуе."
description.en = "Gold with a bronze stripe. A summer's afternoon of a fish."

[variety."13756.shadow"]
name.value = "Тень"
name.en = "Shadow"
description.value = "Чёрно-зелёная окраска, в воде почти не разглядеть. Живёт в тени и другого не ищет."
description.en = "Black-green and hard to see. Lives in the shade and prefers it."

[variety."13756.midsummer"]
name.value = "Разгар лета"
name.en = "Midsummer"
description.value = "Светится тёплым золотом, как самый долгий вечер в году. Ловится в самый разгар лета — и больше никогда."
description.en = "Glows warm gold, like the longest evening of the year. Caught at the height of summer, and only then."

[variety."13757.thunder-dark"]
name.value = "Грозовая тьма"
name.en = "Thunder-dark"
description.value = "Тёмно-оливковая окраска и гудение. Покалывает. Лизать не стоит."
description.en = "Olive-dark and buzzing. Tingles. Don't lick it."

[variety."13757.bolt-striped"]
name.value = "Зигзаг молнии"
name.en = "Bolt-striped"
description.value = "Жёлтые зигзаги по бокам, как молния на детском рисунке."
description.en = "Yellow zigzags down the flanks, like a child's drawing of lightning."

[variety."13757.slate"]
name.value = "Грозовая туча"
name.en = "Slate"
description.value = "Цвет грозовых туч. Гудит на тон ниже."
description.en = "Grey as storm clouds. Hums at a lower note."

[variety."13757.ember-bellied"]
name.value = "Огненное брюшко"
name.en = "Ember-bellied"
description.value = "Оранжевое брюхо, как у электрических угрей тёплых рек. Кусается с искрой."
description.en = "An orange belly, like an electric eel of warm rivers. Bites with a spark."

[variety."13757.spark-spotted"]
name.value = "Искристые пятна"
name.en = "Spark-spotted"
description.value = "Бледные пятна потрескивают, когда рыба бьётся. Перчатки не спасают."
description.en = "Pale spots that crackle when it thrashes. Gloves are no help."

[variety."13757.long"]
name.value = "Длинный плавник"
name.en = "Long"
description.value = "Плавник во всю длину тела. Полощется, как флаг на штормовом ветру."
description.en = "A fin that runs the whole length of its body. It ripples like a flag in a gale."

[variety."13757.ozone"]
name.value = "Запах грозы"
name.en = "Ozone"
description.value = "Пахнет дождём после грозы. Воздух вокруг становится острым."
description.en = "Smells of rain after a storm. The air around it goes sharp."

[variety."13757.white-bolt"]
name.value = "Белая молния"
name.en = "White Bolt"
description.value = "Белизна вспышки молнии. Извивается — и на миг слепит."
description.en = "White as a lightning flash, and briefly blinding when it twists."

[variety."13757.blackout"]
name.value = "Тихая тьма"
name.en = "Blackout"
description.value = "Чернота и тишина — до первого прикосновения. Потом уже никакой тишины."
description.en = "Black and silent until touched. Then not silent at all."

[variety."13757.stormcaller"]
name.value = "Зов бури"
name.en = "Stormcaller"
description.value = "По телу ветвятся синие молнии и уходят в воду. Пока добыча на леске, сгущаются тучи. Или так кажется."
description.en = "Blue lightning forks across its body and into the water. Clouds gather while it's on the line, or seem to."

[variety."13758.ember-gilled"]
name.value = "Тлеющие жабры"
name.en = "Ember-gilled"
description.value = "Полосы как у окуня, жабры красные, как угли. Обычный вид и обычный нрав."
description.en = "Barred like a perch, with gills red as embers. The usual look, and the usual temper."

[variety."13758.yellow"]
name.value = "Желтизна"
name.en = "Yellow"
description.value = "Жёлто-золотая чешуя в тёмных полосах. В зелёной воде горит, как фонарь."
description.en = "Yellow-gold with dark bars. Bright as a lamp in green water."

[variety."13758.olive"]
name.value = "Олива"
name.en = "Olive"
description.value = "Тёмная олива, из заросших рек. На таком фоне жабры горят ярче."
description.en = "Darker olive, from overgrown rivers. The gills shine brighter by contrast."

[variety."13758.spotted"]
name.value = "В пятнышках"
name.en = "Spotted"
description.value = "Вместо полос — пятна. Нрав тот же."
description.en = "Spots instead of bars. Same temper."

[variety."13758.redfin"]
name.value = "Красные плавники"
name.en = "Redfin"
description.value = "Плавники красные, как и жабры. Вся рыба будто сердится. Так и есть."
description.en = "Fins as red as the gills. The whole fish looks angry, because it is."

[variety."13758.cinder"]
name.value = "Зола"
name.en = "Cinder"
description.value = "Пепельно-серая чешуя и тлеющие красные жабры — как уголёк из погасшего костра."
description.en = "Ash-grey with glowing red gills, like a coal pulled from a dead fire."

[variety."13758.fire-gilled"]
name.value = "Огненные жабры"
name.en = "Fire-gilled"
description.value = "Жабры и правда светятся. Хватало ли воде холода — никто не поручится."
description.en = "The gills actually glow. Nobody's sure the water was cold enough."

[variety."13758.golden"]
name.value = "Золото"
name.en = "Golden"
description.value = "Золото с алыми жабрами. Будто из фонтана в господском саду."
description.en = "Gold with scarlet gills. Looks like something from a lord's fountain."

[variety."13758.ghost"]
name.value = "Призрак"
name.en = "Ghost"
description.value = "Бледная чешуя, розовые жабры, едва заметные полосы. Холодит руку даже летом."
description.en = "Pale, with pink gills and faint bars. Feels cold even in summer."

[variety."13758.fel-scarred"]
name.value = "Шрамы Скверны"
name.en = "Fel-scarred"
description.value = "Под чешуёй, где положено быть красному, бежит зелёный огонь. Родом из воды, что помнит порчу."
description.en = "Green fire runs under the scales where its red should be. It came from water that remembers a corruption."

[variety."13759.starfeeder"]
name.value = "Звёздный ужин"
name.en = "Starfeeder"
description.value = "Тёмно-фиолетовая окраска, плавники цвета ночи. Кормится при свете звёзд."
description.en = "Dark violet with fins like the night. Feeds by starlight."

[variety."13759.dusk"]
name.value = "Сумерки"
name.en = "Dusk"
description.value = "Фиолетовая спина, розовое брюхо — как небо сразу после заката."
description.en = "Violet back, rose belly, like the sky just after sunset."

[variety."13759.indigo"]
name.value = "Индиго"
name.en = "Indigo"
description.value = "Густое индиго. Стоит луне зайти за тучу — пропадает в воде."
description.en = "Deep indigo. Vanishes in the water as soon as the moon goes in."

[variety."13759.star-speckled"]
name.value = "Россыпь звёзд"
name.en = "Star-speckled"
description.value = "Бледные крапины по спине, как небо, где зажглось всего несколько звёзд."
description.en = "Pale specks along the back, like a sky with a few stars out."

[variety."13759.moonfin"]
name.value = "Лунный плавник"
name.en = "Moonfin"
description.value = "Серебристо-белые плавники ловят лунный свет. Рыболовы постепенно привыкают любить темноту."
description.en = "Silver-white fins that catch the moonlight. Anglers learn to like the dark."

[variety."13759.crescent-marked"]
name.value = "Полумесяц"
name.en = "Crescent-marked"
description.value = "На каждом боку бледный полумесяц, будто луна оставила отпечаток пальца."
description.en = "A pale crescent on each flank, as if the moon left a fingerprint."

[variety."13759.owl-eyed"]
name.value = "Совиные глаза"
name.en = "Owl-eyed"
description.value = "Огромные золотые глаза, созданные для темноты. Смотрит в ответ не мигая."
description.en = "Huge golden eyes made for the dark. Stares right back."

[variety."13759.eclipse"]
name.value = "Затмение"
name.en = "Eclipse"
description.value = "Чернота с золотой каймой по плавникам — как погасшее солнце."
description.en = "Black, rimmed with gold at the fins, like the sun gone dark."

[variety."13759.dawn-caught"]
name.value = "Заря"
name.en = "Dawn-caught"
description.value = "Розовое с золотом: попадается, когда ночь на исходе. Ночная рыба, что засиделась допоздна."
description.en = "Pink and gold, caught as the night ended. A night fish that stayed up too late."

[variety."13759.starsong"]
name.value = "Песнь звёзд"
name.en = "Starsong"
description.value = "Крапины сияют, как ночное небо, и движутся при каждом повороте, будто кружат звёзды. На причале все замолкают."
description.en = "Its specks shine like the night sky and move as it turns, like stars wheeling. Silence falls on the dock."

[variety."13760.coin-scaled"]
name.value = "Чешуя-монеты"
name.en = "Coin-scaled"
description.value = "Серебро с золотыми искрами в чешуе: блестят, как монеты на дне ручья."
description.en = "Silver with gold-flecked scales that catch the light like coins in a stream."

[variety."13760.morning"]
name.value = "Утро"
name.en = "Morning"
description.value = "Персиковый румянец по брюху, как первый свет на реке."
description.en = "Flushed peach along the belly, like first light on a river."

[variety."13760.river-dark"]
name.value = "Речная тень"
name.en = "River-dark"
description.value = "Окраска темнее, из затенённых рек. Золотые искры на ней заметнее."
description.en = "Darker, from shaded rivers. The gold flecks stand out."

[variety."13760.silverbright"]
name.value = "Яркое серебро"
name.en = "Silverbright"
description.value = "Сияющее серебро, только что из моря. Золота — едва искорка."
description.en = "Bright silver, fresh from the sea. Barely a fleck of gold."

[variety."13760.red-run"]
name.value = "Красный ход"
name.en = "Red Run"
description.value = "К нерестовому ходу краснеет, голова остаётся зелёной. В хороший год от них красна вся река."
description.en = "Gone red for the spawning run, with a green head. The river turns red with them in a good year."

[variety."13760.hooknose"]
name.value = "Нос крючком"
name.en = "Hooknose"
description.value = "Свирепая челюсть крючком — след долгого пути вверх по реке. С таким видом впору драться с медведем."
description.en = "A fierce hooked jaw from its run upriver. Looks ready to fight a bear."

[variety."13760.noonday"]
name.value = "Полдень"
name.en = "Noonday"
description.value = "Золото по всей спине, как река в полдень."
description.en = "Gold all along the back, like a river at noon."

[variety."13760.copper"]
name.value = "Медь"
name.en = "Copper"
description.value = "Начищенная медь от головы до хвоста. На вкус лосось, на вид чайник."
description.en = "Polished copper from head to tail. Tastes like salmon, looks like a kettle."

[variety."13760.twilight"]
name.value = "Закатный час"
name.en = "Twilight"
description.value = "Фиолетовое с оранжевым, как последний свет на реке. К полной темноте — ни следа."
description.en = "Violet and orange, like the last light on the river. Gone by full dark."

[variety."13760.sunfire"]
name.value = "Солнечный огонь"
name.en = "Sunfire"
description.value = "Каждая чешуйка горит золотом, как крошечное солнце. Греет, как камень у очага. Смотреть прямо трудно."
description.en = "Every scale lit gold like a tiny sun. Warm as a hearthstone. Hard to look at directly."

[variety."13888.blue-black"]
name.value = "Чёрная синева"
name.en = "Blue-black"
description.value = "Иссиня-чёрный панцирь в мелкую крапинку, клешни вперёд. Такие сидят под каждым камнем в заливе."
description.en = "Blue-black shell, lightly speckled, claws first. The kind that hides under every rock in the bay."

[variety."13888.sea-green"]
name.value = "Морская зелень"
name.en = "Sea-green"
description.value = "Зелень с чернотой, как у омаров холодных морей."
description.en = "Green-black, like a lobster of colder seas."

[variety."13888.mud-brown"]
name.value = "Бурый ил"
name.en = "Mud-brown"
description.value = "Бурый цвет — с илистых отмелей. Щиплется так же больно."
description.en = "Brown from muddy shelves. Pinches just as hard."

[variety."13888.barnacled"]
name.value = "В ракушках"
name.en = "Barnacled"
description.value = "Весь панцирь в морских желудях. Линька давно позади, и сожалений никаких."
description.en = "Barnacles all over the shell. Hasn't moulted in a long while, and isn't sorry."

[variety."13888.red-banded"]
name.value = "Красные полосы"
name.en = "Red-banded"
description.value = "Красные полосы поперёк хвоста — вид, будто только что из котла. Нет, не из котла."
description.en = "Red bands across the tail. Looks half-cooked already. Isn't."

[variety."13888.bigclaw"]
name.value = "Большая клешня"
name.en = "Bigclaw"
description.value = "Одна клешня вдвое больше другой. Какую пускать в ход — известно точно."
description.en = "One claw twice the size of the other. Knows exactly which one to use."

[variety."13888.calico"]
name.value = "Черепаховая масть"
name.en = "Calico"
description.value = "Рыжие и чёрные пятна, как у черепаховой кошки. Верят в это немногие."
description.en = "Orange and black in patches, like a tortoiseshell cat. Hardly anyone believes it."

[variety."13888.sapphire"]
name.value = "Сапфир"
name.en = "Sapphire"
description.value = "Яркая синева от усов до хвоста. Такая удача выпадает раз на великое множество. Щиплется, как все."
description.en = "Bright blue all over. One in a great many. Pinches like the rest."

[variety."13888.ghost"]
name.value = "Призрак"
name.en = "Ghost"
description.value = "Белизна кости. Даже клешни бледные. А вот нрав — ничуть."
description.en = "White as bone. Even the claws are pale. Even the temper isn't."

[variety."13888.abyssal"]
name.value = "Из бездны"
name.en = "Abyssal"
description.value = "Из сочленений панциря сочится фиолетовый свет. Путь наверх из самых глубин, судя по нраву, пришёлся не по душе."
description.en = "Violet light glows from the joints of its shell. Climbed up from very deep water, and seems annoyed about it."

[variety."13889.frost-white"]
name.value = "Иней"
name.en = "Frost-white"
description.value = "Бледное серебро в лёгкую крапинку, холодное на ощупь, сколько ни лежи на солнце."
description.en = "Pale silver, lightly speckled, cold to the touch however long it sits in the sun."

[variety."13889.silverblue"]
name.value = "Серебряная синева"
name.en = "Silverblue"
description.value = "Синеватый отлив по спине — от ледниковой воды."
description.en = "A blue cast along the back, from glacier water."

[variety."13889.snowflake"]
name.value = "Снежинка"
name.en = "Snowflake"
description.value = "Ярко-белые пятна на серебре, как снег на замёрзшем озере."
description.en = "Bright white spots on silver, like snow on a frozen lake."

[variety."13889.pearl"]
name.value = "Жемчуг"
name.en = "Pearl"
description.value = "Жемчужный отлив, и ни единого пятнышка. Словно резная работа."
description.en = "A pearly sheen with no spots at all. Looks carved."

[variety."13889.spawn-blush"]
name.value = "Нерестовый румянец"
name.en = "Spawn-blush"
description.value = "Розовый румянец по бокам к нересту. В такой холодной воде — редкость."
description.en = "A pink blush along the flanks for spawning. Rare in such cold water."

[variety."13889.hot-spring"]
name.value = "Горячий ключ"
name.en = "Hot-spring"
description.value = "Окраска теплее — из вод, где бьют горячие ключи. На берегу от чешуи идёт пар."
description.en = "Warmer-toned, from waters where the springs rise. Steam comes off it when landed."

[variety."13889.hooknose"]
name.value = "Нос крючком"
name.en = "Hooknose"
description.value = "Челюсть крючком и холодный взгляд. Иней на усах, которых нет."
description.en = "A hooked jaw and a cold stare. Frost on the whiskers that it doesn't have."

[variety."13889.crystal"]
name.value = "Хрусталь"
name.en = "Crystal"
description.value = "Местами прозрачность льда. На сковороде выглядит как-то неправильно."
description.en = "Clear as ice in places. The pan seems wrong somehow."

[variety."13889.ashen"]
name.value = "Пепел"
name.en = "Ashen"
description.value = "Серость пепла — из вод у зачумлённых земель. Есть, говорят, всё ещё можно."
description.en = "Grey as ash, from waters near the blighted lands. Still fine eating, they say."

[variety."13889.wintersheen"]
name.value = "Зимний блеск"
name.en = "Wintersheen"
description.value = "Морозные узоры покрывают каждую чешуйку и светятся бледно-голубым. Не оттаивает никогда, даже на сковороде."
description.en = "Frost patterns cover every scale and glow faintly blue. It never thaws, not even in the pan."

[variety."13890.bony-backed"]
name.value = "Костяная спина"
name.en = "Bony-backed"
description.value = "Костяные щитки вдоль спины, как у осетра. Броня снаружи, норов внутри."
description.en = "Bony plates down the back like a sturgeon. Wears its armour outside, temper inside."

[variety."13890.bronze-plated"]
name.value = "Бронзовые латы"
name.en = "Bronze-plated"
description.value = "Пластины цвета старой бронзы. Хоть сейчас на парад."
description.en = "Plates the colour of old bronze. Looks fit for a parade."

[variety."13890.iron-plated"]
name.value = "Железные латы"
name.en = "Iron-plated"
description.value = "Серые пластины, как железный доспех. Нож нужен потяжелее."
description.en = "Grey plates like iron armour. Bring a heavier knife."

[variety."13890.moss-backed"]
name.value = "Мшистая спина"
name.en = "Moss-backed"
description.value = "Зелёный мох на пластинах. Долго ни с места, а потом вдруг — с места, и ещё как."
description.en = "Green moss on its plates. Hasn't moved in a while, then suddenly has."

[variety."13890.spiked"]
name.value = "Шипы"
name.en = "Spiked"
description.value = "Каждая пластина с шипом на конце. Благоразумные рыболовы берут сачок."
description.en = "Every plate tipped with a spike. Sensible anglers use the net."

[variety."13890.battle-scarred"]
name.value = "Боевые шрамы"
name.en = "Battle-scarred"
description.value = "Вмятины на пластинах и старые борозды. Кто-то пытался это съесть. Кто-то передумал."
description.en = "Dented plates and old gouges. Whatever tried to eat it gave up."

[variety."13890.ring-plated"]
name.value = "Кольчатые латы"
name.en = "Ring-plated"
description.value = "Пластины ровными кольцами, как доспех из стальных обручей."
description.en = "Plates in neat rings, like a coat of banded mail."

[variety."13890.gilded"]
name.value = "Позолота"
name.en = "Gilded"
description.value = "Пластины с золотой каймой, как парадный доспех рыцаря. И дерётся по-рыцарски."
description.en = "Gold-edged plates, like a knight's parade armour. Fights like a knight, too."

[variety."13890.ore-plated"]
name.value = "Рудные латы"
name.en = "Ore-plated"
description.value = "Пластины с зеленовато-серым блеском, как самая твёрдая руда в горах. Нож сдаётся первым."
description.en = "Plates with a green-grey shine, like the hardest ore in the mountains. The knife gives up first."

[variety."13890.ancient-bulwark"]
name.value = "Древний оплот"
name.en = "Ancient Bulwark"
description.value = "Пластины толщиной со щит, по ним бегут древние линии, светясь золотом. Будто кто-то давным-давно выковал этот доспех и пустил плавать."
description.en = "Plates thick as shields, carved with old lines that glow gold. As if somebody forged it long ago and set it swimming."

[variety."13893.big-blue"]
name.value = "Большая синева"
name.en = "Big Blue"
description.value = "Огромный синий бок во всю ширь. Нужны обе руки и, пожалуй, друг."
description.en = "Huge, blue and broad. Both hands, and probably a friend."

[variety."13893.storm-grey"]
name.value = "Цвет шторма"
name.en = "Storm-grey"
description.value = "Серость залива в шторм. И весит, кажется, столько же."
description.en = "Grey as the bay in a storm. Feels like it weighs as much."

[variety."13893.barred"]
name.value = "Корабельные рёбра"
name.en = "Barred"
description.value = "Широкие тёмные полосы по бокам, как шпангоуты на корпусе корабля."
description.en = "Broad dark bars down its sides like ribs on a ship's hull."

[variety."13893.sea-green"]
name.value = "Глубинная зелень"
name.en = "Sea-green"
description.value = "Зелень глубокой воды. В лодку втягивают втроём."
description.en = "Green as deep water. Takes three to pull it into the boat."

[variety."13893.old-scarback"]
name.value = "Старый рубец"
name.en = "Old Scarback"
description.value = "Шрамы от зубов крупнее, чем хотелось бы встретить любому рыболову."
description.en = "Scars from teeth bigger than any angler wants to meet."

[variety."13893.hump-shouldered"]
name.value = "Горбатая холка"
name.en = "Hump-shouldered"
description.value = "Огромный горб за головой. Сложение — как у сваи причала."
description.en = "A great hump behind the head. Built like a dock piling."

[variety."13893.spotted"]
name.value = "Пятна пены"
name.en = "Spotted"
description.value = "Бледные пятна по тёмной спине, как пена на волне."
description.en = "Pale spots across a dark back like foam on a wave."

[variety."13893.golden"]
name.value = "Золотой великан"
name.en = "Golden"
description.value = "Золотой великан. Без самой рыбы в эту историю никто не поверит."
description.en = "A golden giant. Nobody believes the story without the fish."

[variety."13893.abyss-dark"]
name.value = "Тьма бездны"
name.en = "Abyss-dark"
description.value = "Чёрно-синяя окраска, из самой глубокой впадины залива. Тянет так, будто впадина требует вернуть своё."
description.en = "Black-blue, from the deepest trench of the bay. Tugs like the trench wants it back."

[variety."13893.leviathans-get"]
name.value = "Отпрыск левиафана"
name.en = "Leviathan's Get"
description.value = "Вдоль боков светятся линии, как древние руны. Самые старые сказания залива — о ком-то покрупнее. Но для начала неплохо."
description.en = "Glowing lines like old runes along its flanks. The bay's oldest stories are about something bigger than this. It's a start."

[variety."16967.yellowfin"]
name.value = "Жёлтые плавники"
name.en = "Yellowfin"
description.value = "Тёмно-синяя спина, серебряное брюхо, длинные жёлтые плавники. Та самая рыба, которой славится река."
description.en = "Dark blue back, silver belly, long yellow fins. The fish the river is famous for."

[variety."16967.verdant"]
name.value = "Лесная зелень"
name.en = "Verdant"
description.value = "Зеленоватый отлив по спине — от речной воды под великими деревьями."
description.en = "A green cast along the back, from river water under the great trees."

[variety."16967.feeding-barred"]
name.value = "Полосы кормёжки"
name.en = "Feeding-barred"
description.value = "На боках вспыхивают бледные полосы, как у тунца в погоне за добычей. Трапеза прервана на середине."
description.en = "Pale bars flash on its flanks, as tuna show when hunting. Caught mid-meal."

[variety."16967.silverflank"]
name.value = "Серебряный бок"
name.en = "Silverflank"
description.value = "Яркое серебро во весь бок. Жёлтые плавники — будто нарисованные."
description.en = "Brighter silver all down the side. The yellow fins look painted on."

[variety."16967.sickle-fin"]
name.value = "Плавники-серпы"
name.en = "Sickle-fin"
description.value = "Плавники длинные, изогнутые, как серпы. Созданы для долгих странствий вниз по реке."
description.en = "Fins grown long and curved like sickles. Built for long journeys downriver."

[variety."16967.gold-belted"]
name.value = "Золотой пояс"
name.en = "Gold-belted"
description.value = "Золотая полоса от глаза до хвоста. Рыба для чужой просьбы — и в самом нарядном платье."
description.en = "A gold stripe from eye to tail. A favour fish in its finest clothes."

[variety."16967.mossback"]
name.value = "Мох на спине"
name.en = "Mossback"
description.value = "Спина зелено-чёрная, будто на ней вырос лес. Плывёт медленно, потом очень быстро."
description.en = "Green-black above, as if the forest grew on it. Swims slow, then very fast."

[variety."16967.imperial"]
name.value = "Царская синева"
name.en = "Imperial"
description.value = "Густая царская синева и ярко-золотые плавники. Слишком нарядно, чтобы ловить кому-то в угоду."
description.en = "Deep royal blue with fins of bright gold. Looks too fine to be a favour for anybody."

[variety."16967.ghostfin"]
name.value = "Призрачный плавник"
name.en = "Ghostfin"
description.value = "Бледность во всём теле, плавники почти прозрачные. Плывёт, как отражение."
description.en = "Pale all over, the fins almost clear. Swims like a reflection."

[variety."16967.leaf-lit"]
name.value = "Свет сквозь листву"
name.en = "Leaf-lit"
description.value = "Под чешуёй ходит бледно-зелёный свет, как солнце сквозь листву. В этих водах живёт древняя магия леса."
description.en = "Pale green light moves under its scales like sun through leaves. The forest's old magic is in these waters."

[variety."16968.silver-barred"]
name.value = "Серебряные полосы"
name.en = "Silver-barred"
description.value = "Длинное серебряное тело в полосах, пасть полна зубов. Создано для одного дела."
description.en = "Long, silver and barred, with a jaw full of teeth. Built for one thing."

[variety."16968.sandstrand"]
name.value = "Песчаная отмель"
name.en = "Sandstrand"
description.value = "Песочный окрас — с мелководья у сухого берега. Не видно, пока не ударит."
description.en = "Sand-coloured, from the shallows of a dry coast. Invisible until it strikes."

[variety."16968.spotted"]
name.value = "Чёрные пятна"
name.en = "Spotted"
description.value = "Чёрные пятна у хвоста, как бывает у подросших. По-прежнему ищет, с кем бы поспорить."
description.en = "Black spots near the tail, as the big ones grow. Still waiting for an argument."

[variety."16968.greyback"]
name.value = "Серая спина"
name.en = "Greyback"
description.value = "Сверху простая серость, снизу белизна. Только зубы и умысел."
description.en = "Plain grey above, white below. Just teeth and intent."

[variety."16968.needlejaw"]
name.value = "Пасть-игольница"
name.en = "Needlejaw"
description.value = "Зубы — как ряд иголок. Пальцы потом пересчитайте."
description.en = "Teeth like a row of needles. Count your fingers after."

[variety."16968.bronze"]
name.value = "Бронза"
name.en = "Bronze"
description.value = "Бронзовые полосы, из тёплой воды. Норова вдвое больше."
description.en = "Bronze-barred, from warm water. Twice the temper."

[variety."16968.chevron"]
name.value = "Шевроны"
name.en = "Chevron"
description.value = "Тёмные шевроны по спине — стрелки, указывающие на неприятности."
description.en = "Dark chevrons down its back like arrows pointing at trouble."

[variety."16968.blackback"]
name.value = "Чёрная спина"
name.en = "Blackback"
description.value = "Сверху чернота, снизу сталь. Бьёт из темноты."
description.en = "Black above, steel below. Strikes from the dark."

[variety."16968.ghost"]
name.value = "Призрак"
name.en = "Ghost"
description.value = "Белизна, почти прозрачная; от полос осталась лишь тень. Зато зубы вполне настоящие."
description.en = "White and nearly clear, the bars a shadow of themselves. The teeth are perfectly solid."

[variety."16968.bonecutter"]
name.value = "Костолом"
name.en = "Bonecutter"
description.value = "Зубы — что костяные пилы, спина в старых отметинах. На сухом побережье рассказывают, что эта рыба пережила трёх охотников."
description.en = "Teeth like bone saws and a back covered in old marks. Dry-coast stories say it outlived three hunters."

[variety."16969.spotted-sail"]
name.value = "Парус в крапинку"
name.en = "Spotted Sail"
description.value = "Синяя спина, серебряное брюхо, высокий парус в пятнах. Поднимает его, едва кто-то посмотрит."
description.en = "Blue back, silver belly, a tall sail dotted with spots. Raises it the moment anyone watches."

[variety."16969.barred"]
name.value = "Боевые полосы"
name.en = "Barred"
description.value = "Бледно-синие полосы на боках вспыхивают посреди схватки. Лучше всего видны в воздухе — там и проходит почти вся схватка."
description.en = "Pale blue bars down the flanks, lit up mid-fight. Best seen in the air, which is where it spends the fight."

[variety."16969.violet-sail"]
name.value = "Фиалковый парус"
name.en = "Violet Sail"
description.value = "Парус светится фиолетовым, когда рыба волнуется. Волнуется она всегда."
description.en = "The sail glows violet when it's excited. It's always excited."

[variety."16969.silver"]
name.value = "Серебро"
name.en = "Silver"
description.value = "Больше серебра, чем синевы. Парус всё так же ярок."
description.en = "Silver more than blue. The sail stays bright as ever."

[variety."16969.tall-sailed"]
name.value = "Высокий парус"
name.en = "Tall-sailed"
description.value = "Парус выше самой рыбы. На леске его подхватывает ветер."
description.en = "A sail taller than the fish is deep. Wind catches it on the line."

[variety."16969.jungle-green"]
name.value = "Зелень джунглей"
name.en = "Jungle-green"
description.value = "Зелень джунглей, что подступают к берегу. Красуется точно так же."
description.en = "Green as the jungle behind the coast. Shows off just the same."

[variety."16969.sunset-sail"]
name.value = "Закатный парус"
name.en = "Sunset Sail"
description.value = "Оранжевый парус, как побережье вечером. Прыгает чаще синих."
description.en = "An orange sail, like the coast at evening. Leaps more than the blue ones."

[variety."16969.royal"]
name.value = "Королевская синева"
name.en = "Royal"
description.value = "Густая королевская синева, парус в золотых крапинах. Подержать дают по очереди."
description.en = "Deep royal blue, the sail spotted gold. Anglers take turns holding it."

[variety."16969.white-sail"]
name.value = "Белый парус"
name.en = "White Sail"
description.value = "Бледность корабельной парусины. Моряки клянутся, что это к хорошей погоде."
description.en = "Pale as a ship's canvas. Sailors swear it's a sign of good weather."

[variety."16969.skyleaper"]
name.value = "Прыжок в небо"
name.en = "Skyleaper"
description.value = "В прыжке по парусу бегут линии синего света. В воздухе будто зависает дольше, чем положено рыбе."
description.en = "Lines of blue light ripple up the sail as it leaps. Seems to hang in the air longer than any fish should."

[variety."16970.dorado"]
name.value = "Дорадо"
name.en = "Dorado"
description.value = "Зелень и золото в синих пятнах — словно попугай, решивший заняться плаванием."
description.en = "Green and gold with blue spots, like a parrot that took up swimming."

[variety."16970.gold-flanked"]
name.value = "Золотые бока"
name.en = "Gold-flanked"
description.value = "Золота больше, чем зелени. Вскоре после поимки сереет, так что смотрите быстрее."
description.en = "More gold than green. Fades to grey soon after landing, so look quickly."

[variety."16970.bluefin"]
name.value = "Синий плавник"
name.en = "Bluefin"
description.value = "Синева по спине и плавникам. Нрав поспокойнее. Ненамного."
description.en = "Blue along the back and fins. Cooler-headed. Not by much."

[variety."16970.reed-green"]
name.value = "Зелень камыша"
name.en = "Reed-green"
description.value = "Тусклая зелень, из туманных камышей. Не разглядеть, пока не выпрыгнет."
description.en = "Dull green, from the misty reeds. Hard to see until it jumps."

[variety."16970.bull-headed"]
name.value = "Бычий лоб"
name.en = "Bull-headed"
description.value = "Тупой высокий лоб, как у матёрого самца. Идёт на лодку в лобовую."
description.en = "A blunt, tall forehead like a bull mahi. Charges the boat."

[variety."16970.barred"]
name.value = "Полосы гнева"
name.en = "Barred"
description.value = "На крючке по бокам вспыхивают тёмные полосы. Это ярость."
description.en = "Dark bars flash on its sides when hooked. It's furious."

[variety."16970.fog-pale"]
name.value = "Туманная бледность"
name.en = "Fog-pale"
description.value = "Бледность, будто болотный туман въелся в окраску. Сперва дерётся, как туман, потом — как мул."
description.en = "Pale, as if the swamp mist got into the colour. Fights like a fog bank, then like a mule."

[variety."16970.emerald"]
name.value = "Изумруд"
name.en = "Emerald"
description.value = "Чистая зелень, ни капли золота. Будто самоцвет, оброненный в болото."
description.en = "Pure green, no gold at all. Like a gem dropped in the marsh."

[variety."16970.sunfire"]
name.value = "Огонь у воды"
name.en = "Sunfire"
description.value = "Оранжевое с золотом, как костёр у самой воды. Болото затихает, чтобы посмотреть."
description.en = "Orange and gold, like a fire at the water's edge. The swamp goes quiet to look."

[variety."16970.marsh-lantern"]
name.value = "Болотный фонарь"
name.en = "Marsh Lantern"
description.value = "Пятна светятся зелёным золотом в тумане, как фонари на болоте. Местные говорят, такие уводят рыболовов с пути."
description.en = "Its spots glow green-gold in the mist, like lanterns in a swamp. Locals say it leads anglers astray."

[variety."19807.contest-speckle"]
name.value = "Крапинка с состязаний"
name.en = "Contest Speckle"
description.value = "Серебристо-серая чешуя в веснушках. Каждый участник состязания на причале узнаёт эту окраску с первого взгляда."
description.en = "Silvery-grey and freckled. Every contestant on the dock knows this one by sight."

[variety."19807.silver-speckle"]
name.value = "Серебряная крапинка"
name.en = "Silver Speckle"
description.value = "Серебро поярче, из открытой воды. Веснушки те же."
description.en = "Brighter silver, from open water. Same freckles."

[variety."19807.olive"]
name.value = "Олива"
name.en = "Olive"
description.value = "Зелёная спина, из заросшего мелководья. Участники всё равно хватают."
description.en = "Green-backed, from weedy shallows. Contestants grab them anyway."

[variety."19807.big-spotted"]
name.value = "Крупные пятна"
name.en = "Big-spotted"
description.value = "Пятна, как разбросанные монеты. Кто-нибудь обязательно скажет, что это другая рыба."
description.en = "Spots like thrown coins. Somebody always claims it's a different fish."

[variety."19807.red-speckled"]
name.value = "Красные веснушки"
name.en = "Red-speckled"
description.value = "Красные веснушки. Вид такой, будто уже посолили и поперчили."
description.en = "Red freckles. Looks seasoned already."

[variety."19807.gilded"]
name.value = "Золото в веснушках"
name.en = "Gilded"
description.value = "Золото в бурых веснушках. На причале собирается толпа."
description.en = "Gold with brown freckles. A crowd gathers on the dock."

[variety."19807.lucky-speckle"]
name.value = "Счастливая крапинка"
name.en = "Lucky Speckle"
description.value = "Одна крапинка в форме подковы. Рыбу берегут на удачу, а потом съедают на обед."
description.en = "One speckle shaped like a horseshoe. Kept for luck, then eaten for lunch."

[variety."19807.pale"]
name.value = "Бледность"
name.en = "Pale"
description.value = "Белизна с бледно-кремовыми веснушками. На каждом состязании все оборачиваются."
description.en = "White with faint cream freckles. Turns heads at every contest."

[variety."19807.black"]
name.value = "Чернота"
name.en = "Black"
description.value = "Чернота в белых веснушках, как ночное небо, собранное впопыхах."
description.en = "Black with white freckles, like a night sky in a hurry."

[variety."19807.champions"]
name.value = "Улов чемпиона"
name.en = "Champion's"
description.value = "Каждая веснушка сияет, как золотая монета. О такой рыбе рассказывают годами."
description.en = "Every freckle shines like a gold coin. The kind of fish that gets its own story told for years."

[variety."19975.slimeback"]
name.value = "Скользкая спина"
name.en = "Slimeback"
description.value = "Бурый цвет, слизь, приземистое тело. Нос замечает раньше глаз."
description.en = "Brown, slimy and squat. The nose finds it before the eyes do."

[variety."19975.skunk-striped"]
name.value = "Полоса скунса"
name.en = "Skunk-striped"
description.value = "Бледная полоса от головы до хвоста. Предупреждение, и честное."
description.en = "A pale stripe from head to tail. A warning, and a fair one."

[variety."19975.jungle-mud"]
name.value = "Грязь джунглей"
name.en = "Jungle-mud"
description.value = "Зелёно-бурая окраска, из глубокой грязи джунглей. И пахнет ею же."
description.en = "Green-brown, from deep jungle mud. Smells of it, too."

[variety."19975.spotted"]
name.value = "Брызги грязи"
name.en = "Spotted"
description.value = "Тёмные пятна на буром, как грязь, забрызганная грязью."
description.en = "Dark spots on brown, like mud splashed on mud."

[variety."19975.ochre"]
name.value = "Охра"
name.en = "Ochre"
description.value = "Жёлтая охра, как глина, которой раскрашиваются тролли. Пахнет не лучше."
description.en = "Ochre-yellow, like the clay the trolls paint with. Smells no better."

[variety."19975.long-whiskered"]
name.value = "Длинные усы"
name.en = "Long-whiskered"
description.value = "Длинные усики волочатся по илу. Находит любую наживку и каждую пропитывает своим запахом."
description.en = "Long barbels that trail in the mud. Finds every bait, smells every one."

[variety."19975.masked"]
name.value = "Маска"
name.en = "Masked"
description.value = "Тёмная полоса через глаза, как резная маска. Вид такой, будто что-то знает."
description.en = "A dark band across the eyes like a carved mask. Looks like it knows things."

[variety."19975.bloodmud"]
name.value = "Кровавый ил"
name.en = "Bloodmud"
description.value = "Тёмно-красная окраска — из ила, где когда-то приносили подношения. Лучше не расспрашивать."
description.en = "Dark red, from mud where old offerings were made. Best not asked about."

[variety."19975.pale"]
name.value = "Костяная бледность"
name.en = "Pale"
description.value = "Бледность кости, из воды под древними камнями. Цвет ушёл, запах остался."
description.en = "Bone-pale, from water under ancient stone. The smell survives the colour."

[variety."19975.idol-touched"]
name.value = "Печать идола"
name.en = "Idol-touched"
description.value = "На спине светятся бледные красно-фиолетовые прожилки, как старая краска на идоле. Даже звери в этих водах держатся в стороне."
description.en = "Faint red-violet veins glow on its back like old idol paint. Even the beasts of these waters keep clear of it."

[variety."21071.hillside"]
name.value = "Склон холма"
name.en = "Hillside"
description.value = "Шалфейная зелень в веснушках, как холмы над ручьём, откуда она родом."
description.en = "Sage-green and freckled, like the hills above the stream it came from."

[variety."21071.silver-sage"]
name.value = "Серебряный шалфей"
name.en = "Silver Sage"
description.value = "Серебристый отлив, как листья шалфея, вывернутые ветром."
description.en = "Silvery, like sage leaves turned over in the wind."

[variety."21071.dark-sage"]
name.value = "Тёмный шалфей"
name.en = "Dark Sage"
description.value = "Густая зелень, из тенистых ручьёв. Пахнет сильнее."
description.en = "Deep green, from shaded streams. Smells stronger."

[variety."21071.banded"]
name.value = "Грядки"
name.en = "Banded"
description.value = "Едва заметные полосы, как грядки в травяном огороде."
description.en = "Faint bands like rows in a herb garden."

[variety."21071.lavender-finned"]
name.value = "Лавандовые плавники"
name.en = "Lavender-finned"
description.value = "Плавники цвета лаванды. И пахнут — слегка — ею же."
description.en = "Fins the colour of lavender. Smells, faintly, of it too."

[variety."21071.thyme-spotted"]
name.value = "Крапинки чабреца"
name.en = "Thyme-spotted"
description.value = "Крошечные фиолетовые пятнышки, как цветки чабреца. Повара одобряют."
description.en = "Tiny purple spots like thyme flowers. The cooks approve."

[variety."21071.gold-sage"]
name.value = "Золотой шалфей"
name.en = "Gold Sage"
description.value = "Желтизна с зеленью, как сухая летняя трава. Пахнет долгим жарким днём."
description.en = "Yellow-green like dry summer grass. Smells of a long hot day."

[variety."21071.frost-sage"]
name.value = "Морозный шалфей"
name.en = "Frost Sage"
description.value = "Бледность, каждая чешуйка будто в инее по краю. На вкус почему-то чище."
description.en = "Pale with a frosted edge to every scale. Tastes cleaner, somehow."

[variety."21071.sweetgrass"]
name.value = "Душистая трава"
name.en = "Sweetgrass"
description.value = "Яркая зелень и сладкий запах. Единственная рыба, которую кому-то хотелось положить в шкаф к белью."
description.en = "Bright green and sweet-smelling. The only fish anybody has wanted to put in a drawer with the linen."

[variety."21071.mindbright"]
name.value = "Ясный ум"
name.en = "Mindbright"
description.value = "В узоре чешуи мерцает бледный свет. Отведавшие уверяют, что думается яснее. Уверяют они это часто."
description.en = "Pale light flickers in the lines of its scales. Anglers who eat it say they think more clearly. They say that a lot."

[variety."21153.full-grown"]
name.value = "Во весь рост"
name.en = "Full-grown"
description.value = "Шалфей подрос: крупнее, темнее и всё так же душист."
description.en = "The sage grew up: bigger, darker, still fragrant."

[variety."21153.moss-green"]
name.value = "Зелень мха"
name.en = "Moss-green"
description.value = "Пятна, как мох на старом камне. Пахнет сырым лесом."
description.en = "Mottled like moss on old stone. Smells of a damp forest."

[variety."21153.silver"]
name.value = "Серебро"
name.en = "Silver"
description.value = "Серебряный великан своей породы. С возрастом только ярче."
description.en = "A silver giant of its kind. Grew up and got bright."

[variety."21153.bronze"]
name.value = "Бронза"
name.en = "Bronze"
description.value = "Бронза — от тёмных, как чай, рек. И на вкус слегка отдаёт чаем."
description.en = "Bronze from tannin-dark rivers. Tastes faintly of tea."

[variety."21153.banded"]
name.value = "Годовые кольца"
name.en = "Banded"
description.value = "Широкие полосы, как годовые кольца дерева. У старых их больше."
description.en = "Broad bands like the rings of a tree. The old ones have more."

[variety."21153.violet-finned"]
name.value = "Фиолетовые плавники"
name.en = "Violet-finned"
description.value = "Фиолетовые плавники, как цветущий шалфей. Весной запах сильнее."
description.en = "Purple fins, like a sage in bloom. The scent is stronger in spring."

[variety."21153.bearded"]
name.value = "Борода мудреца"
name.en = "Bearded"
description.value = "Длинные струящиеся плавники, как борода старого мудреца. Вид мудрее, чем есть на самом деле."
description.en = "Long trailing fins like an old sage's beard. Looks wiser than it is."

[variety."21153.golden"]
name.value = "Золото"
name.en = "Golden"
description.value = "Золото и аромат. Пахнет мёдом на тёплом камне."
description.en = "Gold and fragrant. Smells like honey on warm stone."

[variety."21153.ashen"]
name.value = "Дым благовоний"
name.en = "Ashen"
description.value = "Серость дыма и лёгкий запах благовоний. Шалфей у воды давно уже никто не жжёт."
description.en = "Grey as smoke, and it smells faintly of incense. Nobody burns sage near the water any more."

[variety."21153.elder-sage"]
name.value = "Старый мудрец"
name.en = "Elder Sage"
description.value = "Почтенный возраст, огромный размер, по чешуе бегут бледно-золотые линии, как жилки листа. Кое-где самое старое берегут."
description.en = "Old, huge, its scales lit with pale gold lines like veins in a leaf. Some places keep their oldest things."

[variety."251524.whimsical"]
name.value = "Причуда"
name.en = "Whimsical"
description.value = "Золото и струящиеся синие плавники, как шарфы танцовщицы. Будто расписывал кто-то в очень хорошем настроении."
description.en = "Gold, with flowing blue fins like a dancer's scarves. Looks painted by somebody in a very good mood."

[variety."251524.mint"]
name.value = "Мята"
name.en = "Mint"
description.value = "Мятная зелень в розовый горошек. Похоже на леденец с ярмарки."
description.en = "Mint green with pink dots. Looks like a sweet from a fair."

[variety."251524.lemon"]
name.value = "Лимон"
name.en = "Lemon"
description.value = "Лимонная желтизна в синий горошек. Вид такой, будто случилось что-то очень хорошее."
description.en = "Lemon yellow with blue dots. It seems very pleased about something."

[variety."251524.lilac"]
name.value = "Сирень"
name.en = "Lilac"
description.value = "Сиреневый цвет с кремовыми полосками. Плавает петлями без всякой видимой причины."
description.en = "Lilac with cream stripes. Swims in loops, for no clear reason."

[variety."251524.polka-dotted"]
name.value = "В горошек"
name.en = "Polka-dotted"
description.value = "Крупный белый горошек на розовом, как праздничное платье. Знает это — и красуется."
description.en = "Big white dots on pink, like a festival dress. It knows."

[variety."251524.swirled"]
name.value = "Завитки"
name.en = "Swirled"
description.value = "Розовое и синее закручено, как глазурь. Рыболовам вдруг хочется совсем не рыбы."
description.en = "Pink and blue swirled together like icing. Makes anglers hungry for the wrong thing."

[variety."251524.frill-finned"]
name.value = "Кружевные оборки"
name.en = "Frill-finned"
description.value = "Плавники, как кружевные оборки. Плавает из рук вон плохо, но в полном восторге."
description.en = "Fins like lace ruffles. Hopeless at swimming, delighted anyway."

[variety."251524.rainbow"]
name.value = "Радуга"
name.en = "Rainbow"
description.value = "Полосы всех цветов, будто раскрашивал ребёнок с полной коробкой красок. Ещё и блестит."
description.en = "Every colour in stripes, as if painted by a child with a full box. It glitters."

[variety."251524.murk-touched"]
name.value = "Хмурый день"
name.en = "Murk-touched"
description.value = "Тёмно-фиолетовая окраска, горошек потускнел. Во всей породе, похоже, только тут не задался день."
description.en = "Dark purple, its dots dimmed. The only one of its kind that looks like it has had a bad day."

[variety."251524.dreamfin"]
name.value = "Плавник грёз"
name.en = "Dreamfin"
description.value = "Светится нежно-розовым и голубым, оставляя в воде лёгкое мерцание. Малышам говорят, что такие исполняют желания. Никто не проверяет."
description.en = "Glows soft pink and blue, and leaves a faint shimmer in the water behind it. Small children are told it grants wishes. Nobody checks."
