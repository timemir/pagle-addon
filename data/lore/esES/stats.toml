# Stats' lore in Spanish (Spain), over data/lore/stats.toml (DATA-R113).

[statsgood."stats.trackerframe.none"]
name.value = "Sin marco"
name.en = "No Frame"
description.value = "Las cifras a solas, sin borde. Nada que pulir y nada que se moje."
description.en = "The figures on their own, with no border. Nothing to polish, and nothing to get wet."

[statsgood."stats.trackerframe.logbook"]
name.value = "Cuaderno de bitácora"
name.en = "Logbook"
description.value = "Pergamino rayado en columnas tenues, como el diario de un capitán de puerto. Cada cifra respeta su línea."
description.en = "Parchment ruled in faint columns, like a harbourmaster's log. Every figure keeps to its line."

[statsgood."stats.trackerframe.brass"]
name.value = "Latón de navío"
name.en = "Ship's Brass"
description.value = "Un fino borde de latón, remachado en cada esquina como la brújula de un barco. Conserva el brillo con cualquier tiempo."
description.en = "A thin brass rim, riveted at each corner like a ship's compass. It keeps its shine in any weather."

[statsgood."stats.trackerframe.greenbar"]
name.value = "Papel de listas verdes"
name.en = "Green-Bar Paper"
description.value = "Papel de recuento a bandas de verde pálido, para que una columna larga de números nunca pierda el hilo."
description.en = "Tally paper banded in pale green, so a long column of numbers never loses its place."

[statsgood."stats.trackerframe.chalkboard"]
name.value = "Pizarra"
name.en = "Chalkboard"
description.value = "Una pizarra verde de escuela en marco de pino, con las marcas de recuento de alguien aún en la esquina."
description.en = "A green schoolroom board in a pine frame, with somebody’s tally marks still in the corner."

[statsgood."stats.trackerframe.tidegauge"]
name.value = "Escala de mareas"
name.en = "Tide Gauge"
description.value = "Cristal azul mar tras una regla de latón, marcada para que las cifras suban y bajen como el agua."
description.en = "Sea-blue glass behind a brass tide staff, marked off so the numbers rise and fall like water."

[statsgood."stats.trackerframe.abacus"]
name.value = "Ábaco"
name.en = "Abacus"
description.value = "Un marco de contar con las cuentas arrinconadas a los extremos y la suma escrita a las claras entre ellas."
description.en = "A counting frame with the beads pushed to the ends, and the sum written plainly between them."

[statsgood."stats.trackerframe.astrolabe"]
name.value = "Astrolabio"
name.en = "Astrolabe"
description.value = "Un mapa de estrellas en azul profundo bajo aros de latón, para el pescador que calcula las probabilidades por el cielo."
description.en = "A star map in deep blue under brass rings, for an angler who reckons the odds by the sky."
