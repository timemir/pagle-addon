# The Ledger's lore in Spanish (Spain), over data/lore/ledger.toml (DATA-R113).

[species.1467]
blurb.value = "Un pez pequeño y alegre, sin idea de cuántos cocineros lo están esperando."
blurb.en = "A cheerful little fish with no idea how many cooks are waiting for it."
riddle.value = "Un lago sereno entre colinas, en tierra de granjas bien asentadas."
riddle.en = "A calm hill lake in settled farming country."

[species.4603]
blurb.value = "Rápido, vistoso y muy satisfecho de sí mismo."
blurb.en = "Fast, bright, and very pleased with itself."
riddle.value = "Costas saladas al norte y al sur, a ambos lados del mar."
riddle.en = "Salt coasts north and south, on both sides of the sea."

[species.6289]
blurb.value = "Muerde cualquier cosa, incluida, una vez, la bota de un gnomo."
blurb.en = "It bites anything, including, once, a gnome's boot."
riddle.value = "Ríos perezosos en las tierras donde empiezan los héroes."
riddle.en = "Lazy rivers in the lands where heroes begin."

[species.6291]
blurb.value = "Pequeño, brillante y en todas partes. Todo cuaderno de pescador empieza aquí, y nadie confiesa cuántos devolvió al agua."
blurb.en = "Small, bright and everywhere. Every angler's book starts here, and nobody admits how many they threw back."
riddle.value = "Lo primero que tira del sedal de un novato, en las aguas más mansas de todas."
riddle.en = "The very first thing to tug a beginner's line, in the gentlest waters of all."

[species.6299]
blurb.value = "Mala pinta, peor olor, y cocinado da algo que comería un raptor."
blurb.en = "Looks bad, smells worse, cooks into something a raptor would eat."
riddle.value = "Agua gris y cansada en el norte sombrío, a ambos lados del mar."
riddle.en = "Tired, grey water in the gloomy north, on both sides of the sea."

[species.6303]
blurb.value = "Lo bastante escurridizo para ganarse el nombre. Frito queda mejor de lo que tiene derecho."
blurb.en = "Slippery enough to earn the name. Fries up better than it has any right to."
riddle.value = "Costas someras, donde vadean los aventureros recién llegados."
riddle.en = "Shallow coasts, where new adventurers wade."

[species.6308]
blurb.value = "Todo bigotes y rencor. Se enfurruña en el fondo hasta que decide pelear."
blurb.en = "All whiskers and grudge. It sulks on the bottom until it decides to fight."
riddle.value = "Ríos turbios a ambos lados del mar."
riddle.en = "Murky rivers on both sides of the sea."

[species.6317]
blurb.value = "Lo bautizaron los enanos, que nombran todo según cómo se porta cuando intentas sujetarlo."
blurb.en = "Named by dwarves, who name everything after how it behaves when you try to hold it."
riddle.value = "Aguas frías y quietas de las tierras altas, en país de enanos."
riddle.en = "Cold highland lake water, in dwarf country."

[species.6358]
blurb.value = "Los alquimistas quieren el aceite. Los cocineros no quieren saber nada de él."
blurb.en = "Alchemists want the oil. Cooks want nothing to do with it."
riddle.value = "Un banco que deja una película brillante sobre las aguas de la costa."
riddle.en = "A school that leaves a slick on coastal waters."

[species.6359]
blurb.value = "Caliente al tacto, incluso fuera del agua."
blurb.en = "Warm to the touch, even out of the water."
riddle.value = "Bancos en remolino del color de las brasas, frente a costas del norte y del sur."
riddle.en = "Swirling schools the colour of embers, off coasts north and south."

[species.6361]
blurb.value = "Los colores se apagan menos de una hora después de sacarlo. Míralo deprisa."
blurb.en = "The colours fade within an hour of landing. Look quickly."
riddle.value = "Costa abierta, algo más lejos de la orilla de lo que acostumbras."
riddle.en = "Open coast, a little further from shore than you're used to."

[species.6362]
blurb.value = "Terco en el sedal, dulce en el plato."
blurb.en = "Stubborn on the line, sweet on the plate."
riddle.value = "Costas del norte brumoso al sur caluroso, donde el fondo cae de golpe."
riddle.en = "Sea coasts from the misty north to the hot south, where the bottom drops away."

[species.6458]
blurb.value = "Más que un pez, una advertencia sobre el agua. Lávalo dos veces y piénsatelo otra vez."
blurb.en = "Less a fish than a warning about the water. Wash it twice, then think again."
riddle.value = "Agua sucia donde los goblins perforan colinas y llanuras resecas."
riddle.en = "Fouled water where goblins drill the parched hills and plains."

[species.6522]
blurb.value = "Cómelo bajo tu propia responsabilidad. No hay dos pescadores que lo probaran y cuenten igual la hora siguiente."
blurb.en = "Eat one at your own risk. No two anglers who did tell the same story about the hour after."
riddle.value = "Bancos extraños en las llanuras secas, donde el agua misma parece enferma."
riddle.en = "Strange schools out on the dry plains, where the water itself seems unwell."

[species.8365]
blurb.value = "La cabeza brilla de verdad. No, no es mitril. Deja de preguntarle al herrero."
blurb.en = "The head really does shine. No, it isn't mithril. Stop asking the smith."
riddle.value = "Lagos y ríos de tierras más ásperas, del bosque espeso al desierto pelado."
riddle.en = "Lakes and rivers in rougher country, from deep forest to bare desert."

[species.12238]
blurb.value = "Ancho, lento y gris como la costa que le da nombre. Hace mejor guiso que primera impresión."
blurb.en = "Broad, slow and grey as the coast it's named for. It makes a better stew than a first impression."
riddle.value = "Mar gris bajo árboles viejos y la luna, o muy al sur, en el desierto."
riddle.en = "Grey water under old trees on a moonlit coast, or far south in the desert."

[species.13422]
blurb.value = "Los armeros pagan bien las escamas. La anguila no está de acuerdo con el trato."
blurb.en = "Armourers pay well for the scales. The eel disagrees with the arrangement."
riddle.value = "Un enjambre que se retuerce en mar hondo, frente a las costas más salvajes."
riddle.en = "A writhing swarm in deep sea water off the wilder coasts."

[species.13754]
blurb.value = "Tan pesado que algunos pescadores lo pescan sentados."
blurb.en = "Heavy enough that some anglers fish it sitting down."
riddle.value = "Mar abierto frente a las costas lejanas, lo bastante hondo para los pesados."
riddle.en = "Open sea off the far coasts, deep enough for the heavy ones."

[species.13755]
blurb.value = "Llega con la escarcha. Más brazos de los que un pescador puede desenredar con calma."
blurb.en = "Arrives with the frost. More arms than an angler can reasonably untangle."
riddle.value = "Orillas cálidas, cuando el año se vuelve frío."
riddle.en = "Warm shores, once the year turns cold."

[species.13756]
blurb.value = "Aparece con los días largos y se va con el primer viento frío."
blurb.en = "Turns up with the long days and leaves with the first cold wind."
riddle.value = "Orillas cálidas en la mitad cálida del año."
riddle.en = "Warm shores in the warm half of the year."

[species.13757]
blurb.value = "Hace cosquillas. No la lamas."
blurb.en = "Tingles. Don't lick it."
riddle.value = "Un chisporroteo en aguas lejanas y salvajes, del alba a bien entrada la noche."
riddle.en = "A crackle in far, wild waters, from sunrise into the late evening."

[species.13758]
blurb.value = "Agallas como brasas. Muerde como si fuera en serio."
blurb.en = "Gills like embers. Bites like it means it."
riddle.value = "Aguas de interior de las tierras más salvajes, de día o de noche."
riddle.en = "Inland waters of the wilder lands, by day or by night."

[species.13759]
blurb.value = "Come a la luz de las estrellas. Quien lo quiere aprende a llevarse bien con la oscuridad."
blurb.en = "Feeds by starlight. Anglers who want it learn to like the dark."
riddle.value = "Aguas salvajes lejos de las orillas mansas, después de ponerse el sol."
riddle.en = "Wild waters far from the gentle shores, after the sun goes down."

[species.13760]
blurb.value = "Sale con el sol y trasnocha. Nadie sabe adónde va antes del alba."
blurb.en = "Rises with the sun and keeps late hours. Nobody knows where it goes before dawn."
riddle.value = "Ríos y lagos lejanos, cálidos o fríos, mientras dura la luz del día."
riddle.en = "Far rivers and lakes, warm or cold, while the sun is up."

[species.13888]
blurb.value = "Pellizca primero y no pregunta nunca."
blurb.en = "Pinches first, asks questions never."
riddle.value = "Aguas rocosas y profundas en los confines del mundo."
riddle.en = "Deep rocky waters at the far edges of the world."

[species.13889]
blurb.value = "Pálido como la escarcha. Mejor comerlo el día que se pesca, cosa que rara vez es posible."
blurb.en = "Pale as frost. Best eaten the day it's caught, which is rarely possible."
riddle.value = "Las aguas más lejanas que hay, de lagos helados a colinas abrasadas."
riddle.en = "The farthest waters there are, from frozen lakes to scorched hills."

[species.13890]
blurb.value = "Lleva la armadura por fuera y el genio por dentro. Trae un cuchillo más pesado."
blurb.en = "Wears its armour on the outside and its temper on the inside. Bring a heavier knife."
riddle.value = "Algo pesado en las aguas más lejanas, después de ponerse el sol."
riddle.en = "Something heavy in the farthest waters, after the sun goes down."

[species.13893]
blurb.value = "El primo grande. Te harán falta las dos manos y, probablemente, un amigo."
blurb.en = "The big cousin. You will need both hands and probably a friend."
riddle.value = "Aguas hondas frente a una costa lejana y olvidada."
riddle.en = "Deep water off a far and forgotten coast."

[species.16967]
blurb.value = "Grande, rápido y buen bocado. Casi todos se pescan como favor para otro, lo que parece un desperdicio."
blurb.en = "Big, quick and good eating. Most are caught as a favour for someone else, which seems a waste."
riddle.value = "Un río ancho entre bosque húmedo y enmarañado, en el lejano oeste."
riddle.en = "A broad river through wet, overgrown forest in the far west."

[species.16968]
blurb.value = "Se lanza al cebo como si llevara todo el día esperando una discusión."
blurb.en = "Hits the bait like it's been waiting all day for an argument."
riddle.value = "Una orilla gris y triste en una costa del oeste, seca y vacía."
riddle.en = "A bleak, grey shore on a dry and empty western coast."

[species.16969]
blurb.value = "Esa vela es de adorno, y lo sabe. Pelea como si tuviera público."
blurb.en = "That sail is for show, and it knows it. Fights like it has an audience."
riddle.value = "Bajíos cálidos de selva, donde el mar llega hasta los mismos árboles."
riddle.en = "Warm jungle shallows, where the sea runs right up to the trees."

[species.16970]
blurb.value = "Vistoso como un pájaro de la selva y el doble de problemático en el sedal."
blurb.en = "Bright as a jungle bird and twice as much trouble on the line."
riddle.value = "Bajíos cálidos y turbios donde un pantano se junta con el mar."
riddle.en = "Warm, murky shallows where a swamp meets the sea."

[species.19807]
blurb.value = "Pez de torneo. Sabe a victoria, o al menos a una larga tarde intentándolo."
blurb.en = "Tournament fish. Tastes of victory, or at least of a long afternoon trying."
riddle.value = "Solo mientras dura el gran torneo de la selva."
riddle.en = "Only while the jungle's great contest is on."

[species.19975]
blurb.value = "Huele exactamente como promete el nombre. Alguien, en algún sitio, aún quiere una docena."
blurb.en = "Smells exactly as the name promises. Somebody, somewhere, still wants a dozen."
riddle.value = "Agua parda y revuelta, en lo más hondo de la selva humeante."
riddle.en = "Churning brown water, deep in the steaming jungle."

[species.21071]
blurb.value = "Huele a las colinas junto a las que nada."
blurb.en = "Smells like the hills it swims past."
riddle.value = "Pequeños bancos en colinas y bosques, con un leve olor a hierbas."
riddle.en = "Small schools in the hills and forests, smelling faintly of herbs."

[species.21153]
blurb.value = "La salvia se ha hecho mayor."
blurb.en = "The sage grew up."
riddle.value = "Bancos más nutridos con aroma a hierbas, en colinas nevadas y selva humeante."
riddle.en = "Bigger herb-scented schools, in snowy hills and steaming jungle."

[species.251524]
blurb.value = "Nuevo en estas aguas, y nadie sabe muy bien cómo llegó."
blurb.en = "New to these waters, and nobody's quite sure how it got here."
riddle.value = "Bancos nuevos y vistosos en un lago tranquilo de las colinas del este."
riddle.en = "Bright new schools on a quiet lake in the eastern hills."

[legend.19803]
blurb.value = "La mayoría de los pescadores solo llega a ver su estela. Este frenó lo justo para dejarse sacar."
blurb.en = "Most anglers only ever see its wake. This one slowed down long enough to be landed."
title.value = "Cazacorredores"
title.en = "Racer-Chaser"

[legend.19805]
blurb.value = "Demasiado guapo para la mesa de un torneo, y parece saberlo."
blurb.en = "Far too handsome for a contest table, and it seems to know it."
title.value = "Rival de Keefer"
title.en = "Keefer's Rival"

[legend.19806]
blurb.value = "Se comporta como la realeza y pelea como si tuviera una corona que perder."
blurb.en = "Carries itself like royalty, and fights as if it had a crown to lose."
title.value = "Cazarreinas"
title.en = "Queen-Catcher"

[sub.6297]
plaque.value = "Donado por el agua. Dueño desconocido, y mejor que siga así."
plaque.en = "Donated by the water. Owner unknown, and preferably staying that way."

[sub.6301]
plaque.value = "Fue de un carretero. Todavía parece estar esperando una carreta."
plaque.en = "Belonged to someone who drove wagons. Still looks like it's waiting for one."

[sub.6307]
plaque.value = "La tinta se corrió hace mucho. El corcho, hay que reconocérselo, aguantó."
plaque.en = "The ink ran long ago. The cork, to its credit, held."

[sub.6351]
plaque.value = "Se cayó una vez, por lo que se ve, y luego otra por si acaso."
plaque.en = "Dropped once, by the look of it, and then again for good measure."

[sub.6352]
plaque.value = "Embalada para una travesía en seco. No la tuvo."
plaque.en = "Packed for a dry voyage. It did not get one."

[sub.6353]
plaque.value = "Lo bastante pequeño para perderse por la borda. Alguien lo demostró."
plaque.en = "Small enough to lose over the side. Someone proved it."

[sub.6354]
plaque.value = "Pequeño, con cerradura, y más difícil de abrir de lo que nunca fue de cargar."
plaque.en = "Small, locked, and more trouble to open than it ever was to carry."

[sub.6355]
plaque.value = "Hecho para resistirlo todo. El mar lleva tiempo poniéndolo a prueba."
plaque.en = "Built to survive anything. The sea has been testing the claim."

[sub.6356]
plaque.value = "Alguien lo cerró, alguien lo hundió, y ninguno volvió a por él."
plaque.en = "Someone locked it, someone sank it, and neither came back for it."

[sub.6357]
plaque.value = "Sellada a conciencia contra el agua. El agua tuvo paciencia."
plaque.en = "Sealed tight against the water. The water was patient."

[sub.6455]
plaque.value = "Adónde fue la carreta sigue bajo investigación."
plaque.en = "Where the wagon went is still under investigation."

[sub.6456]
plaque.value = "Se ruega no tocar la pieza expuesta."
plaque.en = "Please do not touch the exhibit."

[sub.6457]
plaque.value = "Un gnomo diría que esto 'casi funciona'."
plaque.en = "A gnome would call this 'nearly working'."

[sub.6717]
plaque.value = "Repuestos de un manitas, caídos por la borda a mitad de faena. Jura que el barco ya hacía agua."
plaque.en = "A tinker's spare parts, dropped over the side mid-job. He insists the boat leaked first."

[sub.6718]
plaque.value = "Piezas de un reclamo de pato de relojería, de los que explotan. Lejos de los patos de verdad."
plaque.en = "Parts for a clockwork duck decoy, the kind that explodes. Kept well away from the real ducks."

[sub.6643]
plaque.value = "Un pez pequeño con mucho apetito y ninguna idea de qué cuenta como comida."
plaque.en = "A small fish with a large appetite and no sense of what counts as food."

[sub.6645]
plaque.value = "Mordió algo demasiado grande para tragárselo, y se lo tragó igual."
plaque.en = "It bit something far too big to swallow, and swallowed it anyway."

[sub.6647]
plaque.value = "Comía del fondo, donde acaba todo lo que se le cae a cualquiera."
plaque.en = "Fed off the bottom, where everyone's dropped things end up."

[sub.7973]
plaque.value = "No dice nada de lo que lleva dentro. Ábrela igualmente; a veces hay una perla."
plaque.en = "Says nothing about what's inside. Open it anyway; sometimes it's a pearl."

[sub.8366]
plaque.value = "Se comió algo brillante. Quizá hasta mitril, esta vez."
plaque.en = "Ate something shiny. Possibly even mithril, this time."

[sub.13874]
plaque.value = "Demasiado pesada para flotar y para cargarla lejos. Alguien probó las dos cosas."
plaque.en = "Too heavy to float and too heavy to carry far. Someone tried both."

[sub.13875]
plaque.value = "Reforzado con hierro y con cerradura, por si acaso. Lo de dentro merecía la inquietud."
plaque.en = "Bound in iron and locked besides. Whatever's inside was worth the worry."

[sub.13881]
plaque.value = "Demasiado glotón para dejar de comer, y demasiado lleno para escapar nadando."
plaque.en = "Too greedy to stop eating, and too full to swim away."

[sub.13918]
plaque.value = "Reforzado, con cerradura, y hundido igualmente. Hay cargamentos sin un respiro."
plaque.en = "Reinforced, locked, and sunk anyway. Some cargo never gets a break."

[sub.20708]
plaque.value = "Tan bien sellado que el agua nunca entró. Por lo visto, el dueño tampoco."
plaque.en = "Sealed so tight the water never got in. Neither, it seems, did the owner."

[sub.21113]
plaque.value = "Estanco, como se prometió. Nadie prometió que flotara."
plaque.en = "Watertight, as promised. Nobody promised it would float."

[sub.21150]
plaque.value = "El hierro aguantó. El barco del que cayó, no."
plaque.en = "The iron held. The ship it came off did not."

[sub.21162]
plaque.value = "Hinchado, resbaladizo y lleno de la suerte de otro. Lávate las manos después."
plaque.en = "Swollen, slick and full of someone else's luck. Wash your hands after."

[sub.21164]
plaque.value = "Terco hasta el final. Solo soltó lo que se había tragado a punta de cuchillo."
plaque.en = "Stubborn to the last. It gave up what it swallowed only to a knife."

[sub.21228]
plaque.value = "Reforzado con mitril. Quien lo llenó esperaba problemas, y los tuvo."
plaque.en = "Bound in mithril. Whoever packed it expected trouble, and got some."

[sub.21243]
plaque.value = "Lo bastante grande para tragarse una bolsa entera, y lo hizo."
plaque.en = "Big enough to swallow a purse whole, and it did."

