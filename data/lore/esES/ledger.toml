text.en = "Keeper of Lost Cargo"

[title."complete.trophy"]
text.value = "Peso pesado"
text.en = "Tipper of Scales"

[title."complete.varieties"]
text.value = "Custodio de todos los colores"
text.en = "Keeper of Every Colour"

[crest.alterac]
name.value = "La torre rota"
name.en = "The Broken Tower"
description.value = "Una torre rota en un pico frío. El reino ya no existe. Los arroyos siguen siendo buenos."
description.en = "A broken tower on a cold peak. The kingdom is gone. The streams are still good."

[crest.arathi]
name.value = "Las piedras erguidas"
name.en = "The Standing Stones"
description.value = "Viejas piedras erguidas sobre la hierba de las tierras altas, más viejas que cualquiera que discuta sobre ellas."
description.en = "Old standing stones on the highland grass, older than anyone who argues about them."

[crest.badlands]
name.value = "El arco de piedra"
name.en = "The Stone Arch"
description.value = "Un arco de piedra que el viento tardó diez mil años en terminar. Trae tu propia agua."
description.en = "A stone arch the wind took ten thousand years to finish. Bring your own water."

[crest.blackrock]
name.value = "La aguja negra"
name.en = "The Black Spire"
description.value = "Una montaña negra con fuego en las grietas y cadenas en la puerta. Pesca en los pozos de lava bajo tu propia responsabilidad."
description.en = "A black mountain with fire in its cracks and chains across its gate. Fish the lava pools at your own risk."

[crest.blastedlands]
name.value = "La puerta en llamas"
name.en = "The Burning Gate"
description.value = "Una puerta de piedra negra con fuego verde dentro. Nadie pesca allí por las vistas."
description.en = "A gate of black stone with green fire in it. Nobody fishes there for the view."

[crest.burningsteppes]
name.value = "El pico en llamas"
name.en = "The Burning Peak"
description.value = "Una montaña en llamas bajo un cielo de ceniza. El agua está tan caliente que se podría guisar en ella."
description.en = "A mountain on fire under an ash sky. The water is warm enough to cook in."

[crest.deadwind]
name.value = "La torre solitaria"
name.en = "The Lonely Tower"
description.value = "Una torre alta en un valle muerto. Las charcas están tranquilas. Demasiado, dicen algunos, y se van."
description.en = "A tall tower in a dead valley. The pools are quiet. Too quiet, some say, and leave."

[crest.dunmorogh]
name.value = "El carnero"
name.en = "The Ram"
description.value = "Cuernos enroscados sobre un campo nevado. Los carneros de allí arriba tienen opiniones sobre los forasteros."
description.en = "Curled horns over a snowfield. The rams up there have opinions about strangers."

[crest.duskwood]
name.value = "Ojos en el bosque"
name.en = "Eyes in the Wood"
description.value = "Dos ojos entre árboles negros. Allí los pescadores mantienen el farol encendido y el sedal corto."
description.en = "Two eyes between black trees. Anglers there keep the lantern lit and the line short."

[crest.easternplague]
name.value = "La capilla"
name.en = "The Chapel"
description.value = "Una pequeña capilla que sostiene su luz frente a la plaga. A su lado hay buena agua."
description.en = "A small chapel holding its light against the blight. Good water lies beside it."

[crest.elwynn]
name.value = "El viejo roble"
name.en = "The Old Oak"
description.value = "El primer lago que vieron casi todos los pescadores, y el roble bajo el que se sentaron."
description.en = "The first lake most anglers ever saw, and the oak they sat under."

[crest.hillsbrad]
name.value = "Tres manzanas"
name.en = "Three Apples"
description.value = "Tres manzanas de los huertos al pie de las colinas. Las truchas bajo el molino engordan con la fruta caída."
description.en = "Three apples from the foothill orchards. The trout below the mill are fat on windfalls."

[crest.hinterlands]
name.value = "Tres plumas"
name.en = "Three Feathers"
description.value = "Grandes plumas de las colinas salvajes, donde las aves grandes anidan sobre los ríos."
description.en = "Great feathers from the wild hills, where big birds nest above the rivers."

[crest.ironforge]
name.value = "El yunque"
name.en = "The Anvil"
description.value = "Un yunque ante la forja de la montaña. Ahí debajo hay un lago, y los enanos lo pescan."
description.en = "An anvil before the mountain's forge. There is a lake under there, and dwarves fish it."

[crest.lochmodan]
name.value = "La gran presa"
name.en = "The Great Dam"
description.value = "Una presa que contiene un lago de las tierras altas. Los enanos la hicieron para durar, y ha durado."
description.en = "A dam holding back a highland lake. Dwarves built it to last, and it has."

[crest.lordamere]
name.value = "La isla del lago"
name.en = "The Lake Isle"
description.value = "Una isla boscosa en un lago ancho y gris, con una barca varada en la orilla. Agua tranquila, y mucha."
description.en = "A wooded island on a wide grey lake, a boat drawn up on its shore. Quiet water, and plenty of it."

[crest.redridge]
name.value = "Tres picos"
name.en = "Three Peaks"
description.value = "Tres picos rojos que se alzan en un lago de montaña, y cada uno reflejado."
description.en = "Three red peaks standing in a mountain lake, and every one of them reflected."

[crest.riverglades]
name.value = "La barcaza"
name.en = "The Barge"
description.value = "Una barcaza en un río sinuoso entre colinas verdes. Allí el comercio llega por agua, y los peces también."
description.en = "A barge on a winding river between green hills. Trade comes by water there, and so do fish."

[crest.searinggorge]
name.value = "El crisol"
name.en = "The Crucible"
description.value = "Un crisol que vierte oro fundido. Pescar allí es pescar en lava, así que trae paciencia y una caña larga."
description.en = "A crucible pouring molten gold. Fishing there means lava, so bring patience and a long rod."

[crest.silverpine]
name.value = "Pinos de plata"
name.en = "Silver Pines"
description.value = "Pinos plateados en la orilla de un lago oscuro. Casi todas las noches algo aúlla ahí fuera."
description.en = "Silver pines on a dark lake shore. Something howls out there most nights."

[crest.stormwind]
name.value = "El torreón blanco"
name.en = "The White Keep"
description.value = "Murallas blancas y una puerta sobre los canales. La ciudad pesca en sus propias aguas, con educación."
description.en = "White walls and a gate over the canals. The city fishes its own waterways, politely."

[crest.stranglethorn]
name.value = "El salto"
name.en = "The Leap"
description.value = "Un pez que salta limpio sobre las olas de la selva, como si se hubiera enterado del torneo."
description.en = "A fish leaping clear of the jungle surf, as if it heard about the contest."

[crest.swampofsorrows]
name.value = "El santuario ahogado"
name.en = "The Drowned Shrine"
description.value = "El tejado de un templo asomando del agua del pantano. Lo que hay debajo, debajo se queda."
description.en = "A temple roof breaking the swamp water. What is under it stays under it."

[crest.tirisfal]
name.value = "El murciélago"
name.en = "The Bat"
description.value = "Un murciélago ante una luna enfermiza. Hasta los peces de allí parecen algo cansados."
description.en = "A bat across a sickly moon. Even the fish there look a little tired."

[crest.undercity]
name.value = "La corona rota"
name.en = "The Broken Crown"
description.value = "Una corona rota sobre canales verdes. La corte ya no existe. Los canales aún tienen peces."
description.en = "A broken crown over green canals. The court is gone. The canals still hold fish."

[crest.westernplague]
name.value = "El cuervo"
name.en = "The Crow"
description.value = "Un cuervo en un árbol muerto sobre campos vacíos. Los granjeros se fueron. Los peces no."
description.en = "A crow on a dead tree over empty fields. The farmers left. The fish did not."

[crest.westfall]
name.value = "El molino"
name.en = "The Windmill"
description.value = "Aspas girando sobre el camino de la costa. El mar está más cerca de lo que admiten los granjeros."
description.en = "Sails turning over the coast road. The sea is closer than the farmers admit."

[crest.wetlands]
name.value = "El ancla"
name.en = "The Anchor"
description.value = "El ancla de un puerto, sacada del fango. Aún huele un poco a él."
description.en = "A harbour's anchor, hauled up from the mud. Still smells faintly of it."

[crest.ashenvale]
name.value = "El fuego fatuo"
name.en = "The Wisp"
description.value = "Un fuego fatuo que flota entre árboles oscuros. El bosque se fija en cada pescador que se queda demasiado."
description.en = "A wisp drifting between dark trees. The forest notices every angler who stays too long."

[crest.azshara]
name.value = "La columna caída"
name.en = "The Fallen Column"
description.value = "Una columna de un viejo imperio, con el mar trepando por ella. Algo aún nada en esas ruinas."
description.en = "A column of an old empire, the sea climbing it. Something still swims in those ruins."

[crest.barrens]
name.value = "La acacia"
name.en = "The Acacia"
description.value = "Un árbol de copa plana en las llanuras secas. Cada oasis de por allí es el rincón favorito de alguien."
description.en = "A flat-topped tree on the dry plains. Every oasis out there is somebody's favourite spot."

[crest.darkshore]
name.value = "La media luna"
name.en = "The Crescent"
description.value = "Una media luna sobre agua gris, para los pescadores que pescan cuando ha oscurecido."
description.en = "A crescent over grey water, for anglers who fish after dark."

[crest.darnassus]
name.value = "El pozo de plata"
name.en = "The Silver Well"
description.value = "Un pozo de brillo plateado bajo un gran árbol. El lago que lo rodea guarda los peces de la ciudad."
description.en = "A well glowing silver under a great tree. The lake around it holds the city's fish."

[crest.desolace]
name.value = "El cráneo astado"
name.en = "The Horned Skull"
description.value = "Un gran cráneo con cuernos, de un viejo cementerio. La costa es más amable que el interior."
description.en = "A great horned skull from an old graveyard. The coast is kinder than the inland."

[crest.durotar]
name.value = "El escórpido"
name.en = "The Scorpid"
description.value = "Un escórpido sobre tierra roja. La costa es mejor compañía que los escórpidos."
description.en = "A scorpid on red earth. The coast is better company than the scorpids."

[crest.dustwallow]
name.value = "El farol"
name.en = "The Lantern"
description.value = "Un farol que quedó encendido en la choza de un pescador, entre la niebla del pantano."
description.en = "A lantern left burning on a fisherman's hut in the marsh fog."

[crest.felwood]
name.value = "El árbol corrupto"
name.en = "The Tainted Tree"
description.value = "Un árbol retorcido con fuego verde en las venas. Lava todo lo que pesques allí. Dos veces."
description.en = "A twisted tree with green fire in its veins. Wash every catch from there. Twice."

[crest.feralas]
name.value = "Las cascadas"
name.en = "The Falls"
description.value = "Agua que cae entre los árboles gigantes, para los pescadores que eligen el camino largo."
description.en = "Water falling between the giant trees, for anglers who take the long way."

[crest.moonglade]
name.value = "La cornamenta"
name.en = "The Antlers"
description.value = "Una cornamenta sobre un lago quieto, bajo la luna. Un lugar tranquilo, y tranquilo a propósito."
description.en = "Antlers over a still lake, under the moon. A quiet place, kept quiet on purpose."

[crest.hyjal]
name.value = "El brote"
name.en = "The Sapling"
description.value = "Un brote verde que surge de viejas brasas. La montaña se está curando, y sus arroyos con ella."
description.en = "A green shoot rising out of old embers. The mountain is mending, and its streams with it."

[crest.mulgore]
name.value = "El tótem"
name.en = "The Totem"
description.value = "Un tótem tallado en las llanuras de hierba alta, donde los arroyos bajan claros de las colinas."
description.en = "A carved totem on the long grass plains, where the streams run clear from the hills."

[crest.orgrimmar]
name.value = "La puerta de pinchos"
name.en = "The Spiked Gate"
description.value = "Una puerta erizada de pinchos en un cañón rojo. Los estanques de la ciudad son más hondos de lo que parecen."
description.en = "A spiked gate in a red canyon. The city's pools are deeper than they look."

[crest.shendralas]
name.value = "El tomo abierto"
name.en = "The Open Tome"
description.value = "Un libro abierto sobre un pedestal roto, guardado por gente que nunca dejó de leer."
description.en = "An open book on a broken pedestal, kept by people who never stopped reading."

[crest.silithus]
name.value = "El escarabajo"
name.en = "The Scarab"
description.value = "Un escarabajo sobre la arena del desierto. Allí los lagos son pequeños y sospechosos."
description.en = "A scarab on desert sand. The lakes there are small and suspicious."

[crest.stonetalon]
name.value = "La garra"
name.en = "The Talon"
description.value = "Una gran garra aferrada a una piedra. Agua de montaña, fría y rápida."
description.en = "A great talon gripping a stone. Mountain water, cold and quick."

[crest.tanaris]
name.value = "El sol del desierto"
name.en = "The Desert Sun"
description.value = "Un sol del desierto sobre la única sombra en leguas: la orilla."
description.en = "A desert sun over the only shade for miles: the shoreline."

[crest.teldrassil]
name.value = "La corona de estrellas"
name.en = "The Starlit Crown"
description.value = "Un árbol tan alto que su copa está entre las estrellas. Sus raíces beben de un agua muy antigua."
description.en = "A tree so tall its crown is in the stars. Its roots drink from very old water."

[crest.thousandneedles]
name.value = "Las agujas"
name.en = "The Needles"
description.value = "Agujas de piedra que se alzan de la llanura. Pesca a su sombra, y no te quites el sombrero."
description.en = "Stone needles rising from the flats. Fish in their shadows, and keep your hat on."

[crest.thunderbluff]
name.value = "La meseta"
name.en = "The Mesa"
description.value = "Una meseta alta con una tienda en la cima. Las pozas de abajo recogen las cascadas, y los peces con ellas."
description.en = "A high mesa with a tent on top. The pools below catch the falls, and the fish with them."

[crest.ungoro]
name.value = "La huella"
name.en = "The Footprint"
description.value = "Una huella del tamaño de un bote de remos. El cráter tiene preocupaciones mayores que los peces."
description.en = "A footprint the size of a rowing boat. The crater has bigger worries than fish."

[crest.veiledsea]
name.value = "El banco de niebla"
name.en = "The Fog Bank"
description.value = "Un barco medio perdido en un banco de niebla marina. Aquí los peces suben de muy hondo, y todo lo demás también."
description.en = "A ship half lost in a bank of sea fog. Out here the fish come up from very deep, and so does everything else."

[crest.winterspring]
name.value = "La escarcha"
name.en = "The Frost"
description.value = "Un copo de nieve sobre agua quieta, donde pescar en el hielo es pescar de verdad."
description.en = "A snowflake over still water, where ice fishing is real fishing."

[crest.zephras]
name.value = "La isla flotante"
name.en = "The Floating Isle"
description.value = "Una isla que flota sobre las nubes, con su barco amarrado a la piedra. El agua queda muy abajo."
description.en = "An island floating on cloud, its ship tied to the stone. The water is a long way down."

[crest.hyjalcrater]
name.value = "El lago del cráter"
name.en = "The Crater Lake"
description.value = "Agua quieta en un anillo roto de piedra negra. Aquí ardió algo una vez; el lago no ha dicho nada."
description.en = "Still water in a broken ring of black stone. Something burned here once; the lake has kept quiet about it."

[ledgergood."ledger.binding.level10"]
name.value = "Piel curtida"
name.en = "Tanned Hide"
description.value = "Una piel más clara y suave, gastada en las esquinas por unas cuantas temporadas de pulgares mojados."
description.en = "Lighter, softer hide, worn smooth at the corners by a few seasons of wet thumbs."

[ledgergood."ledger.binding.level20"]
name.value = "Azul de marea"
name.en = "Tidewater Blue"
description.value = "Cuero azul oscuro con filetes de plata, del color de un puerto al anochecer."
description.en = "Deep blue leather with silver rules, the colour of a harbour at dusk."

[ledgergood."ledger.binding.level30"]
name.value = "Verde junco"
name.en = "Reed Green"
description.value = "Cuero verde oscuro, dorados del color del junco seco y un leve olor a ribera."
description.en = "Dark green leather, gilt the colour of dry reeds, and a faint smell of riverbank."

[ledgergood."ledger.binding.level40"]
name.value = "Sangre de buey"
name.en = "Oxblood"
description.value = "Cuero rojo oscuro y dorado abundante. La sangre de pescado apenas se nota."
description.en = "Deep red leather and heavy gilt. Fish blood barely shows on it."

[ledgergood."ledger.binding.level50"]
name.value = "Gris tormenta"
name.en = "Storm Grey"
description.value = "Cuero gris pizarra con hierros de plata, para los días en que nadie más sale."
description.en = "Slate-grey leather with silver tooling, for the days nobody else goes out."

[ledgergood."ledger.binding.level60"]
name.value = "La de Nat"
name.en = "Nat's Own"
description.value = "Cuero casi negro y oro brillante. Un libro de pescador no llega a ser mucho más fino."
description.en = "Near-black leather and bright gold. About as fine as an angler's book gets."

[ledgergood."ledger.binding.legend"]
name.value = "Tres peces dorados"
name.en = "Three Gilt Fish"
description.value = "Cuero azul repujado con escamas y, en la tapa, tres peces dorados persiguiéndose por el mismo círculo."
description.en = "Blue leather embossed with scales, and on the cover three gilt fish chasing one another round the same circle."

[ledgergood."ledger.binding.monster"]
name.value = "Piel de monstruo"
name.en = "Monster Hide"
description.value = "Piel escamosa de algo que no quería que lo sacaran, cerrada con uno de sus propios dientes."
description.en = "Scaled hide from something that did not want to be landed, shut with one of its own teeth."

[ledgergood."ledger.binding.abyssal"]
name.value = "Negro abisal"
name.en = "Abyssal Black"
description.value = "Negro como el agua profunda, con un brillo pálido que se enrosca bajo la superficie. Para pescadores que han bajado al fondo diez veces y han vuelto."
description.en = "Black as deep water, with a pale glow coiling under the surface. For anglers who have been to the bottom ten times and back."

[ledgergood."ledger.binding.keeper"]
name.value = "Oro del custodio"
name.en = "Keeper's Gold"
description.value = "Vitela crema casi enterrada en oro. Reservada al pescador cuyo libro ya no tiene nada por encontrar."
description.en = "Cream vellum all but buried in gold. Kept for the angler whose book has nothing left to find."

[ledgergood."ledger.binding.iridescent"]
name.value = "Escama iridiscente"
name.en = "Iridescent Scale"
description.value = "Escamas de todos los colores que el agua ha soltado alguna vez, una sobre otra. Nunca se ve igual dos veces."
description.en = "Scales in every colour the water ever gave up, laid one over the next. It never looks the same twice."

[ledgergood."ledger.toaststyle.legend"]
name.value = "Historia de pescador"
name.en = "The Tall Tale"
description.value = "Para las piezas que se discuten en el muelle durante años. Borde dorado, seda azul y un sello como es debido."
description.en = "Kept for the catches people argue about at the docks for years. Gilt border, blue silk, a proper seal."

[ledgergood."ledger.toaststyle.prestige"]
name.value = "Vitela sangre de buey"
name.en = "Oxblood Vellum"
description.value = "Vitela color sangre de buey y laureles dorados, para un pescador que volvió a empezar y lo hizo todo otra vez."
description.en = "Oxblood vellum and gilt laurels, for an angler who started over and did it all again."

[ledgergood."ledger.soundset.concertina"]
name.value = "Concertina de lobo de mar"
name.en = "Old Salt's Concertina"
description.value = "Una frase de concertina de una canción marinera que todos se saben a medias, tocada por alguien que se la sabe entera."
description.en = "A squeezebox phrase from a sea song everyone half-knows, played by somebody who knows all of it."

[ledgergood."ledger.soundset.choir"]
name.value = "Coro de las profundidades"
name.en = "Choir of the Deep"
description.value = "Voces graves que suben del agua profunda, y algo muy grande que canta con ellas desde abajo."
description.en = "Low voices swelling up from deep water, and something very large singing along underneath."

[ledgergood."ledger.binding.wave"]
name.value = "Ola rompiente"
name.en = "Breaking Wave"
description.value = "Tafilete azul con una gran ola grabada, la cresta realzada en oro. En algún punto de su ladera va un bote muy pequeño."
description.en = "Blue morocco with one great wave pressed into it, its crest picked out in gold. Somewhere on its shoulder is a very small boat."

[ledgergood."ledger.binding.logbook"]
name.value = "Bitácora del capitán"
name.en = "Captain's Logbook"
description.value = "Tapas de lona y esquinas de becerro, una brújula engastada en la cubierta y una correa contra los rociones. La mancha de agua venía de regalo."
description.en = "Canvas boards and calfskin corners, a compass let into the cover and a strap to keep the spray out. The water stain came free."

[ledgergood."ledger.binding.heartwood"]
name.value = "Duramen tallado"
name.en = "Carved Heartwood"
description.value = "Dos tablas de roble viejo, un pez tallado hondo en la tapa y una hiedra que nadie plantó y a la que no hay forma de convencer de que se vaya."
description.en = "Two boards of old oak, a fish carved deep into the front, and ivy that was never planted there and will not be talked out of it."

[ledgergood."ledger.binding.stormglass"]
name.value = "Relicario de tormenta"
name.en = "Stormglass Reliquary"
description.value = "Tapas de hierro, bisagras de pletina y una ventana con una tormenta dentro. Nadie recuerda haber metido el pez ahí."
description.en = "Iron boards, strap hinges and a window with a storm kept in it. Nobody remembers putting the fish in there."

[ledgergood."ledger.binding.lacquer"]
name.value = "Koi en laca negra"
name.en = "Black Lacquer Koi"
description.value = "Treinta capas de laca negra, dos koi en oro y un lomo cosido con seda roja. Lleva un año hacerla y un segundo llenarla de huellas."
description.en = "Thirty coats of black lacquer, two koi laid in gold, and a spine sewn with red silk. It takes a year to make and a second to fingerprint."

[ledgergood."ledger.binding.knit"]
name.value = "Punto de ochos"
name.en = "Cable Knit"
description.value = "Una cubierta tejida con la misma lana que el jersey del pescador, botones de trenca incluidos. Huele un poco a lluvia y abriga más de lo que tiene derecho."
description.en = "A cover knitted from the same wool as the angler's jumper, toggles and all. It smells faintly of rain and is warmer than it has any right to be."

[ledgergood."ledger.binding.flywallet"]
name.value = "Cartera de moscas"
name.en = "Fly Wallet"
description.value = "Lona encerada con un vellón delante, y en el vellón las moscas que funcionaron. Las que no, están en el fondo del lago."
description.en = "Waxed canvas with a fleece in the front, and in the fleece the flies that worked. The ones that did not are at the bottom of the lake."

[ledgergood."ledger.binding.carapace"]
name.value = "Caparazón de cangrejo"
name.en = "Crab Carapace"
description.value = "El caparazón de un cangrejo que se creía más grande que la barca, y casi lo era. Aún mantiene las páginas cerradas a pellizcos."
description.en = "The shell of a crab that thought it was bigger than the boat, and very nearly was. It still pinches the pages shut."

[ledgergood."ledger.binding.ember"]
name.value = "Escama de ascua"
name.en = "Ember Scale"
description.value = "Escamas de algo que vivió demasiado cerca de la forja, aún calientes por dentro. No la dejes en la mesilla de noche."
description.en = "Scales from something that lived too near the forge, still warm at the heart. Do not leave it on the bedside table."

[ledgergood."ledger.toaststyle.glass"]
name.value = "Vidriera de capilla"
name.en = "Chapel Glass"
description.value = "Una ventana de una capilla junto al agua, emplomada a mano. Las palabras van en el único cristal transparente; el resto es rubí, cobalto y el color de la última luz."
description.en = "A window from a chapel by the water, leaded by hand. The words sit in the one clear pane; the rest is ruby, cobalt and the colour of late light."

[ledgergood."ledger.toaststyle.deep"]
name.value = "Señuelo abisal"
name.en = "The Deep Lure"
description.value = "Escrito con la única luz del fondo del lago. Algo ahí abajo sujeta la presa entre los dientes y no tiene prisa por soltarla."
description.en = "Written by the only light at the bottom of the lake. Something down there holds the catch in its teeth and is in no hurry to let go."

[ledgergood."ledger.toaststyle.koi"]
name.value = "Tinta y koi"
name.en = "Ink and Koi"
description.value = "Un rollo de un pintor que solo pintó peces, y los pintó bien. El círculo alrededor de la captura le llevó un solo aliento."
description.en = "A scroll from a painter who only ever painted fish, and painted them well. The circle round the catch took one breath."

[ledgergood."ledger.toaststyle.trophy"]
name.value = "Trofeo de pared"
name.en = "Mounted Trophy"
description.value = "Nogal, latón y cuatro buenos tornillos. De esas cosas que se cuelgan sobre la chimenea y se señalan el resto de la velada."
description.en = "Walnut, brass and four good screws. The sort of thing that goes over the fireplace and gets pointed at for the rest of the evening."

[ledgergood."ledger.toaststyle.slate"]
name.value = "Pizarra del pescadero"
name.en = "Fishmonger's Slate"
description.value = "Escrita con tiza esta mañana, sobre hielo a mediodía. El precio es lo que el pescadero crea que puedes aguantar."
description.en = "Chalked up this morning, on ice by noon. The price is whatever the fishmonger thinks you can bear."

[ledgergood."ledger.toaststyle.ice"]
name.value = "A través del hielo"
name.en = "Through the Ice"
description.value = "Un palmo de buen hielo negro, un agujero y mucha espera. Cuando sube la bandera corres, y el frío te da igual."
description.en = "Six inches of good black ice, one hole and a lot of waiting. When the flag goes up you run, and you do not mind the cold."

[ledgergood."ledger.toaststyle.stitch"]
name.value = "Dechado a punto de cruz"
name.en = "Cross-Stitch Sampler"
description.value = "Bordado por alguien paciente en las largas noches entre temporadas. Cada pez le llevó una velada; la aguja sigue clavada."
description.en = "Stitched by someone patient on the long nights between seasons. Every fish in it took an evening; the needle is still in."

[ledgergood."ledger.toaststyle.crier"]
name.value = "Bando del pregonero"
name.en = "Town Crier's Proclamation"
description.value = "Leído en la plaza a mediodía, entre el precio del pan y el caballero al que armaron caballero. Todo verdad, dedo arriba, dedo abajo."
description.en = "Read out in the square at noon, between the price of bread and the knight who was knighted. Every word of it true, give or take an inch."

[ledgergood."ledger.toaststyle.hall"]
name.value = "Salón de la montaña"
name.en = "Mountain Hall"
description.value = "Tallado en la roca viva bajo la montaña e incrustado por un herrero que midió dos veces y presumió tres. Las runas mantienen caliente la forja."
description.en = "Cut from the living rock under the mountain and inlaid by a smith who measured twice and boasted three times. The runes keep the forge warm."

[ledgergood."ledger.toaststyle.glade"]
name.value = "Claro estrellado"
name.en = "Starlit Glade"
description.value = "Escrito a la luz de la luna junto a un estanque sagrado, donde el agua recuerda todo lo que ha nadado en ella. Los fuegos fatuos vinieron a leer por encima de tu hombro."
description.en = "Written by moonlight at the edge of a sacred pool, where the water remembers everything that ever swam in it. The wisps came to read over your shoulder."

[ledgergood."ledger.toaststyle.blueprint"]
name.value = "Plano del manitas"
name.en = "Tinker's Blueprint"
description.value = "Trazado en el taller entre otros tres inventos y un pequeño incendio. Escala uno a uno, tolerancias opcionales, pesca garantizada (no garantizada)."
description.en = "Drawn up in the workshop between three other inventions and a small fire. Scale one to one, tolerances optional, catch guaranteed (not guaranteed)."

[ledgergood."ledger.toaststyle.drum"]
name.value = "Tambor del clan"
name.en = "Clan Drum"
description.value = "Tensado sobre un bastidor junto al fuego, pintado con la mano del clan y golpeado tan fuerte que despierta al valle de al lado. Un golpe por cada pez digno de contarse."
description.en = "Stretched over a frame by the fire, painted with the clan’s hand and beaten loud enough to wake the next valley. One beat for every fish worth telling."

[ledgergood."ledger.toaststyle.shroud"]
name.value = "Sudario"
name.en = "Grave Shroud"
description.value = "Arrancado de la tela con la que te enterraron, y vuelto a coser cuando saliste a pescar. A la presa no le importa. La presa no lo sabe."
description.en = "Torn from the cloth they buried you in, and stitched back up when you climbed out to go fishing. The catch doesn’t mind. The catch doesn’t know."

[ledgergood."ledger.toaststyle.totem"]
name.value = "Tótem de las llanuras"
name.en = "Plains Totem"
description.value = "Pintado sobre una piel junto a un fuego, bajo un cielo enorme, por alguien que cree que cada pez es un regalo de la Tierra. Da las gracias."
description.en = "Painted on a hide by a fire under a very large sky, by someone who believes every fish is a gift from the Earth. Say thank you."

[ledgergood."ledger.toaststyle.hex"]
name.value = "Maleficio de la selva"
name.en = "Jungle Hex"
description.value = "Atado por un médico brujo en una isla donde los peces devuelven el mordisco. La máscara ha visto tu futuro: más peces. La máscara ha visto cosas peores."
description.en = "Lashed together by a witch doctor on an island where the fish bite back. The mask has seen your future: more fish. The mask has seen worse."

[ledgergood."ledger.toaststyle.lion"]
name.value = "Carta del león"
name.en = "Lion's Charter"
description.value = "Tallada en la piedra blanca de una ciudad portuaria que nunca deja de construir, y sellada bajo el león de sus reyes. Los estandartes solo ondean por una pieza digna de trompetas."
description.en = "Cut from the white stone of a harbour city that never stops building, and sealed under the lion of its kings. The banners only fly for a catch worth the trumpets."

[ledgergood."ledger.toaststyle.warband"]
name.value = "Hueste de hierro"
name.en = "Iron Warband"
description.value = "Forjada bajo un cielo rojo en una ciudad hecha de hierro y rencores. Los braseros arden por el clan; los zarpazos son para quien dudó de la captura."
description.en = "Hammered out under a red sky in a city built of iron and grudges. The braziers burn for the clan; the claw-marks are for whoever doubted the catch."

[ledgergood."ledger.toaststyle.cartographer"]
name.value = "Folio del cartógrafo"
name.en = "Cartographer's Folio"
description.value = "Una carta que nunca se termina. Cada agua que te sabes de memoria está entintada: costa, colinas, sondas mar adentro. El resto sigue a lápiz, esperando."
description.en = "A chart that is never finished. Every water you have learned by heart is inked in: coast, hills, the soundings offshore. The rest stays in pencil, waiting."

[ledgergood."ledger.toaststyle.gala"]
name.value = "Gala del gran torneo"
name.en = "Extravaganza Gala"
description.value = "La noche del gran torneo, cuando todo el puerto cuelga sus luces y nadie se va a casa antes de los fuegos artificiales. Esta es para los pescadores que trajeron los tres."
description.en = "The night of the great contest, when the whole harbour strings up its lights and nobody goes home before the fireworks. This one is for the anglers who brought back all three."

[prestigeframe.none]
name.value = "Sin escribir"
name.en = "Unwritten"
description.value = "Un anillo de tinta, y una conjetura a lápiz de lo que irá alrededor."
description.en = "A ring in ink, and a pencilled guess at what will go round it."

[prestigeframe.jetty]
name.value = "El embarcadero"
name.en = "The Jetty"
description.value = "Tablones del viejo embarcadero, atados en un anillo, que aún huelen a brea y a marea baja."
description.en = "Planks off the old jetty, lashed into a ring, still smelling of tar and low tide."

[prestigeframe.castoff]
name.value = "Soltando amarras"
name.en = "Casting Off"
description.value = "La borda de un bote de tingladillo, con tres capas de pintura, y los remos recogidos encima."
description.en = "The rail of a clinker-built rowboat, three coats of paint deep, with the oars shipped across it."

[prestigeframe.lighthouse]
name.value = "El faro"
name.en = "The Lighthouse"
description.value = "La linterna al final del cabo, toda de cristal, con la luz saliendo sobre el agua."
description.en = "The lamp room at the end of the point, glass all round and the light going out over the water."

[prestigeframe.opensea]
name.value = "Mar abierto"
name.en = "The Open Sea"
description.value = "Una rosa de los vientos de la carta de un navegante, cada rumbo exacto y el norte coronado en oro."
description.en = "A compass rose off a navigator’s chart, every point of it true, the north crowned in gold."

[prestigeframe.storm]
name.value = "La tormenta"
name.en = "The Storm"
description.value = "El timón de un queche en plena galerna: caoba, latón y ocho buenas cabillas, y el cielo deshaciéndose encima."
description.en = "The helm of a ketch in a full gale: mahogany, brass and eight good spokes, and the sky coming apart overhead."

[prestigeframe.dive]
name.value = "La inmersión"
name.en = "The Dive"
description.value = "Un casco de buzo de cobre, atornillado y lleno de aire. El pescador ha saltado por la borda para mirar al pez a los ojos."
description.en = "A copper diving helmet, bolted down and pumped full of air. The angler has gone over the side to look the fish in the eye."

[prestigeframe.coral]
name.value = "Los jardines de coral"
name.en = "The Coral Gardens"
description.value = "Un anillo de nácar en un arrecife: coral rojo por un lado, un abanico de mar por el otro y siempre alguien que pasa nadando."
description.en = "A ring of mother-of-pearl in a reef: red coral up one side, a sea fan on the other, and somebody always swimming past."

[prestigeframe.midnight]
name.value = "La zona de medianoche"
name.en = "The Midnight Zone"
description.value = "Cristal negro de donde no baja la luz, iluminado por lo que vive allí. Una de esas cosas se ha interesado."
description.en = "Black glass from where no light comes down, lit by the things that live there. One of them has taken an interest."

[prestigeframe.leviathan]
name.value = "El leviatán"
name.en = "The Leviathan"
description.value = "La serpiente del fondo de toda historia de marineros, enroscada en un anillo de oro viejo con la cola en la boca."
description.en = "The serpent at the bottom of every sailor’s story, coiled round a ring of old gold with its own tail in its mouth."

[prestigeframe.starward]
name.value = "El mar de las estrellas"
name.en = "The Starward Sea"
description.value = "Donde se acaba el mar empieza el cielo: una esfera armilar de oro y plata bajo la noche, y los peces viejos entre las estrellas."
description.en = "Where the sea runs out the sky begins: an armillary of gold and silver under the night, and the old fish among the stars."

[prestigeframe.constellation]
name.value = "La constelación del pescador"
name.en = "The Angler’s Constellation"
description.value = "Pasado el décimo, te ponen en el cielo: un pescador de estrellas con caña y sedal, y un pez en la punta. Una estrella más en la corona por cada Prestigio de Maestro."
description.en = "Past the tenth, they put you in the sky: an angler of stars with a rod and a line, and a fish on the end of it. One more star in the crown for every Master Prestige."
