[line.uncaughtlegend]
text.value = "Algunos peces solo se pescan muy de vez en cuando. Esta página espera a uno."
text.en = "Some fish are only caught once in a long while. This page waits for one."

[line.uncaughtjunk]
text.value = "El pedestal está limpio y listo. La pieza se retrasa."
text.en = "The plinth is dusted and ready. The exhibit is late."

[line.uncaughttreasure]
text.value = "Algo sellado, aún sin encontrar."
text.en = "Something sealed, not yet found."

[line.unchartedwaters]
text.value = "Aguas sin catalogar. Aún no hay mapa de estas."
text.en = "Uncharted waters. No map of these yet."

