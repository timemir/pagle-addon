# Hunts' lore in Spanish (Spain), over data/lore/hunts.toml, data/hunts/hunts.toml and data/hunts/events/ (DATA-R113).

[event."alterac_dawn_trout"]
name.value = "Truchas al alba"
name.en = "Dawn Trout"
note.value = "Lagos fríos entre las cumbres. La apuesta es trucha antes del desayuno, y la escarcha en el sedal va de regalo."
note.en = "Cold lakes high among the peaks. The wager is trout before breakfast, and the frost on the line comes free."

[event."azshara_lobster"]
name.value = "Langosta a la luz del farol"
name.en = "Lobster by Lamplight"
note.value = "Una costa rota de piedra caída y grandeza marchita. Las langostas no se apartan de las rocas, y las colas amarillas guardan las distancias."
note.en = "A broken coast of fallen stone and faded grandeur. The lobster keep close to the rocks, and the yellowtail keep their distance."

[event."barrens_oddities"]
name.value = "Bichos raros al ocaso"
name.en = "Oddity at Dusk"
note.value = "Las charcas de las llanuras secas dan algún pez extraño. Revísalos al ponerse el sol, y piénsatelo dos veces antes de cocinar ninguno."
note.en = "The pools of the dry plains turn out some strange fish. Look them over at sundown, and think twice before cooking any."

[event."burning_steppes_salmon"]
name.value = "Salmón bajo la ceniza"
name.en = "Salmon under Ash"
note.value = "Colinas negras, ceniza en el agua y salmones debajo. Trae un sombrero de ala ancha."
note.en = "Black hills, ash on the water and salmon under it. Bring a hat with a wide brim."

[event."darkshore_moonlight"]
name.value = "Meros bajo la luna"
name.en = "Grouper by Moonlight"
note.value = "Una larga costa gris bajo árboles viejos y oscuros. La apuesta es mero con la luna ya alta, y allí las noches son largas."
note.en = "A long grey coast under old, dark trees. The wager is grouper once the moon is up, and the nights there are long."

[event."deadwind_pass_night"]
name.value = "Paso frío, noche larga"
name.en = "Cold Pass, Long Night"
note.value = "Un paso frío donde nada crece, y una vieja torre vigilando el camino. A los salmones les trae sin cuidado."
note.en = "A cold pass where nothing grows, and an old tower keeping watch over the road. The salmon pay it no attention."

[event."duskwood_witching"]
name.value = "La hora de las brujas"
name.en = "Witching Hour"
note.value = "Ríos negros y lentos entre bosques donde nunca acaba de hacerse de día. Pasada la medianoche pican los peces, y todo lo demás también."
note.en = "Slow black rivers through woods where it never quite gets light. After midnight the fish bite, and so does everything else."

[event."dustwallow_marsh_night"]
name.value = "Noche cerrada en la ciénaga"
name.en = "Late on the Marsh"
note.value = "Una costa cálida y húmeda que zumba toda la noche. Truchas en los arroyos, colas amarillas frente a la orilla y siempre algo picándote en el cuello."
note.en = "A warm, wet coast that hums all night. Trout in the creeks, yellowtail off the shore, and something always biting your neck."

[event."eastern_plaguelands_night"]
name.value = "Medianoche en el este muerto"
name.en = "Midnight in the Dead East"
note.value = "Nadie pesca en el este muerto de noche si puede evitarlo. Los salmones ya cuentan con ello."
note.en = "Nobody fishes the dead east after dark if they can help it. The salmon have come to count on that."

[event."eastern_plaguelands_redgill"]
name.value = "Lagos lúgubres del este"
name.en = "Grim Lakes of the East"
note.value = "Lúgubres por fuera y generosos por dentro, como casi todos los buenos lagos y algunos pescadores viejos."
note.en = "Grim to look at and generous underneath, like most good lakes and some old anglers."

[event."felwood_moonglade"]
name.value = "Bosque corrupto, lago claro"
name.en = "Tainted Woods, Clear Lake"
note.value = "Arroyos enfermizos bajo los árboles corruptos, y más allá un lago claro y tranquilo. A las agallarrojas no parece importarles la diferencia."
note.en = "Sickly streams under the tainted trees, and a clear, quiet lake beyond them. The redgill don't seem to notice the difference."

[event."feralas_redgill"]
name.value = "Agallarrojas bajo la lluvia"
name.en = "Redgill in the Rain"
note.value = "Agallarrojas río arriba, colas amarillas frente a la costa y lluvia sobre ambas. El bosque nunca acaba de secarse."
note.en = "Redgill up the rivers, yellowtail off the coast, and rain over both. The forest never quite dries."

[event."hinterlands_coast"]
name.value = "Colinas hasta el mar"
name.en = "Where the Hills Meet the Sea"
note.value = "Colinas salvajes, grifos en el cielo y un mar tranquilo al fondo de todo. Lo que nada allá abajo compensa la bajada."
note.en = "Wild hill country, gryphons overhead, and a quiet sea at the bottom of it all. The mightfish are worth the climb down."

[event."hinterlands_redgill"]
name.value = "Ríos fríos, noches largas"
name.en = "Cold Rivers, Late Nights"
note.value = "Ríos claros y fríos entre las colinas salvajes. Las agallarrojas trasnochan, así que trae otra manta."
note.en = "Clear, cold rivers through the wild hills. The redgill keep late hours, so bring a second blanket."

[event."loch_modan_frenzy"]
name.value = "Aguas de frenesí"
name.en = "Frenzy Water"
note.value = "Un lago ancho y frío en tierra de enanos, donde los peces pelean por encima de su tamaño. De vez en cuando sale con ellos algo más fino."
note.en = "A wide, cold lake in dwarf country, where the fish fight above their size. Now and then something finer comes up with them."

[event."silithus_coast"]
name.value = "Arena hasta la orilla"
name.en = "Sand to the Water's Edge"
note.value = "Arena hasta el agua, y algo zumbando en las dunas de atrás. Pasado el oleaje, todo es pescado de mar honrado."
note.en = "Sand all the way down to the water, and something buzzing in the dunes behind. Past the surf it's honest sea fish."

[event."silithus_salmon"]
name.value = "Salmones en la arena"
name.en = "Salmon in the Sand"
note.value = "Un salmón de escama blanca tan al sur sorprende a todos, empezando por el salmón. Aprovecha mientras dure la luz."
note.en = "Whitescale this far south is a surprise to everyone, the salmon included. Take them while the light lasts."

[event."stranglethorn_coast"]
name.value = "Orilla de la selva"
name.en = "Jungle Shore"
note.value = "Agua templada, playas largas y un bacalao bajo cada roca. No pierdas de vista la linde de la selva."
note.en = "Warm water, long beaches and a cod under every rock. Keep one eye on the treeline."

[event."tanaris_yellowtail"]
name.value = "Mediodía en la costa árida"
name.en = "Noon on the Desert Coast"
note.value = "Arena hasta la marea y ni una pizca de sombra. A las colas amarillas no les molesta el calor; al pescador, quizá sí."
note.en = "Sand to the tideline and not a scrap of shade. The yellowtail don't mind the heat; the angler might."

[event."tirisfal_silverpine_dusk"]
name.value = "Aguas grises al anochecer"
name.en = "Grey Waters at Dusk"
note.value = "Agua fría bajo los bosques grises del norte, tranquila como un camposanto. Aquí nadie tiene prisa, y los peces menos que nadie."
note.en = "Cold water under grey northern woods, quiet as a churchyard. Nobody here is in a hurry, least of all the fish."

[event."ungoro_redgill"]
name.value = "Anochecer en el cráter"
name.en = "Dusk in the Crater"
note.value = "Charcas humeantes al fondo del cráter, llenas de agallarrojas. Algo más grande vigila siempre desde los helechos."
note.en = "Steaming pools at the bottom of the crater, thick with redgill. Something larger is always watching from the ferns."

[event."western_plaguelands_lake"]
name.value = "Una tarde en la plaga"
name.en = "An Afternoon in the Blight"
note.value = "Tierras muertas, un cielo enfermo y un lago lleno de agallarrojas sanas. Nadie les ha hablado de la peste."
note.en = "Dead fields, a sick sky and a lake full of healthy redgill. Nobody has told them about the plague."

[event."winterspring_daylight"]
name.value = "Días cortos en la nieve"
name.en = "Short Days in the Snow"
note.value = "Allá en la nieve los días son cortos y los lagos, fríos. Gasta la luz en el agua y la oscuridad junto al fuego."
note.en = "Up in the snow the days are short and the lakes are cold. Spend the light on the water, and the dark by a fire."

[event."winterspring_salmon"]
name.value = "Salmón entre nieves"
name.en = "Snowbound Salmon"
note.value = "Agua fría, salmones blancos y tardes que oscurecen pronto. Cuidado con el hielo de vuelta a casa."
note.en = "Cold water, white salmon and the evenings drawing in early. Mind the ice on the way home."

