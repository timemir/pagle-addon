[huntgood."hunts.binding.pathfinder"]
description.value = "Suave piel de becerro con una rosa de los vientos estampada. Para pescadores que llevaron una serie de cazas entera hasta el final."
description.en = "Soft calfskin pressed with a compass rose. Handed to anglers who saw a whole set of hunts through to the end."
name.value = "Becerro del explorador"
name.en = "Pathfinder's Calf"

[huntgood."hunts.binding.wagersilk"]
description.value = "Brocado de seda morada tejido con monedas y peces, cruzado por una banda roja. Para pescadores que no paran de ganar las apuestas de la casa."
description.en = "Purple silk brocade woven with coins and fish, a red sash across it. Given to anglers who keep winning the house’s bets."
name.value = "Brocado del ganador"
name.en = "Winner's Brocade"

[huntgood."hunts.soundset.nightwatch"]
description.value = "Una campana grave para la guardia nocturna, un farol que zumba y un búho que ha visto cada pieza que has sacado."
description.en = "A low bell for the night watch, a lantern humming and an owl who has seen every catch you ever made."
name.value = "Guardia nocturna"
name.en = "Night Watch"

[huntgood."hunts.toaststyle.nightfin"]
description.value = "Más allá del cabo, donde acaba la luz, los peces de la noche nadan bajo la luna llena. Quédate quieto el tiempo suficiente y uno la cruza de un salto."
description.en = "Out past the headland, where the light ends, the nightfin run under a full moon. Hold still long enough and one jumps clean across it."
name.value = "Aletas bajo la luna"
name.en = "Nightfin Tide"

[huntgood."hunts.toaststyle.study"]
description.value = "Un cuaderno abierto sobre un escritorio, la lámpara aún encendida y el tintero destapado, sus mejores moscas colgadas en el aire tibio sobre la página. Nadie lo ha pillado nunca en ello. Tampoco nadie ha visto nunca el escritorio vacío."
description.en = "A journal open on a desk, the lamp still lit and the ink uncapped, his best flies hanging in the warm air over the page. Nobody has ever caught him at it. Nobody has ever seen the desk empty, either."
name.value = "El estudio de Nat"
name.en = "Nat's Study"

[huntgood."hunts.toaststyle.trench"]
description.value = "Por debajo de donde se rinde la luz del sol, y por debajo de donde se rinden los faroles de los rapes. Aquí abajo vive algo muy grande, y se ha fijado en el sedal."
description.en = "Below where the sunlight gives up, and below where the anglerfish lanterns give up. Something very large lives down here, and it has noticed the line."
name.value = "La fosa profunda"
name.en = "The Deep Trench"

[huntgood."hunts.trackerframe.bounty"]
description.value = "Clavado en la caseta del muelle, con las esquinas rizadas. El pez tiene precio, y el precio no deja de subir."
description.en = "Nailed up at the dock house, edges curling. The fish on it has a price, and the price is going up."
name.value = "Cartel de recompensa"
name.en = "Bounty Poster"

[huntgood."hunts.trackerframe.inkwash"]
description.value = "Una hoja escrita con tinta azul, la aguada algo corrida, como una página a la que le saltó la espuma."
description.en = "A sheet of paper written in blue ink, the wash run a little, like a page that caught the spray."
name.value = "Aguada de tinta"
name.en = "Ink Wash"

[huntgood."hunts.trackerframe.mapscrap"]
description.value = "Una esquina arrancada de un mapa de caza: un sendero punteado, una brújula y el cerco del café de alguien."
description.en = "A corner torn off a hunting map: a dotted trail, a compass, and somebody’s coffee ring."
name.value = "Trozo de mapa"
name.en = "Map Scrap"

[huntgood."hunts.trackerframe.none"]
description.value = "Solo las líneas, sin nada dibujado alrededor."
description.en = "Only the lines themselves, with nothing drawn around them."
name.value = "Sin marco"
name.en = "No Frame"

[huntgood."hunts.trackerframe.slate"]
description.value = "Una pizarra en un marco atado con cuerda, escrita con tiza cada mañana y emborronada a mediodía."
description.en = "A slate in a rope-bound frame, chalked fresh each morning and smudged by noon."
name.value = "Pizarra de tiza"
name.en = "Chalk Slate"

[huntgood."hunts.trackerframe.spyglass"]
description.value = "Esmalte azul marino entre dos rieles de latón, con el ocular de la esquina vuelto hacia la próxima caza."
description.en = "Navy enamel between two brass rails, the eyepiece at the corner turned toward the next hunt."
name.value = "Borde de catalejo"
name.en = "Spyglass Rim"

[huntgood."hunts.trackerframe.wagerribbon"]
description.value = "Una cinta de seda morada con fleco dorado, para pescadores que no paran de ganarle a la casa en sus propias apuestas."
description.en = "A purple silk ribbon with a gold fringe, for anglers who keep beating the house at its own wagers."
name.value = "Cinta del ganador"
name.en = "Winner's Ribbon"

[huntgood."hunts.trackerframe.waxseal"]
description.value = "Pergamino con una línea roja en el margen y un sello de lacre en la esquina, como si la lista fuera oficial."
description.en = "Parchment with a red rule down its margin and a wax seal pressed in the corner, as if the list were official."
name.value = "Sello de lacre"
name.en = "Wax Seal"

