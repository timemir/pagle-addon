[boardgood."tackleboard.trackerframe.none"] # Tracker frame, the default, was "No frame"
name.value = "Sin marco"
name.en = "No Frame"
description.value = "La lista a solas, sin nada clavado detrás. Nunca se comba con la humedad."
description.en = "The list on its own, with nothing pinned behind it. It never warps in the damp."

[boardgood."tackleboard.trackerframe.corkboard"] # Tracker frame, tier 1
name.value = "Tablero de corcho"
name.en = "Corkboard"
description.value = "Una plancha de corcho, picada de agujeros de trabajos acabados hace tiempo. Siempre cabe uno más."
description.en = "A slab of cork, pocked with pinholes from jobs long finished. There is always room for one more."

[boardgood."tackleboard.trackerframe.driftwood"] # Tracker frame, tier 2, was "Driftwood Plank"
name.value = "Tabla curtida por la marea"
name.en = "Tideworn Plank"
description.value = "Una tabla gris como el mar, alisada por la marea y clavada junto al muelle. Ha viajado más lejos que muchos barcos."
description.en = "A sea-grey plank, worn smooth by the tide and nailed up by the dock. It has travelled further than most boats."

[boardgood."tackleboard.toaststyle.ember"] # core.toaststyle, earned: Campfire: 100 days
name.value = "Ascua del hogar"
name.en = "Hearth Ember"
description.value = "Una página que estuvo a punto de ser yesca. Los bordes aún brillan cuando entra un buen pez."
description.en = "A page that was nearly kindling once. The edges still glow when a good fish comes in."

[boardgood."tackleboard.trackerframe.net"] # tackleboard.trackerframe, tier 1
name.value = "Red de pesca"
name.en = "Fishing Net"
description.value = "Un trozo de red vieja colgado sobre las líneas, con los corchos aún atados a lo largo del borde de arriba."
description.en = "A square of old net hung over the lines, its cork floats still tied along the top."

[boardgood."tackleboard.trackerframe.bamboo"] # tackleboard.trackerframe, tier 1
name.value = "Listones de bambú"
name.en = "Bamboo Slats"
description.value = "Listones de bambú atados con cordel, de esos que se enrollan y se meten a presión en la bolsa de aparejos."
description.en = "Bamboo slats lashed with cord, the sort of thing you roll up and stuff in the tackle bag."

[boardgood."tackleboard.trackerframe.tin"] # tackleboard.trackerframe, tier 2
name.value = "Lata de aparejos"
name.en = "Tackle Tin"
description.value = "Una lata de aparejos de esmalte verde, abollada y desconchada, con la tapa repujada y la bisagra algo oxidada."
description.en = "A green enamel tackle tin, dented and chipped, its lid embossed and its hinge a little rusty."

[boardgood."tackleboard.trackerframe.bobber"] # tackleboard.trackerframe, tier 2
name.value = "Boya"
name.en = "Bobber"
description.value = "Rojo sobre blanco, como una buena boya, y con una flotando en la esquina, sedal incluido."
description.en = "Red over white like a good bobber, with one floating at the corner, line and all."

[boardgood."tackleboard.trackerframe.embers"] # tackleboard.trackerframe, earned: Campfire: 365 days
name.value = "Brasas vivas"
name.en = "Live Embers"
description.value = "Madera de deriva carbonizada, con el fuego aún vivo en las grietas. Hizo falta un año de hogueras."
description.en = "Charred driftwood with the fire still living in its cracks. A year of fires went into this one."
