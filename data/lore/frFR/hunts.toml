# Hunts's lore in French (frFR), over the English of addons/Pagle_Hunts/data/Lore.lua (DATA-R113, DATA-R114).
# Machine-drafted: written by an AI model (Claude) for 1.5.3 and not yet reviewed by a native French speaker.

[event.alterac_dawn_trout]
name.value = "Truite à l’aube"
name.en = "Dawn Trout"
note.value = "Des lacs froids, haut parmi les cimes. Le pari, c’est la truite avant le petit-déjeuner, et le givre sur la ligne est offert."
note.en = "Cold lakes high among the peaks. The wager is trout before breakfast, and the frost on the line comes free."

[event.azshara_lobster]
name.value = "Homard à la lanterne"
name.en = "Lobster by Lamplight"
note.value = "Une côte brisée de pierres tombées et de grandeur fanée. Les homards restent près des rochers, et les jaune-queues gardent leurs distances."
note.en = "A broken coast of fallen stone and faded grandeur. The lobster keep close to the rocks, and the yellowtail keep their distance."

[event.barrens_oddities]
name.value = "Curiosité au crépuscule"
name.en = "Oddity at Dusk"
note.value = "Les mares des plaines arides donnent de drôles de poissons. Examinez-les au coucher du soleil, et réfléchissez à deux fois avant d’en cuire un."
note.en = "The pools of the dry plains turn out some strange fish. Look them over at sundown, and think twice before cooking any."

[event.burning_steppes_salmon]
name.value = "Saumon sous la cendre"
name.en = "Salmon under Ash"
note.value = "Collines noires, cendre sur l’eau et saumons dessous. Prévoyez un chapeau à large bord."
note.en = "Black hills, ash on the water and salmon under it. Bring a hat with a wide brim."

[event.darkshore_moonlight]
name.value = "Mérou au clair de lune"
name.en = "Grouper by Moonlight"
note.value = "Une longue côte grise sous de vieux arbres sombres. Le pari, c’est le mérou une fois la lune levée, et les nuits y sont longues."
note.en = "A long grey coast under old, dark trees. The wager is grouper once the moon is up, and the nights there are long."

[event.deadwind_pass_night]
name.value = "Col froid, longue nuit"
name.en = "Cold Pass, Long Night"
note.value = "Un col froid où rien ne pousse, et une vieille tour qui veille sur la route. Les saumons ne lui prêtent aucune attention."
note.en = "A cold pass where nothing grows, and an old tower keeping watch over the road. The salmon pay it no attention."

[event.duskwood_witching]
name.value = "L’heure des sorcières"
name.en = "Witching Hour"
note.value = "De lentes rivières noires dans des bois où il ne fait jamais tout à fait jour. Après minuit, les poissons mordent, et tout le reste aussi."
note.en = "Slow black rivers through woods where it never quite gets light. After midnight the fish bite, and so does everything else."

[event.dustwallow_marsh_night]
name.value = "Tard sur le marais"
name.en = "Late on the Marsh"
note.value = "Une côte chaude et humide qui bourdonne toute la nuit. Des truites dans les criques, des jaune-queues au large, et toujours quelque chose pour vous piquer la nuque."
note.en = "A warm, wet coast that hums all night. Trout in the creeks, yellowtail off the shore, and something always biting your neck."

[event.eastern_plaguelands_night]
name.value = "Minuit dans l’Est mort"
name.en = "Midnight in the Dead East"
note.value = "Personne ne pêche dans l’Est mort une fois la nuit tombée, s’il peut l’éviter. Les saumons ont fini par compter dessus."
note.en = "Nobody fishes the dead east after dark if they can help it. The salmon have come to count on that."

[event.eastern_plaguelands_redgill]
name.value = "Sinistres lacs de l’Est"
name.en = "Grim Lakes of the East"
note.value = "Sinistres à voir et généreux en dessous, comme la plupart des bons lacs et certains vieux pêcheurs."
note.en = "Grim to look at and generous underneath, like most good lakes and some old anglers."

[event.felwood_moonglade]
name.value = "Bois souillés, lac clair"
name.en = "Tainted Woods, Clear Lake"
note.value = "Des ruisseaux maladifs sous les arbres souillés, et un lac clair et tranquille au-delà. Les rougets ne semblent pas voir la différence."
note.en = "Sickly streams under the tainted trees, and a clear, quiet lake beyond them. The redgill don't seem to notice the difference."

[event.feralas_redgill]
name.value = "Rougets sous la pluie"
name.en = "Redgill in the Rain"
note.value = "Des rougets en remontant les rivières, des jaune-queues au large, et de la pluie sur les deux. La forêt ne sèche jamais tout à fait."
note.en = "Redgill up the rivers, yellowtail off the coast, and rain over both. The forest never quite dries."

[event.hinterlands_coast]
name.value = "Où les collines rejoignent la mer"
name.en = "Where the Hills Meet the Sea"
note.value = "Des collines sauvages, des griffons au-dessus, et une mer tranquille tout en bas. Les barracudas valent bien la descente."
note.en = "Wild hill country, gryphons overhead, and a quiet sea at the bottom of it all. The mightfish are worth the climb down."

[event.hinterlands_redgill]
name.value = "Rivières froides, nuits tardives"
name.en = "Cold Rivers, Late Nights"
note.value = "Des rivières claires et froides à travers les collines sauvages. Les rougets veillent tard : prévoyez une deuxième couverture."
note.en = "Clear, cold rivers through the wild hills. The redgill keep late hours, so bring a second blanket."

[event.loch_modan_frenzy]
name.value = "Eaux de furie"
name.en = "Frenzy Water"
note.value = "Un grand lac froid en pays nain, où les poissons se battent au-dessus de leur taille. De temps en temps, quelque chose de plus fin remonte avec eux."
note.en = "A wide, cold lake in dwarf country, where the fish fight above their size. Now and then something finer comes up with them."

[event.silithus_coast]
name.value = "Du sable jusqu’à l’eau"
name.en = "Sand to the Water's Edge"
note.value = "Du sable jusqu’au bord de l’eau, et quelque chose qui bourdonne dans les dunes derrière. Passé le ressac, ce sont d’honnêtes poissons de mer."
note.en = "Sand all the way down to the water, and something buzzing in the dunes behind. Past the surf it's honest sea fish."

[event.silithus_salmon]
name.value = "Saumons dans le sable"
name.en = "Salmon in the Sand"
note.value = "Des blanchécailles si loin au sud, c’est une surprise pour tout le monde, saumons compris. Prenez-les tant que dure la lumière."
note.en = "Whitescale this far south is a surprise to everyone, the salmon included. Take them while the light lasts."

[event.stranglethorn_coast]
name.value = "Rivage de jungle"
name.en = "Jungle Shore"
note.value = "Une eau chaude, de longues plages et une morue sous chaque rocher. Gardez un œil sur la lisière des arbres."
note.en = "Warm water, long beaches and a cod under every rock. Keep one eye on the treeline."

[event.tanaris_yellowtail]
name.value = "Midi sur la côte du désert"
name.en = "Noon on the Desert Coast"
note.value = "Du sable jusqu’à la laisse de mer et pas un brin d’ombre. Les jaune-queues ne craignent pas la chaleur ; le pêcheur, peut-être."
note.en = "Sand to the tideline and not a scrap of shade. The yellowtail don't mind the heat; the angler might."

[event.tirisfal_silverpine_dusk]
name.value = "Eaux grises au crépuscule"
name.en = "Grey Waters at Dusk"
note.value = "De l’eau froide sous les forêts grises du nord, calme comme un cimetière. Personne n’est pressé ici, et les poissons moins que quiconque."
note.en = "Cold water under grey northern woods, quiet as a churchyard. Nobody here is in a hurry, least of all the fish."

[event.ungoro_redgill]
name.value = "Crépuscule dans le cratère"
name.en = "Dusk in the Crater"
note.value = "Des bassins fumants au fond du cratère, grouillants de rougets. Quelque chose de plus gros guette toujours depuis les fougères."
note.en = "Steaming pools at the bottom of the crater, thick with redgill. Something larger is always watching from the ferns."

[event.western_plaguelands_lake]
name.value = "Un après-midi en terre flétrie"
name.en = "An Afternoon in the Blight"
note.value = "Des champs morts, un ciel malade et un lac plein de rougets en pleine santé. Personne ne leur a parlé de la peste."
note.en = "Dead fields, a sick sky and a lake full of healthy redgill. Nobody has told them about the plague."

[event.winterspring_daylight]
name.value = "Jours courts dans la neige"
name.en = "Short Days in the Snow"
note.value = "Là-haut, dans la neige, les jours sont courts et les lacs froids. Passez la lumière sur l’eau, et la nuit près d’un feu."
note.en = "Up in the snow the days are short and the lakes are cold. Spend the light on the water, and the dark by a fire."

[event.winterspring_salmon]
name.value = "Saumons des neiges"
name.en = "Snowbound Salmon"
note.value = "Eau froide, saumons blancs et le soir qui tombe tôt. Prenez garde à la glace en rentrant."
note.en = "Cold water, white salmon and the evenings drawing in early. Mind the ice on the way home."

