name.en = "White Fish, White Hills"

[huntgood."hunts.binding.fiveseal"]
description.value = "Cuir noir frappé de sceaux de cire, un pour chaque série de chasses qui existe. Personne ne contrefait celle-ci."
description.en = "Black leather with wax seals pressed into it, one for every set of hunts there is. Nobody fakes this one."
name.value = "Sceau des cinq séries"
name.en = "Five-Set Seal"

[huntgood."hunts.binding.pathfinder"]
description.value = "Un cuir de veau souple frappé d’une rose des vents. Remis aux pêcheurs qui ont mené une série de chasses entière jusqu’au bout."
description.en = "Soft calfskin pressed with a compass rose. Handed to anglers who saw a whole set of hunts through to the end."
name.value = "Veau de l’éclaireur"
name.en = "Pathfinder's Calf"

[huntgood."hunts.binding.wagersilk"]
description.value = "Brocart de soie pourpre tissé de pièces et de poissons, barré d’une écharpe rouge. Offert aux pêcheurs qui ne cessent de gagner les paris de la maison."
description.en = "Purple silk brocade woven with coins and fish, a red sash across it. Given to anglers who keep winning the house’s bets."
name.value = "Brocart du gagnant"
name.en = "Winner's Brocade"

[huntgood."hunts.soundset.nightwatch"]
description.value = "Une cloche grave pour la veille de nuit, une lanterne qui bourdonne et une chouette qui a vu chacune de vos prises."
description.en = "A low bell for the night watch, a lantern humming and an owl who has seen every catch you ever made."
name.value = "Veille de nuit"
name.en = "Night Watch"

[huntgood."hunts.toaststyle.nightfin"]
description.value = "Au-delà du promontoire, là où finit la lumière, les nagenuits filent sous la pleine lune. Restez assez longtemps immobile et l’un d’eux la traverse d’un bond."
description.en = "Out past the headland, where the light ends, the nightfin run under a full moon. Hold still long enough and one jumps clean across it."
name.value = "Marée de nagenuits"
name.en = "Nightfin Tide"

[huntgood."hunts.toaststyle.study"]
description.value = "Un journal ouvert sur un bureau, la lampe encore allumée et l’encrier débouché, ses meilleures mouches suspendues dans l’air tiède au-dessus de la page. Personne ne l’y a jamais surpris. Personne n’a jamais vu le bureau vide non plus."
description.en = "A journal open on a desk, the lamp still lit and the ink uncapped, his best flies hanging in the warm air over the page. Nobody has ever caught him at it. Nobody has ever seen the desk empty, either."
name.value = "Le cabinet de Nat"
name.en = "Nat's Study"

[huntgood."hunts.toaststyle.trench"]
description.value = "Plus bas que là où renonce la lumière du soleil, et plus bas que là où renoncent les lanternes des baudroies. Quelque chose de très grand vit ici, et il a remarqué la ligne."
description.en = "Below where the sunlight gives up, and below where the anglerfish lanterns give up. Something very large lives down here, and it has noticed the line."
name.value = "La fosse profonde"
name.en = "The Deep Trench"

[huntgood."hunts.trackerframe.bounty"]
description.value = "Cloué à la cabane du quai, les bords qui se recourbent. Le poisson dessus a un prix, et le prix monte."
description.en = "Nailed up at the dock house, edges curling. The fish on it has a price, and the price is going up."
name.value = "Avis de prime"
name.en = "Bounty Poster"

[huntgood."hunts.trackerframe.inkwash"]
description.value = "Une feuille écrite à l’encre bleue, le lavis un peu coulé, comme une page qui aurait pris les embruns."
description.en = "A sheet of paper written in blue ink, the wash run a little, like a page that caught the spray."
name.value = "Lavis d’encre"
name.en = "Ink Wash"

[huntgood."hunts.trackerframe.mapscrap"]
description.value = "Un coin arraché à une carte de chasse : un sentier en pointillés, une boussole, et le rond de tasse de quelqu’un."
description.en = "A corner torn off a hunting map: a dotted trail, a compass, and somebody’s coffee ring."
name.value = "Bout de carte"
name.en = "Map Scrap"

[huntgood."hunts.trackerframe.none"]
description.value = "Seulement les lignes elles-mêmes, sans rien dessiné autour."
description.en = "Only the lines themselves, with nothing drawn around them."
name.value = "Sans cadre"
name.en = "No Frame"

[huntgood."hunts.trackerframe.slate"]
description.value = "Une ardoise dans un cadre lié de corde, écrite à la craie chaque matin et barbouillée avant midi."
description.en = "A slate in a rope-bound frame, chalked fresh each morning and smudged by noon."
name.value = "Ardoise à craie"
name.en = "Chalk Slate"

[huntgood."hunts.trackerframe.spyglass"]
description.value = "De l’émail bleu marine entre deux rails de laiton, l’oculaire dans le coin tourné vers la prochaine chasse."
description.en = "Navy enamel between two brass rails, the eyepiece at the corner turned toward the next hunt."
name.value = "Bordure de longue-vue"
name.en = "Spyglass Rim"

[huntgood."hunts.trackerframe.wagerribbon"]
description.value = "Un ruban de soie pourpre à franges d’or, pour les pêcheurs qui battent sans cesse la maison à ses propres paris."
description.en = "A purple silk ribbon with a gold fringe, for anglers who keep beating the house at its own wagers."
name.value = "Ruban du gagnant"
name.en = "Winner's Ribbon"

[huntgood."hunts.trackerframe.waxseal"]
description.value = "Un parchemin à la marge réglée de rouge, un sceau de cire pressé dans le coin, comme si la liste était officielle."
description.en = "Parchment with a red rule down its margin and a wax seal pressed in the corner, as if the list were official."
name.value = "Sceau de cire"
name.en = "Wax Seal"

[ladder.100]
title.value = "Retraite du bookmaker"
title.en = "Bookmaker's Retirement"

[ladder.25]
title.value = "Fléau du bookmaker"
title.en = "Bookmaker's Bane"

[ladder.50]
title.value = "Ruine du bookmaker"
title.en = "Bookmaker's Ruin"

[set.camp_hours]
name.value = "Heures de camp"
name.en = "Camp Hours"
title.value = "Gardien de hutte"
title.en = "Hut Keeper"

[set.home_waters]
name.value = "Eaux familières"
name.en = "Home Waters"
note.value = "Vos premières eaux, près de chez vous."
note.en = "Your first waters, close to home."
title.value = "Docker"
title.en = "Dockhand"

[set.round_the_clock]
name.value = "Tout le tour du cadran"
name.en = "Round the Clock"
title.value = "Guetteur d’horloge"
title.en = "Clockwatcher"

[set.sunday_showdown]
name.value = "Le duel du dimanche"
name.en = "Sunday Showdown"
note.value = "Le grand concours de pêche, réservé aux personnages de niveau 60."
note.en = "The Extravaganza, for level 60 characters only."
title.value = "Concurrent de la jungle"
title.en = "Jungle Contender"

[set.turn_of_the_year]
name.value = "Au fil de l’année"
name.en = "Turn of the Year"
title.value = "Main de toutes saisons"
title.en = "All-Seasons Hand"
