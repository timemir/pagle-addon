# Tackleboard's lore in French (frFR), over the English of addons/Pagle_TackleBoard/data/Lore.lua (DATA-R113, DATA-R114).
# Machine-drafted: written by an AI model (Claude) for 1.5.3 and not yet reviewed by a native French speaker.

[boardgood."tackleboard.toaststyle.ember"]
description.value = "Une page qui a failli finir en petit bois. Les bords rougeoient encore quand un beau poisson arrive."
description.en = "A page that was nearly kindling once. The edges still glow when a good fish comes in."
name.value = "Braise de l’âtre"
name.en = "Hearth Ember"

[boardgood."tackleboard.trackerframe.bamboo"]
description.value = "Des lattes de bambou liées à la ficelle, le genre de chose qu’on roule et qu’on fourre dans le sac de pêche."
description.en = "Bamboo slats lashed with cord, the sort of thing you roll up and stuff in the tackle bag."
name.value = "Lattes de bambou"
name.en = "Bamboo Slats"

[boardgood."tackleboard.trackerframe.bobber"]
description.value = "Rouge sur blanc comme un bon flotteur, avec l’un d’eux qui flotte dans le coin, ligne comprise."
description.en = "Red over white like a good bobber, with one floating at the corner, line and all."
name.value = "Flotteur"
name.en = "Bobber"

[boardgood."tackleboard.trackerframe.corkboard"]
description.value = "Une plaque de liège criblée de trous d’épingles, souvenirs de tâches finies depuis longtemps. Il reste toujours de la place pour une de plus."
description.en = "A slab of cork, pocked with pinholes from jobs long finished. There is always room for one more."
name.value = "Panneau de liège"
name.en = "Corkboard"

[boardgood."tackleboard.trackerframe.driftwood"]
description.value = "Une planche gris-mer, polie par la marée et clouée près du quai. Elle a voyagé plus loin que la plupart des bateaux."
description.en = "A sea-grey plank, worn smooth by the tide and nailed up by the dock. It has travelled further than most boats."
name.value = "Planche usée par la marée"
name.en = "Tideworn Plank"

[boardgood."tackleboard.trackerframe.embers"]
description.value = "Du bois flotté calciné, le feu encore vivant dans ses fissures. Une année de feux est passée par celui-ci."
description.en = "Charred driftwood with the fire still living in its cracks. A year of fires went into this one."
name.value = "Braises vives"
name.en = "Live Embers"

[boardgood."tackleboard.trackerframe.net"]
description.value = "Un carré de vieux filet tendu sur les lignes, ses flotteurs de liège encore attachés en haut."
description.en = "A square of old net hung over the lines, its cork floats still tied along the top."
name.value = "Filet de pêche"
name.en = "Fishing Net"

[boardgood."tackleboard.trackerframe.none"]
description.value = "La liste seule, sans rien d’épinglé derrière. Elle ne gondole jamais à l’humidité."
description.en = "The list on its own, with nothing pinned behind it. It never warps in the damp."
name.value = "Sans cadre"
name.en = "No Frame"

[boardgood."tackleboard.trackerframe.tin"]
description.value = "Une boîte de pêche en émail vert, cabossée et écaillée, au couvercle en relief et à la charnière un peu rouillée."
description.en = "A green enamel tackle tin, dented and chipped, its lid embossed and its hinge a little rusty."
name.value = "Boîte à pêche"
name.en = "Tackle Tin"

