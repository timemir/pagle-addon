name.value = "Livre de bord"
name.en = "Logbook"

[statsgood."stats.trackerframe.none"]
description.value = "Les chiffres seuls, sans bordure. Rien à polir, et rien à mouiller."
description.en = "The figures on their own, with no border. Nothing to polish, and nothing to get wet."
name.value = "Sans cadre"
name.en = "No Frame"

[statsgood."stats.trackerframe.tidegauge"]
description.value = "Du verre bleu mer derrière une échelle de marée en laiton, graduée pour que les chiffres montent et descendent comme l’eau."
description.en = "Sea-blue glass behind a brass tide staff, marked off so the numbers rise and fall like water."
