[event.eastern_plaguelands_night]
name.value = "Mitternacht im toten Osten"
name.en = "Midnight in the Dead East"
note.value = "Niemand angelt nach Einbruch der Dunkelheit im toten Osten, wenn es sich vermeiden lässt. Die Lachse verlassen sich inzwischen darauf."
note.en = "Nobody fishes the dead east after dark if they can help it. The salmon have come to count on that."

[hunt.eastern_plaguelands_night_haul]
