name.value = "Lachs im Sand"
name.en = "Salmon in the Sand"
note.value = "Weißschuppen so weit im Süden überraschen alle, die Lachse eingeschlossen. Fang sie, solange das Licht reicht."
note.en = "Whitescale this far south is a surprise to everyone, the salmon included. Take them while the light lasts."

