[event.burning_steppes_salmon]
name.value = "Lachs unter Asche"
name.en = "Salmon under Ash"
note.value = "Schwarze Hügel, Asche auf dem Wasser und Lachs darunter. Nimm einen Hut mit breiter Krempe mit."
note.en = "Black hills, ash on the water and salmon under it. Bring a hat with a wide brim."

[hunt.burning_steppes_salmon_haul]
name.value = "Ein Korb voll Asche"
