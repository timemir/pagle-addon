name.en = "Albacore Further Out"

[hunt.darkshore_moonlight_grouper]
name.value = "Mond über dem Wasser"
name.en = "Moon over the Water"

[event.deadwind_pass_night]
name.value = "Kalter Pass, lange Nacht"
name.en = "Cold Pass, Long Night"
note.value = "Ein kalter Pass, auf dem nichts wächst, und ein alter Turm, der über die Straße wacht. Die Lachse beachten ihn nicht."
note.en = "A cold pass where nothing grows, and an old tower keeping watch over the road. The salmon pay it no attention."

[hunt.deadwind_pass_night_haul]
name.value = "Irgendwas beißt noch"
name.en = "Something Still Bites"

[hunt.deadwind_pass_night_salmon]
name.value = "Weißschuppen im Pass"
name.en = "Whitescale in the Pass"

[hunt.deadwind_pass_night_tower]
name.value = "Unter dem alten Turm"
name.en = "Under the Old Tower"

[event.duskwood_witching]
name.value = "Geisterstunde"
name.en = "Witching Hour"
note.value = "Träge schwarze Flüsse durch Wälder, in denen es nie ganz hell wird. Nach Mitternacht beißen die Fische, und alles andere auch."
note.en = "Slow black rivers through woods where it never quite gets light. After midnight the fish bite, and so does everything else."

[hunt.duskwood_witching_haul]
name.value = "Korb im Laternenlicht"
name.en = "Lantern-Light Basket"

[hunt.duskwood_witching_catfish]
name.value = "Barteln im Dunkeln"
name.en = "Whiskers in the Dark"

[hunt.duskwood_witching_snapper]
name.value = "Schnapper im Schwarzwasser"
name.en = "Black-Water Snappers"

[hunt.duskwood_witching_midnight]
name.value = "Nach dem zwölften Glockenschlag"
name.en = "After the Twelfth Bell"

[event.dustwallow_marsh_night]
name.value = "Spät im Marschland"
name.en = "Late on the Marsh"
note.value = "Eine warme, nasse Küste, die die ganze Nacht summt. Forellen in den Bächen, Gelbschwänze vor dem Ufer, und irgendwas beißt dich immer in den Nacken."
note.en = "A warm, wet coast that hums all night. Trout in the creeks, yellowtail off the shore, and something always biting your neck."

[hunt.dustwallow_marsh_night_haul]
name.value = "Eimer voll Moorwasser"
