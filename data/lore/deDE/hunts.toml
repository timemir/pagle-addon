name.value = "Forelle im Morgengrauen"
name.en = "Dawn Trout"
note.value = "Kalte Seen hoch zwischen den Gipfeln. Die Wette lautet: Forelle vor dem Frühstück, und der Frost auf der Schnur gibt es gratis dazu."
note.en = "Cold lakes high among the peaks. The wager is trout before breakfast, and the frost on the line comes free."

