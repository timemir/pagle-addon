# Hunts's lore in German (deDE), over data/lore/hunts.toml, data/hunts/hunts.toml and data/hunts/events/ (DATA-R113, DATA-R114).
# Machine-drafted: written by an AI model (Claude) for 1.1.1 and not yet reviewed by a native German speaker.

[huntgood."hunts.trackerframe.none"]
name.value = "Ohne Rahmen"
name.en = "No Frame"
description.value = "Nur die Zeilen selbst, ohne etwas darum herum."
description.en = "Only the lines themselves, with nothing drawn around them."

[huntgood."hunts.trackerframe.inkwash"]
name.value = "Lavierte Tusche"
name.en = "Ink Wash"
description.value = "Ein Blatt in blauer Tinte, die Lavierung ein wenig verlaufen, wie eine Seite, die Gischt abbekommen hat."
description.en = "A sheet of paper written in blue ink, the wash run a little, like a page that caught the spray."

[huntgood."hunts.trackerframe.waxseal"]
name.value = "Wachssiegel"
name.en = "Wax Seal"
description.value = "Pergament mit roter Randlinie und einem Wachssiegel in der Ecke, als wäre die Liste amtlich."
description.en = "Parchment with a red rule down its margin and a wax seal pressed in the corner, as if the list were official."

[huntgood."hunts.soundset.nightwatch"]
name.value = "Nachtwache"
name.en = "Night Watch"
description.value = "Eine tiefe Glocke für die Nachtwache, eine summende Laterne und eine Eule, die jeden deiner Fänge gesehen hat."
description.en = "A low bell for the night watch, a lantern humming and an owl who has seen every catch you ever made."

[huntgood."hunts.binding.pathfinder"]
name.value = "Kalbsleder des Pfadfinders"
name.en = "Pathfinder's Calf"
description.value = "Weiches Kalbsleder mit eingeprägter Windrose. Für alle, die eine ganze Reihe von Jagden bis zum Ende gebracht haben."
description.en = "Soft calfskin pressed with a compass rose. Handed to anglers who saw a whole set of hunts through to the end."

[huntgood."hunts.binding.fiveseal"]
name.value = "Siegel der fünf Reihen"
name.en = "Five-Set Seal"
description.value = "Schwarzes Leder mit eingedrückten Wachssiegeln, eines für jede Reihe von Jagden. Dieses fälscht niemand."
description.en = "Black leather with wax seals pressed into it, one for every set of hunts there is. Nobody fakes this one."

[huntgood."hunts.binding.wagersilk"]
name.value = "Brokat der Sieger"
name.en = "Winner's Brocade"
description.value = "Purpurner Seidenbrokat, gewebt mit Münzen und Fischen, eine rote Schärpe darüber. Für alle, die die Wetten des Hauses immer wieder gewinnen."
description.en = "Purple silk brocade woven with coins and fish, a red sash across it. Given to anglers who keep winning the house’s bets."

[huntgood."hunts.trackerframe.slate"]
name.value = "Kreidetafel"
name.en = "Chalk Slate"
description.value = "Eine Schiefertafel im seilgebundenen Rahmen, jeden Morgen frisch beschrieben und bis Mittag verwischt."
description.en = "A slate in a rope-bound frame, chalked fresh each morning and smudged by noon."

[huntgood."hunts.trackerframe.mapscrap"]
name.value = "Kartenfetzen"
name.en = "Map Scrap"
description.value = "Eine abgerissene Ecke einer Jagdkarte: ein gepunkteter Pfad, ein Kompass und irgendwessen Kaffeerand."
description.en = "A corner torn off a hunting map: a dotted trail, a compass, and somebody’s coffee ring."

[huntgood."hunts.trackerframe.bounty"]
name.value = "Steckbrief"
name.en = "Bounty Poster"
description.value = "Am Hafenhaus angenagelt, die Ränder eingerollt. Auf den Fisch darauf ist ein Preis ausgesetzt, und er steigt."
description.en = "Nailed up at the dock house, edges curling. The fish on it has a price, and the price is going up."

[huntgood."hunts.trackerframe.spyglass"]
name.value = "Fernrohrrand"
name.en = "Spyglass Rim"
description.value = "Marineblaues Email zwischen zwei Messingleisten, das Okular in der Ecke auf die nächste Jagd gerichtet."
description.en = "Navy enamel between two brass rails, the eyepiece at the corner turned toward the next hunt."

[huntgood."hunts.trackerframe.wagerribbon"]
name.value = "Band der Sieger"
name.en = "Winner's Ribbon"
description.value = "Ein purpurnes Seidenband mit goldenen Fransen, für alle, die das Haus immer wieder bei seinen eigenen Wetten schlagen."
description.en = "A purple silk ribbon with a gold fringe, for anglers who keep beating the house at its own wagers."

[huntgood."hunts.toaststyle.nightfin"]
name.value = "Nachtflossenflut"
name.en = "Nightfin Tide"
description.value = "Draußen hinter der Landzunge, wo das Licht endet, ziehen die Nachtflossen unter dem Vollmond. Halte lange genug still, und einer springt mitten hindurch."
description.en = "Out past the headland, where the light ends, the nightfin run under a full moon. Hold still long enough and one jumps clean across it."

[huntgood."hunts.toaststyle.trench"]
name.value = "Der tiefe Graben"
name.en = "The Deep Trench"
description.value = "Unter der Tiefe, wo das Sonnenlicht aufgibt, und unter der, wo die Laternen der Anglerfische aufgeben. Hier unten lebt etwas sehr Großes, und es hat die Schnur bemerkt."
description.en = "Below where the sunlight gives up, and below where the anglerfish lanterns give up. Something very large lives down here, and it has noticed the line."

[huntgood."hunts.toaststyle.study"]
name.value = "Nats Arbeitszimmer"
name.en = "Nat's Study"
description.value = "Ein Tagebuch offen auf dem Schreibtisch, die Lampe brennt, das Tintenfass offen, seine besten Fliegen hängen in der warmen Luft über der Seite. Niemand hat ihn je dabei ertappt. Leer hat den Tisch aber auch noch niemand gesehen."
description.en = "A journal open on a desk, the lamp still lit and the ink uncapped, his best flies hanging in the warm air over the page. Nobody has ever caught him at it. Nobody has ever seen the desk empty, either."

