name.en = "Trout in the Blight"

[hunt.western_plaguelands_lake_afternoon]
name.value = "Langer Nachmittag"
name.en = "Long Afternoon"

[event.winterspring_daylight]
name.value = "Kurze Tage im Schnee"
name.en = "Short Days in the Snow"
note.value = "Oben im Schnee sind die Tage kurz und die Seen kalt. Verbring das Licht am Wasser und die Dunkelheit am Feuer."
note.en = "Up in the snow the days are short and the lakes are cold. Spend the light on the water, and the dark by a fire."

[hunt.winterspring_daylight_haul]
name.value = "Ein Korb voll Frost"
name.en = "A Frostbitten Basket"

[hunt.winterspring_daylight_redgill]
name.value = "Rotkiemen im Schnee"
name.en = "Redgill in the Snow"

[hunt.winterspring_daylight_morning]
name.value = "Sonne auf dem Schnee"
name.en = "Sun on the Snow"

[event.winterspring_salmon]
name.value = "Eingeschneiter Lachs"
name.en = "Snowbound Salmon"
note.value = "Kaltes Wasser, weiße Lachse und Abende, die früh hereinbrechen. Achte auf dem Heimweg auf das Eis."
note.en = "Cold water, white salmon and the evenings drawing in early. Mind the ice on the way home."

