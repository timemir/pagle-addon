[event.barrens_oddities]
name.value = "Seltsames in der Dämmerung"
name.en = "Oddity at Dusk"
note.value = "Die Tümpel der trockenen Ebenen bringen seltsame Fische hervor. Sieh sie dir bei Sonnenuntergang an, und überleg zweimal, bevor du einen kochst."
note.en = "The pools of the dry plains turn out some strange fish. Look them over at sundown, and think twice before cooking any."

[hunt.barrens_oddities_haul]
name.value = "Ausbeute der Oase"
