[hunt.home_waters]
name.value = "Heimische Gewässer"
name.en = "Home Waters"
note.value = "Jeder Fisch zählt. Irgendwo fängt jeder an, und hier ist es feucht."
note.en = "Any fish will do. Everyone starts somewhere, and it's damp."

[hunt.bloated_luck]
name.value = "Aufgeblähtes Glück"
name.en = "Bloated Luck"
note.value = "Schwer für ihre Größe, und drinnen klappert etwas."
note.en = "Heavy for their size, and something rattles inside."

[hunt.mackerel_run]
name.value = "Makrelenzug"
name.en = "Mackerel Run"
note.value = "Glitschig, reichlich und an jeder Küste zu finden, die den Namen verdient."
