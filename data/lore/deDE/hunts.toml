name.en = "Embers and Redgill"

[hunt.burning_steppes_salmon_noon]
name.value = "Die heißesten Stunden"
name.en = "The Hottest Hours"

[event.darkshore_moonlight]
name.value = "Zackenbarsch im Mondschein"
name.en = "Grouper by Moonlight"
note.value = "Eine lange graue Küste unter alten, dunklen Bäumen. Die Wette lautet: Zackenbarsch, sobald der Mond steht, und die Nächte dort sind lang."
note.en = "A long grey coast under old, dark trees. The wager is grouper once the moon is up, and the nights there are long."

[hunt.darkshore_moonlight_haul]
name.value = "Ein mondheller Setzkescher"
name.en = "A Moonlit Keepnet"

[hunt.darkshore_moonlight_snapper]
name.value = "Schnapper unter den Bäumen"
name.en = "Snappers under the Trees"

[hunt.darkshore_moonlight_albacore]
