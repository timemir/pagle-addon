[boardgood."tackleboard.trackerframe.none"]
name.value = "Ohne Rahmen"
name.en = "No Frame"
description.value = "Nur die Liste, ohne etwas dahinter. Sie verzieht sich nie in der Feuchte."
description.en = "The list on its own, with nothing pinned behind it. It never warps in the damp."

[boardgood."tackleboard.trackerframe.corkboard"]
name.value = "Korkbrett"
name.en = "Corkboard"
description.value = "Eine Korkplatte voller Nadellöcher von längst erledigten Aufträgen. Für einen weiteren ist immer Platz."
description.en = "A slab of cork, pocked with pinholes from jobs long finished. There is always room for one more."

[boardgood."tackleboard.trackerframe.driftwood"]
name.value = "Gezeitenbrett"
name.en = "Tideworn Plank"
description.value = "Eine meergraue Planke, von der Flut glatt geschliffen und am Anleger angenagelt. Sie ist weiter gereist als die meisten Boote."
description.en = "A sea-grey plank, worn smooth by the tide and nailed up by the dock. It has travelled further than most boats."

[boardgood."tackleboard.toaststyle.ember"]
name.value = "Herdglut"
name.en = "Hearth Ember"
description.value = "Eine Seite, die einmal fast im Feuer gelandet wäre. Die Ränder glühen noch, wenn ein guter Fisch anbeißt."
description.en = "A page that was nearly kindling once. The edges still glow when a good fish comes in."

[boardgood."tackleboard.trackerframe.net"]
name.value = "Fischernetz"
name.en = "Fishing Net"
description.value = "Ein Stück altes Netz über den Zeilen, oben noch mit seinen Korkschwimmern."
description.en = "A square of old net hung over the lines, its cork floats still tied along the top."

[boardgood."tackleboard.trackerframe.bamboo"]
name.value = "Bambuslatten"
name.en = "Bamboo Slats"
description.value = "Mit Schnur verzurrte Bambuslatten, so etwas, das man aufrollt und in die Angeltasche stopft."
description.en = "Bamboo slats lashed with cord, the sort of thing you roll up and stuff in the tackle bag."

[boardgood."tackleboard.trackerframe.tin"]
name.value = "Köderdose"
name.en = "Tackle Tin"
description.value = "Eine grüne Emaille-Köderdose, verbeult und angeschlagen, mit geprägtem Deckel und leicht rostigem Scharnier."
description.en = "A green enamel tackle tin, dented and chipped, its lid embossed and its hinge a little rusty."

[boardgood."tackleboard.trackerframe.bobber"]
name.value = "Schwimmer"
name.en = "Bobber"
description.value = "Rot über Weiß wie ein guter Schwimmer, und in der Ecke treibt einer, samt Schnur."
description.en = "Red over white like a good bobber, with one floating at the corner, line and all."

[boardgood."tackleboard.trackerframe.embers"]
name.value = "Lebende Glut"
name.en = "Live Embers"
description.value = "Verkohltes Treibholz, in dessen Rissen das Feuer noch lebt. Ein ganzes Jahr voller Feuer steckt darin."
description.en = "Charred driftwood with the fire still living in its cracks. A year of fires went into this one."
