# Ledger's lore in German (deDE), over data/lore/ledger.toml (DATA-R113, DATA-R114).
# Machine-drafted: written by an AI model (Claude) for 1.1.1 and not yet reviewed by a native German speaker.

[species.1467]
blurb.value = "Ein fröhlicher kleiner Fisch, der nicht ahnt, wie viele Köche schon auf ihn warten."
blurb.en = "A cheerful little fish with no idea how many cooks are waiting for it."
riddle.value = "Ein ruhiger Hügelsee im friedlichen Bauernland."
riddle.en = "A calm hill lake in settled farming country."

[species.4603]
blurb.value = "Schnell, glänzend und sehr zufrieden mit sich selbst."
blurb.en = "Fast, bright, and very pleased with itself."
riddle.value = "Salzige Küsten im Norden und Süden, auf beiden Seiten des Meeres."
riddle.en = "Salt coasts north and south, on both sides of the sea."

[species.6289]
blurb.value = "Beißt in alles, einmal sogar in einen Gnomenstiefel."
blurb.en = "It bites anything, including, once, a gnome's boot."
riddle.value = "Träge Flüsse in den Landen, wo Helden ihren Anfang nehmen."
riddle.en = "Lazy rivers in the lands where heroes begin."

[species.6291]
blurb.value = "Klein, hell und überall. Jedes Anglertagebuch beginnt hier, und niemand gibt zu, wie viele zurück ins Wasser flogen."
blurb.en = "Small, bright and everywhere. Every angler's book starts here, and nobody admits how many they threw back."
riddle.value = "Das Allererste, was an der Schnur eines Anfängers zupft, in den sanftesten Gewässern überhaupt."
riddle.en = "The very first thing to tug a beginner's line, in the gentlest waters of all."

[species.6299]
blurb.value = "Sieht übel aus, riecht noch übler und ergibt gekocht etwas, das ein Raptor fressen würde."
blurb.en = "Looks bad, smells worse, cooks into something a raptor would eat."
riddle.value = "Müdes, graues Wasser im düsteren Norden, auf beiden Seiten des Meeres."
riddle.en = "Tired, grey water in the gloomy north, on both sides of the sea."

[species.6303]
blurb.value = "Glitschig genug, um den Namen zu verdienen. Gebraten besser, als er eigentlich dürfte."
blurb.en = "Slippery enough to earn the name. Fries up better than it has any right to."
riddle.value = "Flache Küsten, durch die neue Abenteurer waten."
riddle.en = "Shallow coasts, where new adventurers wade."

[species.6308]
blurb.value = "Nur Barteln und Groll. Schmollt am Grund, bis er beschließt zu kämpfen."
blurb.en = "All whiskers and grudge. It sulks on the bottom until it decides to fight."
riddle.value = "Trübe Flüsse auf beiden Seiten des Meeres."
riddle.en = "Murky rivers on both sides of the sea."

[species.6317]
blurb.value = "Von Zwergen benannt, die alles danach benennen, wie es sich benimmt, wenn man es festhalten will."
blurb.en = "Named by dwarves, who name everything after how it behaves when you try to hold it."
riddle.value = "Kaltes Wasser im Hochland, mitten im Zwergenland."
riddle.en = "Cold highland lake water, in dwarf country."

[species.6358]
blurb.value = "Alchemisten wollen das Öl. Köche wollen nichts damit zu tun haben."
blurb.en = "Alchemists want the oil. Cooks want nothing to do with it."
riddle.value = "Ein Schwarm, der einen schillernden Film auf dem Küstenwasser hinterlässt."
riddle.en = "A school that leaves a slick on coastal waters."

[species.6359]
blurb.value = "Warm in der Hand, sogar außerhalb des Wassers."
blurb.en = "Warm to the touch, even out of the water."
riddle.value = "Wirbelnde Schwärme in der Farbe von Glut, vor Küsten im Norden und Süden."
riddle.en = "Swirling schools the colour of embers, off coasts north and south."

[species.6361]
blurb.value = "Die Farben verblassen binnen einer Stunde an Land. Schnell hinsehen."
blurb.en = "The colours fade within an hour of landing. Look quickly."
riddle.value = "Offene Küste, ein Stück weiter draußen, als du es gewohnt bist."
riddle.en = "Open coast, a little further from shore than you're used to."

[species.6362]
blurb.value = "Stur an der Schnur, süß auf dem Teller."
blurb.en = "Stubborn on the line, sweet on the plate."
riddle.value = "Meeresküsten vom nebligen Norden bis in den heißen Süden, wo der Grund steil abfällt."
riddle.en = "Sea coasts from the misty north to the hot south, where the bottom drops away."

[species.6458]
blurb.value = "Weniger ein Fisch als eine Warnung vor dem Wasser. Zweimal waschen, dann noch einmal überlegen."
blurb.en = "Less a fish than a warning about the water. Wash it twice, then think again."
riddle.value = "Verdorbenes Wasser, wo Goblins die ausgedörrten Hügel und Ebenen anbohren."
riddle.en = "Fouled water where goblins drill the parched hills and plains."

[species.6522]
blurb.value = "Verzehr auf eigene Gefahr. Keine zwei Angler, die es taten, erzählen dieselbe Geschichte über die Stunde danach."
blurb.en = "Eat one at your own risk. No two anglers who did tell the same story about the hour after."
riddle.value = "Seltsame Schwärme draußen in den trockenen Ebenen, wo selbst das Wasser krank wirkt."
riddle.en = "Strange schools out on the dry plains, where the water itself seems unwell."

[species.8365]
blurb.value = "Der Kopf glänzt wirklich. Nein, das ist kein Mithril. Hör auf, den Schmied zu fragen."
blurb.en = "The head really does shine. No, it isn't mithril. Stop asking the smith."
riddle.value = "Seen und Flüsse in rauerem Land, vom tiefen Wald bis zur kahlen Wüste."
riddle.en = "Lakes and rivers in rougher country, from deep forest to bare desert."

[species.12238]
blurb.value = "Breit, träge und grau wie die Küste, nach der er benannt ist. Gibt einen besseren Eintopf ab als einen ersten Eindruck."
blurb.en = "Broad, slow and grey as the coast it's named for. It makes a better stew than a first impression."
riddle.value = "Graues Wasser unter alten Bäumen an einem mondhellen Ufer, oder weit im Süden in der Wüste."
riddle.en = "Grey water under old trees on a moonlit coast, or far south in the desert."

[species.13422]
blurb.value = "Rüstungsschmiede zahlen gut für die Schuppen. Der Aal ist mit dieser Regelung nicht einverstanden."
blurb.en = "Armourers pay well for the scales. The eel disagrees with the arrangement."
riddle.value = "Ein sich windender Schwarm in tiefem Meerwasser vor den wilderen Küsten."
riddle.en = "A writhing swarm in deep sea water off the wilder coasts."

[species.13754]
blurb.value = "So schwer, dass manche Angler ihn im Sitzen fangen."
blurb.en = "Heavy enough that some anglers fish it sitting down."
riddle.value = "Offene See vor den fernen Küsten, tief genug für die Schweren."
riddle.en = "Open sea off the far coasts, deep enough for the heavy ones."

[species.13755]
blurb.value = "Kommt mit dem Frost. Mehr Arme, als ein Angler vernünftigerweise entwirren kann."
blurb.en = "Arrives with the frost. More arms than an angler can reasonably untangle."
riddle.value = "Warme Ufer, sobald das Jahr kalt wird."
riddle.en = "Warm shores, once the year turns cold."

[species.13756]
blurb.value = "Taucht mit den langen Tagen auf und verschwindet mit dem ersten kalten Wind."
blurb.en = "Turns up with the long days and leaves with the first cold wind."
riddle.value = "Warme Ufer in der warmen Hälfte des Jahres."
riddle.en = "Warm shores in the warm half of the year."

[species.13757]
blurb.value = "Kribbelt. Nicht ablecken."
blurb.en = "Tingles. Don't lick it."
riddle.value = "Ein Knistern in fernen, wilden Gewässern, vom Morgengrauen bis in den späten Abend."
riddle.en = "A crackle in far, wild waters, from sunrise into the late evening."

[species.13758]
blurb.value = "Kiemen wie Glut. Beißt, als meine er es ernst."
blurb.en = "Gills like embers. Bites like it means it."
riddle.value = "Binnengewässer der wilderen Lande, bei Tag oder bei Nacht."
riddle.en = "Inland waters of the wilder lands, by day or by night."

[species.13759]
blurb.value = "Frisst im Sternenlicht. Wer ihn will, lernt die Dunkelheit zu mögen."
blurb.en = "Feeds by starlight. Anglers who want it learn to like the dark."
riddle.value = "Wilde Gewässer fern der sanften Ufer, nachdem die Sonne untergegangen ist."
riddle.en = "Wild waters far from the gentle shores, after the sun goes down."

[species.13760]
blurb.value = "Steigt mit der Sonne auf und bleibt lange wach. Niemand weiß, wo er vor der Dämmerung steckt."
blurb.en = "Rises with the sun and keeps late hours. Nobody knows where it goes before dawn."
riddle.value = "Ferne Flüsse und Seen, warm oder kalt, solange es Tag ist."
riddle.en = "Far rivers and lakes, warm or cold, while the sun is up."

[species.13888]
blurb.value = "Kneift zuerst und stellt nie Fragen."
blurb.en = "Pinches first, asks questions never."
riddle.value = "Tiefe, felsige Gewässer an den fernsten Rändern der Welt."
riddle.en = "Deep rocky waters at the far edges of the world."

[species.13889]
blurb.value = "Bleich wie Raureif. Am besten am Fangtag gegessen, was selten gelingt."
blurb.en = "Pale as frost. Best eaten the day it's caught, which is rarely possible."
riddle.value = "Die fernsten Gewässer überhaupt, von gefrorenen Seen bis zu versengten Hügeln."
riddle.en = "The farthest waters there are, from frozen lakes to scorched hills."

[species.13890]
blurb.value = "Trägt seine Panzerung außen und sein Temperament innen. Nimm ein schwereres Messer mit."
blurb.en = "Wears its armour on the outside and its temper on the inside. Bring a heavier knife."
riddle.value = "Etwas Schweres in den fernsten Gewässern, nachdem die Sonne untergegangen ist."
riddle.en = "Something heavy in the farthest waters, after the sun goes down."

[species.13893]
blurb.value = "Der große Vetter. Du brauchst beide Hände und vermutlich einen Freund."
blurb.en = "The big cousin. You will need both hands and probably a friend."
riddle.value = "Tiefes Wasser vor einer fernen, vergessenen Küste."
riddle.en = "Deep water off a far and forgotten coast."

[species.16967]
blurb.value = "Groß, schnell und gut zu essen. Die meisten werden jemand anderem zuliebe gefangen, was wie Verschwendung wirkt."
blurb.en = "Big, quick and good eating. Most are caught as a favour for someone else, which seems a waste."
riddle.value = "Ein breiter Fluss durch nassen, überwucherten Wald im fernen Westen."
riddle.en = "A broad river through wet, overgrown forest in the far west."

[species.16968]
blurb.value = "Schnappt nach dem Köder, als hätte er den ganzen Tag auf einen Streit gewartet."
blurb.en = "Hits the bait like it's been waiting all day for an argument."
riddle.value = "Ein trostloses, graues Ufer an einer trockenen, leeren Westküste."
riddle.en = "A bleak, grey shore on a dry and empty western coast."

[species.16969]
blurb.value = "Das Segel ist nur zur Schau, und er weiß es. Kämpft, als hätte er Publikum."
blurb.en = "That sail is for show, and it knows it. Fights like it has an audience."
riddle.value = "Warme Dschungeluntiefen, wo das Meer bis an die Bäume reicht."
riddle.en = "Warm jungle shallows, where the sea runs right up to the trees."

[species.16970]
blurb.value = "Bunt wie ein Dschungelvogel und an der Schnur doppelt so viel Ärger."
blurb.en = "Bright as a jungle bird and twice as much trouble on the line."
riddle.value = "Warme, trübe Untiefen, wo ein Sumpf auf das Meer trifft."
riddle.en = "Warm, murky shallows where a swamp meets the sea."

[species.19807]
blurb.value = "Turnierfisch. Schmeckt nach Sieg, oder zumindest nach einem langen Nachmittag voller Versuche."
blurb.en = "Tournament fish. Tastes of victory, or at least of a long afternoon trying."
riddle.value = "Nur solange der große Wettstreit im Dschungel läuft."
riddle.en = "Only while the jungle's great contest is on."

[species.19975]
blurb.value = "Riecht genau so, wie der Name verspricht. Irgendwer, irgendwo will trotzdem ein Dutzend."
blurb.en = "Smells exactly as the name promises. Somebody, somewhere, still wants a dozen."
riddle.value = "Aufgewühltes braunes Wasser, tief im dampfenden Dschungel."
riddle.en = "Churning brown water, deep in the steaming jungle."

[species.21071]
blurb.value = "Riecht nach den Hügeln, an denen er vorbeischwimmt."
blurb.en = "Smells like the hills it swims past."
riddle.value = "Kleine Schwärme in Hügeln und Wäldern, mit einem Hauch von Kräutern."
riddle.en = "Small schools in the hills and forests, smelling faintly of herbs."

[species.21153]
blurb.value = "Der Salbei ist erwachsen geworden."
blurb.en = "The sage grew up."
riddle.value = "Stattlichere Schwärme mit Kräuterduft, in verschneiten Hügeln und dampfendem Dschungel."
riddle.en = "Bigger herb-scented schools, in snowy hills and steaming jungle."

[species.251524]
blurb.value = "Neu in diesen Gewässern, und niemand weiß so recht, wie er hierherkam."
blurb.en = "New to these waters, and nobody's quite sure how it got here."
riddle.value = "Leuchtende neue Schwärme auf einem stillen See in den östlichen Hügeln."
riddle.en = "Bright new schools on a quiet lake in the eastern hills."

[legend.19803]
blurb.value = "Die meisten Angler sehen nur seine Bugwelle. Dieser hier hat lange genug gebremst, um an Land gezogen zu werden."
blurb.en = "Most anglers only ever see its wake. This one slowed down long enough to be landed."
title.value = "Schrecken der Renner"
title.en = "Racer-Chaser"

[legend.19805]
blurb.value = "Viel zu schön für einen Wettbewerbstisch, und er scheint es zu wissen."
blurb.en = "Far too handsome for a contest table, and it seems to know it."
title.value = "Keefers Konkurrenz"
title.en = "Keefer's Rival"

[legend.19806]
blurb.value = "Gibt sich königlich und kämpft, als hätte er eine Krone zu verlieren."
blurb.en = "Carries itself like royalty, and fights as if it had a crown to lose."
title.value = "Schrecken der Königinnen"
title.en = "Queen-Catcher"

[sub.6297]
plaque.value = "Eine Spende des Wassers. Besitzer unbekannt, und das bleibt besser so."
plaque.en = "Donated by the water. Owner unknown, and preferably staying that way."

[sub.6301]
plaque.value = "Gehörte jemandem, der Wagen fuhr. Sieht immer noch aus, als warte er auf einen."
plaque.en = "Belonged to someone who drove wagons. Still looks like it's waiting for one."

[sub.6307]
plaque.value = "Die Tinte ist längst verlaufen. Der Korken hat, das muss man ihm lassen, gehalten."
plaque.en = "The ink ran long ago. The cork, to its credit, held."

[sub.6351]
plaque.value = "Einmal fallen gelassen, wie es aussieht, und dann sicherheitshalber noch einmal."
plaque.en = "Dropped once, by the look of it, and then again for good measure."

[sub.6352]
plaque.value = "Für eine trockene Reise verpackt. Daraus wurde nichts."
plaque.en = "Packed for a dry voyage. It did not get one."

[sub.6353]
plaque.value = "Klein genug, um über Bord zu gehen. Jemand hat es bewiesen."
plaque.en = "Small enough to lose over the side. Someone proved it."

[sub.6354]
plaque.value = "Klein, verschlossen und mühsamer zu öffnen, als sie je zu tragen war."
plaque.en = "Small, locked, and more trouble to open than it ever was to carry."

[sub.6355]
plaque.value = "Gebaut, um alles zu überstehen. Das Meer prüft diese Behauptung noch."
plaque.en = "Built to survive anything. The sea has been testing the claim."

[sub.6356]
plaque.value = "Jemand hat sie verschlossen, jemand hat sie versenkt, und keiner kam je zurück."
plaque.en = "Someone locked it, someone sank it, and neither came back for it."

[sub.6357]
plaque.value = "Dicht versiegelt gegen das Wasser. Das Wasser war geduldig."
plaque.en = "Sealed tight against the water. The water was patient."

[sub.6455]
plaque.value = "Wohin der Wagen fuhr, wird noch untersucht."
plaque.en = "Where the wagon went is still under investigation."

[sub.6456]
plaque.value = "Bitte das Ausstellungsstück nicht berühren."
plaque.en = "Please do not touch the exhibit."

[sub.6457]
plaque.value = "Ein Gnom würde das »fast funktionstüchtig« nennen."
plaque.en = "A gnome would call this 'nearly working'."

[sub.6717]
plaque.value = "Ersatzteile eines Tüftlers, mitten in der Arbeit über Bord gefallen. Er besteht darauf, dass das Boot zuerst leckte."
plaque.en = "A tinker's spare parts, dropped over the side mid-job. He insists the boat leaked first."

[sub.6718]
plaque.value = "Teile für eine aufziehbare Lockente, die Sorte, die explodiert. Wird von den echten Enten ferngehalten."
plaque.en = "Parts for a clockwork duck decoy, the kind that explodes. Kept well away from the real ducks."

[sub.6643]
plaque.value = "Ein kleiner Fisch mit großem Appetit und keinem Gespür dafür, was als Futter gilt."
plaque.en = "A small fish with a large appetite and no sense of what counts as food."

[sub.6645]
plaque.value = "Hat in etwas viel zu Großes gebissen und es trotzdem geschluckt."
plaque.en = "It bit something far too big to swallow, and swallowed it anyway."

[sub.6647]
plaque.value = "Hat am Grund gefressen, wo alles landet, was irgendwer fallen lässt."
plaque.en = "Fed off the bottom, where everyone's dropped things end up."

[sub.7973]
plaque.value = "Verrät nichts über ihren Inhalt. Öffne sie trotzdem; manchmal ist es eine Perle."
plaque.en = "Says nothing about what's inside. Open it anyway; sometimes it's a pearl."

[sub.8366]
plaque.value = "Hat etwas Glänzendes gefressen. Diesmal vielleicht sogar Mithril."
plaque.en = "Ate something shiny. Possibly even mithril, this time."

[sub.13874]
plaque.value = "Zu schwer zum Schwimmen und zu schwer, um sie weit zu tragen. Jemand hat beides versucht."
plaque.en = "Too heavy to float and too heavy to carry far. Someone tried both."

[sub.13875]
plaque.value = "Mit Eisen beschlagen und obendrein verschlossen. Was auch drin ist, war die Sorge wert."
plaque.en = "Bound in iron and locked besides. Whatever's inside was worth the worry."

[sub.13881]
plaque.value = "Zu gierig, um mit dem Fressen aufzuhören, und zu satt, um davonzuschwimmen."
plaque.en = "Too greedy to stop eating, and too full to swim away."

[sub.13918]
plaque.value = "Verstärkt, verschlossen und trotzdem versenkt. Manche Fracht hat einfach kein Glück."
plaque.en = "Reinforced, locked, and sunk anyway. Some cargo never gets a break."

[sub.20708]
plaque.value = "So dicht versiegelt, dass nie Wasser hineinkam. Der Besitzer offenbar auch nicht."
plaque.en = "Sealed so tight the water never got in. Neither, it seems, did the owner."

[sub.21113]
plaque.value = "Wasserdicht, wie versprochen. Dass sie schwimmt, hat niemand versprochen."
plaque.en = "Watertight, as promised. Nobody promised it would float."

[sub.21150]
plaque.value = "Das Eisen hat gehalten. Das Schiff, von dem sie stammt, nicht."
plaque.en = "The iron held. The ship it came off did not."

[sub.21162]
plaque.value = "Aufgebläht, glitschig und voller fremdem Glück. Danach Hände waschen."
plaque.en = "Swollen, slick and full of someone else's luck. Wash your hands after."

[sub.21164]
plaque.value = "Stur bis zuletzt. Was er geschluckt hatte, gab er nur dem Messer preis."
plaque.en = "Stubborn to the last. It gave up what it swallowed only to a knife."

[sub.21228]
plaque.value = "Mit Mithril beschlagen. Wer sie packte, rechnete mit Ärger, und bekam welchen."
plaque.en = "Bound in mithril. Whoever packed it expected trouble, and got some."

[sub.21243]
plaque.value = "Groß genug, um eine Geldbörse im Ganzen zu schlucken, und das tat er auch."
plaque.en = "Big enough to swallow a purse whole, and it did."

