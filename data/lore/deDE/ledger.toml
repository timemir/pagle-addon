[line.uncaughtlegend]
text.value = "Manche Fische fängt man nur alle Jubeljahre. Diese Seite wartet auf einen."
text.en = "Some fish are only caught once in a long while. This page waits for one."

[line.uncaughtjunk]
text.value = "Der Sockel ist abgestaubt und bereit. Das Ausstellungsstück verspätet sich."
text.en = "The plinth is dusted and ready. The exhibit is late."

[line.uncaughttreasure]
text.value = "Etwas Versiegeltes, noch nicht gefunden."
text.en = "Something sealed, not yet found."

[line.unchartedwaters]
text.value = "Unverzeichnete Gewässer. Noch hat sie niemand kartiert."
text.en = "Uncharted waters. No map of these yet."

