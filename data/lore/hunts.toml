# Hunts' lore (DATA-R100, HNT-R130), emitted into addons/Pagle_Hunts/data/Lore.lua as ns.L entries (DATA-R104): the
# names and descriptions of Hunts' goods (HNT-R121), one table per [huntgood."<goodID>"] with its name and description
# (DATA-R101), every good manifest.toml lists under [hunts.huntgood] (DATA-R106), and the ladder titles under
# [hunts.ladder]. Core owns the kind good, so Hunts' goods are huntgood (DATA-R102). The Hunts' and sets' own names,
# titles and notes stay beside their definitions in data/hunts/hunts.toml (DATA-R105), and the Hunt Events' names and
# notes in data/hunts/events/ (DATA-R97); all land in the same Lore.lua. Lore is never part of the catalogue or the Hunt
# list's fingerprint, and changes no count (DATA-R109).
# The M5 batch, drafted from VOICE.md, came with Hunts' lore check (DATA-R111, #183). The comment after each table is
# the good's slot, for review only.
#
# The Curio Shop shows a good's name and description beside its preview, under its slot and Module
# (wallet-and-shop.md › UI), so a description is about the look itself, never the shop, the board or the addon. A
# tracker frame is drawn around the pinned lines on screen; an earned binding is a look every book wears, Core's to
# draw (ADR 0015).

[huntgood."hunts.trackerframe.none"] # Tracker frame, the default
name = "No Frame"
description = "Only the lines themselves, with nothing drawn around them."

[huntgood."hunts.trackerframe.inkwash"] # Tracker frame, tier 1
name = "Ink Wash"
description = "A sheet of paper written in blue ink, the wash run a little, like a page that caught the spray."

[huntgood."hunts.trackerframe.waxseal"] # Tracker frame, tier 2
name = "Wax Seal"
description = "Parchment with a red rule down its margin and a wax seal pressed in the corner, as if the list were official."

# The Curio Shop expansion's earned bindings, tracker frames and sound set (HNT-R121–R123).

[huntgood."hunts.soundset.nightwatch"] # core.soundset, earned: Finish every Hunt set
name = "Night Watch"
description = "A low bell for the night watch, a lantern humming and an owl who has seen every catch you ever made."

[huntgood."hunts.binding.pathfinder"] # core.binding, earned: Finish a Hunt set
name = "Pathfinder's Calf"
description = "Soft calfskin pressed with a compass rose. Handed to anglers who saw a whole set of hunts through to the end."

[huntgood."hunts.binding.fiveseal"] # core.binding, earned: Finish every Hunt set
name = "Five-Set Seal"
description = "Black leather with five wax seals pressed into it, one for every set of hunts there is. Nobody fakes this one."

[huntgood."hunts.binding.wagersilk"] # core.binding, earned: 10 Wager runs completed
name = "Winner's Brocade"
description = "Purple silk brocade woven with coins and fish, a red sash across it. Given to anglers who keep winning the house’s bets."

[huntgood."hunts.trackerframe.slate"] # hunts.trackerframe, tier 1
name = "Chalk Slate"
description = "A slate in a rope-bound frame, chalked fresh each morning and smudged by noon."

[huntgood."hunts.trackerframe.mapscrap"] # hunts.trackerframe, tier 1
name = "Map Scrap"
description = "A corner torn off a hunting map: a dotted trail, a compass, and somebody’s coffee ring."

[huntgood."hunts.trackerframe.bounty"] # hunts.trackerframe, tier 2
name = "Bounty Poster"
description = "Nailed up at the dock house, edges curling. The fish on it has a price, and the price is going up."

[huntgood."hunts.trackerframe.spyglass"] # hunts.trackerframe, tier 3
name = "Spyglass Rim"
description = "Navy enamel between two brass rails, the eyepiece at the corner turned toward the next hunt."

[huntgood."hunts.trackerframe.wagerribbon"] # hunts.trackerframe, earned: 10 Wager runs completed
name = "Winner's Ribbon"
description = "A purple silk ribbon with a gold fringe, for anglers who keep beating the house at its own wagers."

# The completed-run ladder (HNT-R148): a title at 25, 50 and 100 completed runs, listed in manifest.toml under
# [hunts.ladder]. 25 is the spec's own; 50 and 100 are the event pool's lore batch (#307). Each is a bare epithet the
# Angler signs with, like the set titles, and each is more of the same bet won.
[ladder."25"]
title = "Bookmaker's Bane"

[ladder."50"]
title = "Bookmaker's Ruin"

[ladder."100"]
title = "Bookmaker's Retirement"
