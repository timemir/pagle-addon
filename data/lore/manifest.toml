	"westfall_wheatwing",
	"goldshire_gnat",
	"duskwood_shadow",
	"redridge_ember",
	"barrens_dun",
	"mudsnout_woolly",
	"gnomish_whirligig",
	"tarnished_spoon",
	"ashenvale_olive",
	"kodo_hair_caddis",
	"elwynn_royal",
	"swamp_midge",
	"raptor_quill",
	"silverpine_spinner",
	"lakeshire_coachman",
	"bloodsail_streamer",
	"booty_bay_bucktail",
	"desolace_drifter",
	"grimtotem_hackle",
	"needles_ant",
	"feralas_fern",
	"tanaris_sandfly",
	"darkshore_dun",
	"nats_golden_doctor",
	"kraken_ink_streamer",
	"phoenix_hackle",
	"moonwell_silverwing",
	"thunderhead_tiger",
	"deepwater_duchess",
]

# The board's 8 titles (TKB-R61, TKB-R73, TKB-R60's Fly Box title), each with a text.
[tackleboard.boardtitle]
fields = ["text"]
ids = ["tally_25", "tally_100", "tally_500", "campfire_7", "campfire_30", "campfire_100", "campfire_365", "flybox"]

# The board's goods (TKB-R125), its three tracker frames, each with a name and a description.
[tackleboard.boardgood]
fields = ["name", "description"]
ids = ["tackleboard.trackerframe.none", "tackleboard.trackerframe.corkboard", "tackleboard.trackerframe.driftwood"]
