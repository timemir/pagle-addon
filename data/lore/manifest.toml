# The Module-defined lore kinds (DATA-R106): per lore ID, each kind with its required fields and the IDs that need
# them, e.g.
#
#   [ledger.line]
#   fields = ["text"]
#   ids = ["uncaughtlegend", { id = "<an ID>", placeholders = ["zone"] }]
#
# An ID entry may allow {zone}, the one placeholder (DATA-R108). Each kind belongs to one addon (DATA-R102); the
# catalogue-keyed kinds (species, legend, sub, family, DATA-R103) and Hunts' hunt and set (DATA-R105) are never listed.
# The Ledger's line IDs came with its first batch (#131), its title and binding IDs with the M4 batch (#161,
# LED-R162), Core's good IDs with Core's lore check (#161), Hunts' good IDs with Hunts' lore check (#183), Stats' good
# IDs with Stats' lore check (#210), the Tackle Board's pattern, title and good IDs with its lore check (#237), and
# the Curio Shop expansion's goods, the Ledger's ledgergood IDs among them, with the shop expansion kit.

# The Ledger's shared lines (LED-R160), each shown in place of something not yet caught or charted: an uncaught
# Legend's page (LED-R147), an empty Junk Museum plinth and an unopened Treasures row (LED-R144), and a zone with no
# data (LED-R138).
[ledger.line]
fields = ["text"]
ids = ["uncaughtlegend", "uncaughtjunk", "uncaughttreasure", "unchartedwaters"]

# The Ledger's titles (LED-R75), each a text the Angler signs with (LED-R77); only zonemaster's allows {zone}, filled
# with the zone's name at runtime (DATA-R108, LED-R161). From M4, with the title and binding batch (LED-R162).
[ledger.title]
fields = ["text"]
ids = [
	"level1",
	"level10",
	"level20",
	"level30",
	"level40",
	"level50",
	"level60",
	"prestige1",
	"prestige5",
	"prestige10",
	{ id = "zonemaster", placeholders = ["zone"] },
	"complete.ledger",
	"complete.junk",
	"complete.treasure",
	"complete.trophy",
]

