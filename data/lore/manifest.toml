# The Module-defined lore kinds (DATA-R106): per lore ID, each kind with its required fields and the IDs that need
# them, e.g.
#
#   [ledger.line]
#   fields = ["text"]
#   ids = ["uncaughtlegend", { id = "<an ID>", placeholders = ["zone"] }]
#
# An ID entry may allow {zone}, the one placeholder (DATA-R108). Each kind belongs to one addon (DATA-R102); the
# catalogue-keyed kinds (species, legend, sub, family, DATA-R103) and Hunts' hunt and set (DATA-R105) are never listed.
# The Ledger's line IDs came with its first batch (#131); its title and binding IDs come in M4 (LED-R162).

# The Ledger's shared lines (LED-R160), each shown in place of something not yet caught or charted: an uncaught
# Legend's page (LED-R147), an empty Junk Museum plinth and an unopened Treasures row (LED-R144), and a zone with no
# data (LED-R138).
[ledger.line]
fields = ["text"]
ids = ["uncaughtlegend", "uncaughtjunk", "uncaughttreasure", "unchartedwaters"]
