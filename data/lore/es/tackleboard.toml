[boardgood."tackleboard.trackerframe.none"] # Tracker frame, the default, was "No frame"
name = "Sin marco"
# EN: No Frame
description = "La lista a solas, sin nada clavado detrás. Nunca se comba con la humedad."
# EN: The list on its own, with nothing pinned behind it. It never warps in the damp.

[boardgood."tackleboard.trackerframe.corkboard"] # Tracker frame, tier 1
name = "Tablero de corcho"
# EN: Corkboard
description = "Una plancha de corcho, picada de agujeros de trabajos acabados hace tiempo. Siempre cabe uno más."
# EN: A slab of cork, pocked with pinholes from jobs long finished. There is always room for one more.

[boardgood."tackleboard.trackerframe.driftwood"] # Tracker frame, tier 2, was "Driftwood Plank"
name = "Tabla curtida por la marea"
# EN: Tideworn Plank
description = "Una tabla gris como el mar, alisada por la marea y clavada junto al muelle. Ha viajado más lejos que muchos barcos."
# EN: A sea-grey plank, worn smooth by the tide and nailed up by the dock. It has travelled further than most boats.

[boardgood."tackleboard.toaststyle.ember"] # core.toaststyle, earned: Campfire: 100 days
name = "Ascua del hogar"
# EN: Hearth Ember
description = "Una página que estuvo a punto de ser yesca. Los bordes aún brillan cuando entra un buen pez."
# EN: A page that was nearly kindling once. The edges still glow when a good fish comes in.

[boardgood."tackleboard.trackerframe.net"] # tackleboard.trackerframe, tier 1
name = "Red de pesca"
# EN: Fishing Net
description = "Un trozo de red vieja colgado sobre las líneas, con los corchos aún atados a lo largo del borde de arriba."
# EN: A square of old net hung over the lines, its cork floats still tied along the top.

[boardgood."tackleboard.trackerframe.bamboo"] # tackleboard.trackerframe, tier 1
name = "Listones de bambú"
# EN: Bamboo Slats
description = "Listones de bambú atados con cordel, de esos que se enrollan y se meten a presión en la bolsa de aparejos."
# EN: Bamboo slats lashed with cord, the sort of thing you roll up and stuff in the tackle bag.

[boardgood."tackleboard.trackerframe.tin"] # tackleboard.trackerframe, tier 2
name = "Lata de aparejos"
# EN: Tackle Tin
description = "Una lata de aparejos de esmalte verde, abollada y desconchada, con la tapa repujada y la bisagra algo oxidada."
# EN: A green enamel tackle tin, dented and chipped, its lid embossed and its hinge a little rusty.

[boardgood."tackleboard.trackerframe.bobber"] # tackleboard.trackerframe, tier 2
name = "Boya"
# EN: Bobber
description = "Rojo sobre blanco, como una buena boya, y con una flotando en la esquina, sedal incluido."
# EN: Red over white like a good bobber, with one floating at the corner, line and all.

[boardgood."tackleboard.trackerframe.embers"] # tackleboard.trackerframe, earned: Campfire: 365 days
name = "Brasas vivas"
# EN: Live Embers
description = "Madera de deriva carbonizada, con el fuego aún vivo en las grietas. Hizo falta un año de hogueras."
# EN: Charred driftwood with the fire still living in its cracks. A year of fires went into this one.
