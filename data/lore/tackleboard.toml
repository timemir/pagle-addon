# The Tackle Board's lore (DATA-R100, TKB-R130), emitted into addons/Pagle_TackleBoard/data/Lore.lua as ns.L entries
# (DATA-R104): the names of the Fly Box's patterns ([fly.<patternID>], TKB-R62), the text of the board's titles
# ([boardtitle.<titleID>], TKB-R61, TKB-R73) and the names and descriptions of its goods ([boardgood."<goodID>"],
# TKB-R125), every ID manifest.toml lists under [tackleboard.*] (DATA-R106). The Ledger owns title and Core owns good
# (DATA-R102), so the board's kinds have their own names. Lore changes no count (DATA-R109).
# The M7 batch, drafted from VOICE.md, came with the Tackle Board's lore check (DATA-R111, #237), for the dev's review
# (#244). The comment after each table says what it is, and the working name it replaces, for review only.
#
# A fly is named in its Notice's or Expedition's toast ("Tied for your Fly Box: {fly}") and in the Fly Box drawer, so
# a name is in-world tackle, the kind an angler ties and swaps: never a real-world brand or a joke. No name holds a
# whole area name from the game (DATA-R3), so the working names' zones gave way to what their land is like. A title
# reads bare after "Title: " and on the Campfire card, so it is an epithet with no "the" in front, like the Ledger's.
# A frame's description is about how it looks around the tracker's lines, never the shop, the board or the addon.

