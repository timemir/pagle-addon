# The Ledger's lore (DATA-R100), emitted into addons/Pagle_Ledger/data/Lore.lua as ns.L entries (DATA-R104).
# One table per <kind>.<id> holding its fields (DATA-R101): [species.<speciesID>] blurb and riddle, [legend.<itemID>]
# blurb and title, [sub.<itemID>] plaque and [family.<familyID>] name (DATA-R103), and the kinds manifest.toml lists
# under [ledger.*] (DATA-R106). Lore is never part of the catalogue and changes no count (DATA-R109).
# The first batch, drafted from VOICE.md, came with the Ledger's lore check (DATA-R111, #131); the titles and
# bindings came with the M4 batch (#161). A PR that adds a Species or item adds its lore here, drafted from VOICE.md
# the same way. The comment after each catalogue-keyed table is the enUS DB2 name, for review only (DATA-R3).
#
# Riddles show only until the thing is caught (LED-R124, LED-R141): a kind of place or time, never a zone, hour or
# skill, and never a word from the fish's name (DATA-R110). Each is written against where its fish is listed
# (scripts/generate-data.py --explain <itemID>).

# Species (LED-R140, LED-R141), by Species ID, removed ones included.

[species.1467] # Spotted Sunfish
blurb = "A cheerful little fish with no idea how many cooks are waiting for it."
riddle = "A calm hill lake in settled farming country."

[species.4603] # Raw Spotted Yellowtail
blurb = "Fast, bright, and very pleased with itself."
riddle = "Salt coasts north and south, on both sides of the sea."

[species.6289] # Raw Longjaw Mud Snapper
blurb = "It bites anything, including, once, a gnome's boot."
riddle = "Lazy rivers in the lands where heroes begin."

[species.6291] # Raw Brilliant Smallfish
blurb = "Small, bright and everywhere. Every angler's book starts here, and nobody admits how many they threw back."
riddle = "The very first thing to tug a beginner's line, in the gentlest waters of all."

[species.6299] # Sickly Looking Fish
blurb = "Looks bad, smells worse, cooks into something a raptor would eat."
riddle = "Tired, grey water in the gloomy north, on both sides of the sea."

[species.6303] # Raw Slitherskin Mackerel
blurb = "Slippery enough to earn the name. Fries up better than it has any right to."
riddle = "Shallow coasts, where new adventurers wade."

[species.6308] # Raw Bristle Whisker Catfish
blurb = "All whiskers and grudge. It sulks on the bottom until it decides to fight."
riddle = "Murky rivers on both sides of the sea."

[species.6317] # Raw Loch Frenzy
blurb = "Named by dwarves, who name everything after how it behaves when you try to hold it."
riddle = "Cold highland lake water, in dwarf country."

[species.6358] # Oily Blackmouth
blurb = "Alchemists want the oil. Cooks want nothing to do with it."
riddle = "A school that leaves a slick on coastal waters."

[species.6359] # Firefin Snapper
blurb = "Warm to the touch, even out of the water."
riddle = "Swirling schools the colour of embers, off coasts north and south."

[species.6361] # Raw Rainbow Fin Albacore
blurb = "The colours fade within an hour of landing. Look quickly."
riddle = "Open coast, a little further from shore than you're used to."

[species.6362] # Raw Rockscale Cod
blurb = "Stubborn on the line, sweet on the plate."
riddle = "Sea coasts from the misty north to the hot south, where the bottom drops away."

[species.6458] # Oil Covered Fish
blurb = "Less a fish than a warning about the water. Wash it twice, then think again."
riddle = "Fouled water where goblins drill the parched hills and plains."

[species.6522] # Deviate Fish
blurb = "Eat one at your own risk. No two anglers who did tell the same story about the hour after."
riddle = "Strange schools out on the dry plains, where the water itself seems unwell."

[species.8365] # Raw Mithril Head Trout
blurb = "The head really does shine. No, it isn't mithril. Stop asking the smith."
riddle = "Lakes and rivers in rougher country, from deep forest to bare desert."

[species.12238] # Darkshore Grouper
blurb = "Broad, slow and grey as the coast it's named for. It makes a better stew than a first impression."
riddle = "Grey water under old trees on a moonlit coast, or far south in the desert."

[species.13422] # Stonescale Eel
blurb = "Armourers pay well for the scales. The eel disagrees with the arrangement."
riddle = "A writhing swarm in deep sea water off the wilder coasts."

[species.13754] # Raw Glossy Mightfish
blurb = "Heavy enough that some anglers fish it sitting down."
riddle = "Open sea off the far coasts, deep enough for the heavy ones."

[species.13755] # Raw Winter Squid
blurb = "Arrives with the frost. More arms than an angler can reasonably untangle."
riddle = "Warm shores, once the year turns cold."

[species.13756] # Raw Summer Bass
blurb = "Turns up with the long days and leaves with the first cold wind."
riddle = "Warm shores in the warm half of the year."

[species.13757] # Lightning Eel
blurb = "Tingles. Don't lick it."
riddle = "A crackle in far, wild waters, from sunrise into the late evening."

[species.13758] # Raw Redgill
blurb = "Gills like embers. Bites like it means it."
riddle = "Inland waters of the wilder lands, by day or by night."

[species.13759] # Raw Nightfin Snapper
blurb = "Feeds by starlight. Anglers who want it learn to like the dark."
riddle = "Wild waters far from the gentle shores, after the sun goes down."

[species.13760] # Raw Sunscale Salmon
blurb = "Rises with the sun and keeps late hours. Nobody knows where it goes before dawn."
riddle = "Far rivers and lakes, warm or cold, while the sun is up."

[species.13888] # Darkclaw Lobster
blurb = "Pinches first, asks questions never."
riddle = "Deep rocky waters at the far edges of the world."

[species.13889] # Raw Whitescale Salmon
blurb = "Pale as frost. Best eaten the day it's caught, which is rarely possible."
riddle = "The farthest waters there are, from frozen lakes to scorched hills."

[species.13890] # Raw Plated Armorfish
blurb = "Wears its armour on the outside and its temper on the inside. Bring a heavier knife."
riddle = "Something heavy in the farthest waters, after the sun goes down."

[species.13893] # Large Raw Mightfish
blurb = "The big cousin. You will need both hands and probably a friend."
riddle = "Deep water off a far and forgotten coast."

[species.16967] # Feralas Ahi
blurb = "Big, quick and good eating. Most are caught as a favour for someone else, which seems a waste."
riddle = "A broad river through wet, overgrown forest in the far west."

[species.16968] # Sar'theris Striker
blurb = "Hits the bait like it's been waiting all day for an argument."
riddle = "A bleak, grey shore on a dry and empty western coast."

[species.16969] # Savage Coast Blue Sailfin
blurb = "That sail is for show, and it knows it. Fights like it has an audience."
riddle = "Warm jungle shallows, where the sea runs right up to the trees."

[species.16970] # Misty Reed Mahi Mahi
blurb = "Bright as a jungle bird and twice as much trouble on the line."
riddle = "Warm, murky shallows where a swamp meets the sea."

[species.19807] # Speckled Tastyfish
blurb = "Tournament fish. Tastes of victory, or at least of a long afternoon trying."
riddle = "Only while the jungle's great contest is on."

[species.19975] # Zulian Mudskunk
blurb = "Smells exactly as the name promises. Somebody, somewhere, still wants a dozen."
riddle = "Churning brown water, deep in the steaming jungle."

[species.21071] # Raw Sagefish
blurb = "Smells like the hills it swims past."
riddle = "Small schools in the hills and forests, smelling faintly of herbs."

[species.21153] # Raw Greater Sagefish
blurb = "The sage grew up."
riddle = "Bigger herb-scented schools, in snowy hills and steaming jungle."

[species.251524] # Whimsyfin
blurb = "New to these waters, and nobody's quite sure how it got here."
riddle = "Bright new schools on a quiet lake in the eastern hills."

# Legends (LED-R147): the blurb under the first Catch, and the title the Angler can sign with (LED-R75, LED-R77),
# never "Master Angler". Uncaught Legends share line.uncaughtlegend; none has a riddle (DATA-R110).

[legend.19803] # Brownell's Blue Striped Racer
blurb = "Most anglers only ever see its wake. This one slowed down long enough to be landed."
title = "Racer-Chaser"

[legend.19805] # Keefer's Angelfish
blurb = "Far too handsome for a contest table, and it seems to know it."
title = "Keefer's Rival"

[legend.19806] # Dezian Queenfish
blurb = "Carries itself like royalty, and fights as if it had a crown to lose."
title = "Queen-Catcher"

# Sub-collections (LED-R144): a plaque beside each caught junk, container and treasure item. Junk plaques are museum
# labels; container and treasure plaques are about who lost it or what's left. None says where it was found.

[sub.6297] # Old Skull
plaque = "Donated by the water. Owner unknown, and preferably staying that way."

[sub.6301] # Old Teamster's Skull
plaque = "Belonged to someone who drove wagons. Still looks like it's waiting for one."

[sub.6307] # Message in a Bottle
plaque = "The ink ran long ago. The cork, to its credit, held."

[sub.6351] # Dented Crate
plaque = "Dropped once, by the look of it, and then again for good measure."

[sub.6352] # Waterlogged Crate
plaque = "Packed for a dry voyage. It did not get one."

[sub.6353] # Small Chest
plaque = "Small enough to lose over the side. Someone proved it."

[sub.6354] # Small Locked Chest
plaque = "Small, locked, and more trouble to open than it ever was to carry."

[sub.6355] # Sturdy Locked Chest
plaque = "Built to survive anything. The sea has been testing the claim."

[sub.6356] # Battered Chest
plaque = "Someone locked it, someone sank it, and neither came back for it."

[sub.6357] # Sealed Crate
plaque = "Sealed tight against the water. The water was patient."

[sub.6455] # Old Wagonwheel
plaque = "Where the wagon went is still under investigation."

[sub.6456] # Acidic Slime
plaque = "Please do not touch the exhibit."

[sub.6457] # Rusted Engineering Parts
plaque = "A gnome would call this 'nearly working'."

[sub.6717] # Gaffer Jack
plaque = "A tinker's spare parts, dropped over the side mid-job. He insists the boat leaked first."

[sub.6718] # Electropeller
plaque = "Parts for a clockwork duck decoy, the kind that explodes. Kept well away from the real ducks."

[sub.6643] # Bloated Brilliant Smallfish
plaque = "A small fish with a large appetite and no sense of what counts as food."

[sub.6645] # Bloated Mud Snapper
plaque = "It bit something far too big to swallow, and swallowed it anyway."

[sub.6647] # Bloated Bristle Whisker Catfish
plaque = "Fed off the bottom, where everyone's dropped things end up."

[sub.7973] # Big-mouth Clam
plaque = "Says nothing about what's inside. Open it anyway; sometimes it's a pearl."

[sub.8366] # Bloated Mithril Head Trout
plaque = "Ate something shiny. Possibly even mithril, this time."

[sub.13874] # Heavy Crate
plaque = "Too heavy to float and too heavy to carry far. Someone tried both."

[sub.13875] # Ironbound Locked Chest
plaque = "Bound in iron and locked besides. Whatever's inside was worth the worry."

[sub.13881] # Bloated Redgill
plaque = "Too greedy to stop eating, and too full to swim away."

[sub.13918] # Reinforced Locked Chest
plaque = "Reinforced, locked, and sunk anyway. Some cargo never gets a break."

[sub.20708] # Tightly Sealed Trunk
plaque = "Sealed so tight the water never got in. Neither, it seems, did the owner."

[sub.21113] # Watertight Trunk
plaque = "Watertight, as promised. Nobody promised it would float."

[sub.21150] # Iron Bound Trunk
plaque = "The iron held. The ship it came off did not."

[sub.21162] # Bloated Oily Blackmouth
plaque = "Swollen, slick and full of someone else's luck. Wash your hands after."

[sub.21164] # Bloated Rockscale Cod
plaque = "Stubborn to the last. It gave up what it swallowed only to a knife."

[sub.21228] # Mithril Bound Trunk
plaque = "Bound in mithril. Whoever packed it expected trouble, and got some."

[sub.21243] # Bloated Glossy Mightfish
plaque = "Big enough to swallow a purse whole, and it did."

# Trophy families (LED-R143): the fish's plain name, singular, as the game's trophy items spell it.

[family.1] # 10, 12 and 15 Pound Mud Snapper
name = "Mud Snapper"

[family.2] # 17, 19, 22 and 26 Pound Catfish
name = "Catfish"

[family.3] # 40, 47 and 53 Pound Yellowtail
name = "Yellowtail"

[family.4] # 34, 37, 42, 45 and 49 Pound Redgill
name = "Redgill"

[family.5] # 15, 18 and 22 Pound Salmon
name = "Salmon"

[family.6] # 7 Pound Lobster
name = "Lobster"

[family.7] # 70 Pound Mightfish
name = "Mightfish"

# Shared lines (manifest.toml's [ledger.line]), shown in place of whatever isn't caught yet, so never hinting at which.

[line.uncaughtlegend] # an uncaught Legend's page (LED-R147)
text = "Some fish are only caught once in a long while. This page waits for one."

[line.uncaughtjunk] # under "An empty plinth" in the Junk Museum (LED-R144)
text = "The plinth is dusted and ready. The exhibit is late."

[line.uncaughttreasure] # a Treasures row not yet opened (LED-R144)
text = "Something sealed, not yet found."

[line.unchartedwaters] # a zone with no data, before "Every catch here is still written down..." (LED-R138)
text = "Uncharted waters. No map of these yet."

# Titles (LED-R75, manifest.toml's [ledger.title]), from the M4 batch (#161): each an epithet the Angler signs with
# (LED-R77), shown on the bookplate, the brass plate and "Signed As". A short noun phrase, capitalised, no "the" in
# front; never "Master Angler", and "Angler" is never a ladder rung. The comment says when it's earned.

[title.level1] # from the start
text = "Minnow"

[title.level10] # peak level 10
text = "Dabbler"

[title.level20] # peak level 20
text = "Line-Caster"

[title.level30] # peak level 30
text = "Fisher"

[title.level40] # peak level 40
text = "Old Salt"

[title.level50] # peak level 50
text = "Tide-Reader"

[title.level60] # peak level 60
text = "Nat's Peer"

[title.prestige1] # prestige rank 1
text = "Returning Tide"

[title.prestige5] # prestige rank 5
text = "Undertow"

[title.prestige10] # prestige rank 10
text = "High-Water Mark"

[title.zonemaster] # a zone's shown rank reaches Master; {zone} is the zone's name (LED-R161)
text = "Warden of {zone} Waters"

[title."complete.ledger"] # Ledger completion reaches 100
text = "Angler of Azeroth"

[title."complete.junk"] # the Junk Museum's count reaches its total
text = "Collector of Boots"

[title."complete.treasure"] # the Treasures' count reaches its total
text = "Keeper of Lost Cargo"

[title."complete.trophy"] # the Trophy Room's weights reach their total
text = "Tipper of Scales"

[title."complete.varieties"] # every variety of every fish, the rarest title (VAR-R22), from the varieties release
text = "Keeper of Every Colour"

# Journal bindings (LED-R110, manifest.toml's [ledger.binding]), from the M4 batch (#161): the good
# ledger.binding.<id>'s name, and the description the Curio Shop shows beside its closed-book preview. A binding is
# a look only, so its description is about the book's leather or cloth. The comment says how it's had.

[binding.field] # the default
name = "Field Leather"
description = "Plain brown leather, made to be rained on, and it usually is."

[binding.level10] # earned at Angler Level 10
name = "Tanned Hide"
description = "Lighter, softer hide, worn smooth at the corners by a few seasons of wet thumbs."

[binding.level20] # earned at Angler Level 20
name = "Tidewater Blue"
description = "Deep blue leather with silver rules, the colour of a harbour at dusk."

[binding.level30] # earned at Angler Level 30
name = "Reed Green"
description = "Dark green leather, gilt the colour of dry reeds, and a faint smell of riverbank."

[binding.level40] # earned at Angler Level 40
name = "Oxblood"
description = "Deep red leather and heavy gilt. Fish blood barely shows on it."

[binding.level50] # earned at Angler Level 50
name = "Storm Grey"
description = "Slate-grey leather with silver tooling, for the days nobody else goes out."

[binding.level60] # earned at Angler Level 60
name = "Nat's Own"
description = "Near-black leather and bright gold. About as fine as an angler's book gets."

[binding.birch] # Curio Shop, tier 1
name = "Birch Bark"
description = "Pale and papery, with dark flecks. Likely the only book here that would float."

[binding.buckram] # Curio Shop, tier 2
name = "Sea-Green Buckram"
description = "Stiff sea-green cloth with cream rules. Spray beads up and rolls straight off."

[binding.sharkskin] # Curio Shop, tier 3
name = "Sharkskin"
description = "Rough grey hide with silver tooling. It won't slip out of a wet hand."

# Zone crests (LED-R113, manifest.toml's [ledger.crest]): the good ledger.crest.<key>'s name, the landmark on its
# shield, and the description the Curio Shop shows beside it, a word on the water there. Neither names a place from
# the game (DATA-R3). Each is earned when its zone reaches Master (LED-R114); the comment names the zone, for review
# only. The first ten were Core's for-sale crests, signed off in #264, and keep their text.

[crest.alterac] # Alterac Mountains
name = "The Broken Tower"
description = "A broken tower on a cold peak. The kingdom is gone. The streams are still good."

[crest.arathi] # Arathi Highlands
name = "The Standing Stones"
description = "Old standing stones on the highland grass, older than anyone who argues about them."

[crest.badlands] # Badlands
name = "The Stone Arch"
description = "A stone arch the wind took ten thousand years to finish. Bring your own water."

[crest.blackrock] # Blackrock Mountain
name = "The Black Spire"
description = "A black mountain with fire in its cracks and chains across its gate. Fish the lava pools at your own risk."

[crest.blastedlands] # Blasted Lands
name = "The Burning Gate"
description = "A gate of black stone with green fire in it. Nobody fishes there for the view."

[crest.burningsteppes] # Burning Steppes
name = "The Burning Peak"
description = "A mountain on fire under an ash sky. The water is warm enough to cook in."

[crest.deadwind] # Deadwind Pass
name = "The Lonely Tower"
description = "A tall tower in a dead valley. The pools are quiet. Too quiet, some say, and leave."

[crest.dunmorogh] # Dun Morogh
name = "The Ram"
description = "Curled horns over a snowfield. The rams up there have opinions about strangers."

[crest.duskwood] # Duskwood
name = "Eyes in the Wood"
description = "Two eyes between black trees. Anglers there keep the lantern lit and the line short."

[crest.easternplague] # Eastern Plaguelands
name = "The Chapel"
description = "A small chapel holding its light against the blight. Good water lies beside it."

[crest.elwynn] # Elwynn Forest
name = "The Old Oak"
description = "The first lake most anglers ever saw, and the oak they sat under."

[crest.hillsbrad] # Hillsbrad Foothills
name = "Three Apples"
description = "Three apples from the foothill orchards. The trout below the mill are fat on windfalls."

[crest.hinterlands] # The Hinterlands
name = "Three Feathers"
description = "Great feathers from the wild hills, where big birds nest above the rivers."

[crest.ironforge] # Ironforge
name = "The Anvil"
description = "An anvil before the mountain's forge. There is a lake under there, and dwarves fish it."

[crest.lochmodan] # Loch Modan
name = "The Great Dam"
description = "A dam holding back a highland lake. Dwarves built it to last, and it has."

[crest.lordamere] # Lordamere Lake
name = "The Lake Isle"
description = "A wooded island on a wide grey lake, a boat drawn up on its shore. Quiet water, and plenty of it."

[crest.redridge] # Redridge Mountains
name = "Three Peaks"
description = "Three red peaks standing in a mountain lake, and every one of them reflected."

[crest.riverglades] # Riverglades
name = "The Barge"
description = "A barge on a winding river between green hills. Trade comes by water there, and so do fish."

[crest.searinggorge] # Searing Gorge
name = "The Crucible"
description = "A crucible pouring molten gold. Fishing there means lava, so bring patience and a long rod."

[crest.silverpine] # Silverpine Forest
name = "Silver Pines"
description = "Silver pines on a dark lake shore. Something howls out there most nights."

[crest.stormwind] # Stormwind City
name = "The White Keep"
description = "White walls and a gate over the canals. The city fishes its own waterways, politely."

[crest.stranglethorn] # Stranglethorn Vale
name = "The Leap"
description = "A fish leaping clear of the jungle surf, as if it heard about the contest."

[crest.swampofsorrows] # Swamp of Sorrows
name = "The Drowned Shrine"
description = "A temple roof breaking the swamp water. What is under it stays under it."

[crest.tirisfal] # Tirisfal Glades
name = "The Bat"
description = "A bat across a sickly moon. Even the fish there look a little tired."

[crest.undercity] # Undercity
name = "The Broken Crown"
description = "A broken crown over green canals. The court is gone. The canals still hold fish."

[crest.westernplague] # Western Plaguelands
name = "The Crow"
description = "A crow on a dead tree over empty fields. The farmers left. The fish did not."

[crest.westfall] # Westfall
name = "The Windmill"
description = "Sails turning over the coast road. The sea is closer than the farmers admit."

[crest.wetlands] # Wetlands
name = "The Anchor"
description = "A harbour's anchor, hauled up from the mud. Still smells faintly of it."

[crest.ashenvale] # Ashenvale
name = "The Wisp"
description = "A wisp drifting between dark trees. The forest notices every angler who stays too long."

[crest.azshara] # Azshara
name = "The Fallen Column"
description = "A column of an old empire, the sea climbing it. Something still swims in those ruins."

[crest.barrens] # The Barrens
name = "The Acacia"
description = "A flat-topped tree on the dry plains. Every oasis out there is somebody's favourite spot."

[crest.darkshore] # Darkshore
name = "The Crescent"
description = "A crescent over grey water, for anglers who fish after dark."

[crest.darnassus] # Darnassus
name = "The Silver Well"
description = "A well glowing silver under a great tree. The lake around it holds the city's fish."

[crest.desolace] # Desolace
name = "The Horned Skull"
description = "A great horned skull from an old graveyard. The coast is kinder than the inland."

[crest.durotar] # Durotar
name = "The Scorpid"
description = "A scorpid on red earth. The coast is better company than the scorpids."

[crest.dustwallow] # Dustwallow Marsh
name = "The Lantern"
description = "A lantern left burning on a fisherman's hut in the marsh fog."

[crest.felwood] # Felwood
name = "The Tainted Tree"
description = "A twisted tree with green fire in its veins. Wash every catch from there. Twice."

[crest.feralas] # Feralas
name = "The Falls"
description = "Water falling between the giant trees, for anglers who take the long way."

[crest.moonglade] # Moonglade
name = "The Antlers"
description = "Antlers over a still lake, under the moon. A quiet place, kept quiet on purpose."

[crest.hyjal] # Mount Hyjal
name = "The Sapling"
description = "A green shoot rising out of old embers. The mountain is mending, and its streams with it."

[crest.mulgore] # Mulgore
name = "The Totem"
description = "A carved totem on the long grass plains, where the streams run clear from the hills."

[crest.orgrimmar] # Orgrimmar
name = "The Spiked Gate"
description = "A spiked gate in a red canyon. The city's pools are deeper than they look."

[crest.shendralas] # Shen'dralas
name = "The Open Tome"
description = "An open book on a broken pedestal, kept by people who never stopped reading."

[crest.silithus] # Silithus
name = "The Scarab"
description = "A scarab on desert sand. The lakes there are small and suspicious."

[crest.stonetalon] # Stonetalon Mountains
name = "The Talon"
description = "A great talon gripping a stone. Mountain water, cold and quick."

[crest.tanaris] # Tanaris
name = "The Desert Sun"
description = "A desert sun over the only shade for miles: the shoreline."

[crest.teldrassil] # Teldrassil
name = "The Starlit Crown"
description = "A tree so tall its crown is in the stars. Its roots drink from very old water."

[crest.thousandneedles] # Thousand Needles
name = "The Needles"
description = "Stone needles rising from the flats. Fish in their shadows, and keep your hat on."

[crest.thunderbluff] # Thunder Bluff
name = "The Mesa"
description = "A high mesa with a tent on top. The pools below catch the falls, and the fish with them."

[crest.ungoro] # Un'Goro Crater
name = "The Footprint"
description = "A footprint the size of a rowing boat. The crater has bigger worries than fish."

[crest.veiledsea] # The Veiled Sea
name = "The Fog Bank"
description = "A ship half lost in a bank of sea fog. Out here the fish come up from very deep, and so does everything else."

[crest.winterspring] # Winterspring
name = "The Frost"
description = "A snowflake over still water, where ice fishing is real fishing."

[crest.zephras] # Zephras Isle
name = "The Floating Isle"
description = "An island floating on cloud, its ship tied to the stone. The water is a long way down."
