# Slime: the slimes' wounds, attacks and gurgles. Made only of the game's own clips (WOW_SOUND_DIR, wow.export's sound/ folder), which are Blizzard's and
# not in the repo; each file is a mix of them laid on a timeline (see scripts/pagle_data/generated_sounds.py).

[file.toast_1]
# A squelchy wound, a fourth up.
mix = [
	{ clip = "creature/slime/mslimewoundb", start = 0, semitones = 4 },
]

[file.toast_2]
# A higher squelch.
mix = [
	{ clip = "creature/slime/mslimewoundc", start = 0, semitones = 7 },
]

[file.toast_3]
# An attack gurgle with a wound squeak just after.
mix = [
	{ clip = "creature/slime/mslimeattackb", start = 0, semitones = 3 },
	{ clip = "creature/slime/mslimewounda", start = 0.3, semitones = 8 },
]

[file.banner]
# A slime party: gurgles at rising pitches, ending on the death cry.
mix = [
	{ clip = "creature/slime/mslimeaggroa", start = 0, semitones = -2 },
	{ clip = "creature/slime/mslimeattackb", start = 0.25, semitones = 2 },
	{ clip = "creature/slime/mslimewoundc", start = 0.55, semitones = 5 },
	{ clip = "creature/slime/mslimewounda", start = 0.8, semitones = 9 },
	{ clip = "creature/slime/mslimeattackc", start = 0.9, semitones = -4 },
	{ clip = "creature/slime/mslimedeatha", start = 1.3, semitones = 3, gain = 0.8, length = 2.5 },
]
