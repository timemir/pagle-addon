# Bubbleworks: water bubbles, a droplet and a whale call. Parts are single sounds (ElevenLabs sound-effects prompts, requested length in seconds, shipped take
# "a" or "b" in raw/<part>/take_<x>.mp3); each file is a mix of them laid on a timeline (see
# scripts/pagle_data/generated_sounds.py).

[part.pop]
prompt = 'Single water bubble popping, close-mic, short wet pop, one-shot'
seconds = 0.8
pick = "a"

[part.bloop]
prompt = 'Single water droplet plink into a deep pool, round hollow bloop, one-shot'
seconds = 0.8
pick = "a"

[part.whale]
prompt = 'Humpback whale call, one long low moan rising in pitch, heard underwater from far away'
seconds = 2.5
pick = "a"

[file.toast_1]
# A pop, with a small high droplet just after.
mix = [
	{ part = "pop", start = 0 },
	{ part = "bloop", start = 0.07, semitones = 7, gain = 0.6 },
]

[file.toast_2]
# Four droplets climbing.
mix = [
	{ part = "bloop", start = 0, semitones = -2, gain = 0.9 },
	{ part = "bloop", start = 0.13, semitones = 2, gain = 0.9 },
	{ part = "bloop", start = 0.26, semitones = 5, gain = 0.9 },
	{ part = "bloop", start = 0.39, semitones = 9, gain = 0.8 },
]

[file.toast_3]
# A pop, and the whale answering from far off (take b, which starts at once).
mix = [
	{ part = "pop", start = 0 },
	{ part = "whale", start = 0.12, gain = 0.6, length = 1.4, pick = "b" },
]

[file.banner]
# A run of droplets up, one big pop and the whale.
mix = [
	{ part = "bloop", start = 0, semitones = -4, gain = 0.8 },
	{ part = "bloop", start = 0.15, gain = 0.8 },
	{ part = "bloop", start = 0.3, semitones = 4, gain = 0.8 },
	{ part = "bloop", start = 0.45, semitones = 7, gain = 0.8 },
	{ part = "bloop", start = 0.6, semitones = 11, gain = 0.8 },
	{ part = "pop", start = 0.8 },
	{ part = "whale", start = 0.9, gain = 0.7, length = 2.4, pick = "b" },
]
