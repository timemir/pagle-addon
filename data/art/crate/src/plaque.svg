  <rect x="0" y="0" width="240" height="41" fill="#120c06"/>
  <rect x="1" y="1" width="238" height="39" fill="none" stroke="#c9a24a" stroke-width="2"/>
  <rect x="-3.5" y="-3.5" width="247" height="48" fill="none" stroke="#3a2808" stroke-width="1"/>
</svg>
