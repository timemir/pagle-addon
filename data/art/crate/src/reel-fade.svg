<!-- The reel's end fade (prototypes/curio-crate/index.html: #reel .fade.l): linear-gradient(90deg, #0b0806,
     rgba(11,8,6,0)) over 150 px; the right end is this flipped. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 8" width="150" height="8">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b0806"/><stop offset="1" stop-color="#0b0806" stop-opacity="0"/></linearGradient></defs>
  <rect x="0" y="0" width="150" height="8" fill="url(#g)"/>
</svg>
