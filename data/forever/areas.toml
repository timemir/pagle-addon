# The area edits (DATA-R26 step 2, DATA-R30). Each [[area]] has id and why, and clearBaseline = true (empty the
# baseline's list for the area) and/or skillBase (the area's skill base; a subzone has one only when it is set
# here). Each [[catch]] has area, item, op ("add" or "drop") and why; an add may set gate (a window ID, DATA-R35,
# or "none" to remove the baseline's gate), a drop takes none. why, the evidence, is required (DATA-R10).
# The comments carry the enUS names for review; they never ship (DATA-R3).
# Edit this, then run scripts/generate-data.py and commit the regenerated files with it (DATA-R61).

# --- The VMaNGOS errors known today (DATA-R27).

[[area]]
id = 53  # Thieves Camp (Elwynn Forest)
