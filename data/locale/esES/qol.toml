# Recovered for 1.1 (#528): fmartingr's translations from PR #510 that scripts/convert-text.py did not carry over
# (a value on the line after `L.KEY =`, or a counted string), with `%s`/`%d` renamed to today's {fields}.
# Each one's `-- EN:` in #510 is today's English. A note above an entry names a part that is machine-drafted.

[SETTINGS_FISHING_KEY_TOOLTIP]
value = "Cada pulsación hace lo siguiente que toca: lanzar, recoger, o un señuelo, equipo o almeja cuando haga falta."
en = "Each press does the next single thing: cast, reel, or a lure, gear or clam when needed."

[SETTINGS_AUDIO_MIX_TOOLTIP]
value = "Mientras pescas: efectos al máximo; música, ambiente y diálogos en silencio; volumen general intacto. Todo vuelve a su sitio al acabar."
en = "While you fish: effects at full; music, ambience and dialog muted; master untouched. Put back afterwards."

[CONFLICT_TURNED_OFF_QOL]
value = "Pagle: Pagle QoL desactivado. Escribe /reload para terminar. Pagle sigue registrando tus Capturas."
en = "Pagle: turned off Pagle QoL. Type /reload to finish. Pagle keeps recording your Catches."

[SETTINGS_FISHING_SET_TOOLTIP]
value = "La Tecla de pesca te lo pone si no llevas caña en la mano. El doble clic se lo salta."
en = "The Fishing key puts it on when no pole is in hand. Double-click skips this."

[SETTINGS_SWAP_GEAR_TOOLTIP]
value = "Alterna entre tu conjunto de pesca y lo que llevabas antes (guardado como Pagle Previous)."
en = "Swaps between your fishing set and what you wore before (saved as Pagle Previous)."

[GUIDE_CASTING_BODY]
value = "Pulsa la Tecla de pesca y Pagle hace lo siguiente que toca, y luego espera a tu próxima pulsación. Nunca hace dos cosas a la vez, y nunca hace nada por su cuenta."
en = "Press the Fishing key and Pagle does the one next thing, then waits for your next press. It never does two things at once, and it never does anything on its own."

[GUIDE_CASTING_SMALL]
value = "Los pasos que no hacen falta se saltan: sin ropa de pescar guardada, no hay paso de equipo; con un señuelo ya puesto, no hay paso de señuelo. Un botoncito junto al agua muestra qué hará tu próxima pulsación."
en = "Steps you don’t need are passed over: no fishing clothes saved, no gear step; a lure already on, no lure step. A small button by the water shows what your next press will do."

[GUIDE_RESTING]
value = "La Tecla de pesca de Pagle descansa mientras la tenga {titles}. Puedes seguir lanzando con doble clic derecho."
en = "Pagle’s Fishing key is resting while {titles} has it. You can still cast with a double right-click."

[GUIDE_CLOTHES_BODY]
value = "Si tienes un atuendo de pesca, Pagle puede ponértelo: la primera pulsación de la Tecla de pesca junto al agua te cambia la ropa, y lo que llevabas se guarda, listo para volver a ponértelo."
en = "If you keep a fishing outfit, Pagle can put it on for you: the Fishing key’s first press at the water changes your clothes, and what you were wearing is kept, ready to put back."

[GUIDE_CLOTHES_SMALL]
value = "Los dos son conjuntos de equipo normales, así que también los verás en tu hoja de personaje. Si te alejas con la caña aún en la mano, una notita te recuerda cómo volver a cambiarte. Pagle nunca te cambia la ropa sin una pulsación."
en = "Both are ordinary equipment sets, so you’ll see them in your character sheet too. When you walk away with your pole still in hand, a small note reminds you how to change back. Pagle never changes your clothes without a press."

[GUIDE_SAVE_SMALL]
value = "Ponte ahora el sombrero, los guantes y la caña, y pulsa el botón. Puedes hacerlo luego desde Ajustes » Pesca."
en = "Wear your fishing hat, gloves and pole now, then press the button. You can do this later from Settings » Fishing."

[GUIDE_SAVE_SLOTS]
value = "Hacen falta dos huecos libres de conjunto de equipo: uno para tu ropa de pescar y otro para Pagle Previous."
en = "Needs two free equipment set slots: one for your fishing clothes and one for Pagle Previous."

[NOTE_LURE]
value = "Tu caña no tiene señuelo. Tu próxima pulsación le pone el mejor de tus bolsas. |cff9a2a1aSolo eso|r; luego lanzas."
en = "Your pole has no lure on. Your next press puts the best one in your bags on. |cff9a2a1aOnly that|r; then you cast."

