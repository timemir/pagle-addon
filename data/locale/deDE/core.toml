[GUIDE_WELCOME_LETTER]
value = ["Ab jetzt wird jeder Fisch, den du aus dem Wasser ziehst, aufgeschrieben: wo, wann, wie groß und was es brauchte, ihn an Land zu ziehen.", "Angle lange genug, und das Wasser verrät dir Dinge: was nur nachts beißt, welcher Fisch dir immer wieder entwischt, wie weit du gekommen bist.", "Lass mich dir alles zeigen. Es dauert zwei Minuten, und du kannst später alles ändern."]
en = ["From now on, every fish you pull out of the water gets written down: where, when, how big, and what it took to land it.", "Fish long enough and the water starts telling you things: what bites only at night, which fish you keep missing, how far you’ve come.", "Let me show you around. It takes two minutes, and you can change everything later."]

