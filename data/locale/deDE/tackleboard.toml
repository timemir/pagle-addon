[SETTINGS_TRACKER_TOOLTIP]
value = "Listet die Ziele, an denen du dort arbeiten kannst, wo du bist. Bevor deine Tafel steht, nutze »Meine Tafel aufstellen« auf der Pagle-Seite."
en = "Lists the goals you can work on where you are. Before your board is started, use Start my board on the Pagle page."

[GUIDE_BLURB]
value = "Kleine Ziele an einer Korktafel, wenn du willst. Sie warten, während du weg bist."
en = "Small goals pinned to a cork board, if you want them. They wait while you’re away."

