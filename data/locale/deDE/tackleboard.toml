en = "The Tackle Board"

[GUIDE_TITLE]
value = "Ziele, die auf dich warten"
en = "Goals that wait for you"

[GUIDE_BODY]
value = "Kleine Aushänge an einer Korktafel: ein Fisch zum Finden, ein Gewässer zum Besuchen. Angle, wann du magst; sie bleiben hängen."
en = "Small Notices pinned to a cork board: a fish to find, a water to visit. Fish when you like; they’ll still be there."

[GUIDE_CAMPFIRE]
value = "{campfire} wächst mit jedem Tag, an dem du einen Aushang erfüllst. Verpasst du einen Tag, verbrennt stattdessen {kindling}; es erlischt nicht."
en = "{campfire} grows with each day you finish a Notice. Miss a day and {kindling} burns instead; it isn’t put out."

[GUIDE_CAMPFIRE_TERM]
value = "Dein Lagerfeuer"
en = "Your Campfire"

[GUIDE_KINDLING_TERM]
value = "Zunder"
en = "Kindling"

[GUIDE_FLY_BOX]
value = "Jeder erfüllte Aushang bindet eine Fliege für deine {flybox}."
en = "Each Notice you finish ties one fly for your {flybox}."

[GUIDE_ASK_KICKER]
value = "Nur wenn du eine willst"
en = "Only if you want one"

[GUIDE_ASK_TITLE]
value = "Soll ich eine Tafel aufstellen?"
en = "Shall I put up a board?"

[GUIDE_FACTS]
value = ["Drei Aushänge am Tag und eine größere Expedition pro Woche.", "Keiner davon läuft ab. Länger weg? Bis zu sechs Aushänge und zwei Expeditionen warten auf dich.", "Gefällt dir einer nicht? Jeder lässt sich einmal am Tag abnehmen und ersetzen.", "Sie bringen Pagle-Münzen, {shop}"]
en = ["Three Notices a day, and one bigger Expedition a week.", "None of them expire. Away a while? Up to six Notices and two Expeditions wait for you.", "Don’t fancy one? Each can be taken down for a fresh one, once a day.", "They pay Pagle Coins, {shop}"]

[GUIDE_FACT_SHOP]
value = "mit denen du Optiken im Kuriositätenladen kaufst."
en = "which buy looks in the Curio Shop."

[BOARD_IS_UP]
value = "Deine Tafel steht"
en = "Your board is up"

[GUIDE_LEAVE]
value = "Oder lass es vorerst. Die Tafel wartet unter Anglertafel im Pagle-Menü und in den Einstellungen."
en = "Or leave it for now. The board waits under Tackle Board in the Pagle menu, and in Settings."

