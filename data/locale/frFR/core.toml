[GUIDE_WELCOME_LETTER]
value = ["Désormais, chaque poisson que vous sortez de l’eau est consigné : où, quand, quelle taille, et ce qu’il a fallu pour le remonter.", "Pêchez assez longtemps et l’eau se met à vous dire des choses : ce qui ne mord que la nuit, les poissons qui vous échappent toujours, le chemin parcouru.", "Laissez-moi vous faire visiter. Cela prend deux minutes, et vous pourrez tout changer plus tard."]
