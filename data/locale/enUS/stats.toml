# Pagle_Stats's interface text in English (CORE-R8, DATA-R114, ADR 0019). scripts/generate-data.py writes
# addons/Pagle_Stats/locale/enUS.lua from this file: edit this file and run the generator, never the Lua.
#
# Stats' string table (CORE-R8). Every user-facing string goes through ns.L; enUS only in 1.0. The lore keys of
# Stats' goods are added by the generated data/Lore.lua from the M6 lore batch on (STA-R88, DATA-R107).
#
# Converted from the hand-written enUS.lua by scripts/convert-enus-locale.py, then rewritten to the text helper's
# named fields by scripts/convert-text.py (CORE-R8): `%s` and `%d` became `{name}` and `{name:0}`, and a
# `_ONE`/`_OTHER` pair one counted string. A key is `KEY = "text"`; an array is `KEY = [...]`; a table is dotted keys
# (`KEY.sub = "text"`), a whole-number key being the Lua integer key (`CONTINENT_NAMES.0`), and a table of plural
# categories is a counted string. The shape is in DATA-R114 (docs/spec/content-data.md).

