# Config for the content generator's checks, stage 6 of scripts/check.sh (DATA-R60, DATA-R61). The tools are
# the pinned ones in .tools/ (PYTHON_PACKAGES in scripts/tools.env); this is not a package to install.

[tool.pytest.ini_options]
# The suite imports pagle_data from scripts/. No .pytest_cache in the tree.
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider", "--strict-markers"]
xfail_strict = true

[tool.mypy]
# Run from the repo root: mypy --config-file scripts/pyproject.toml
files = [
    "scripts/pagle_data",
    "scripts/tests",
    "scripts/generate-data.py",
    "scripts/extract-baseline.py",
    "scripts/update-db2.py",
    "scripts/db2-watch.py",
    "scripts/render-sounds.py",
    "scripts/import-field-report.py",
    "scripts/triage-field-report.py",
    "scripts/pushed-key.py",
    "scripts/propose-events.py",
    "scripts/check-event.py",
]
python_version = "3.12"
strict = true
cache_dir = ".tools/cache/mypy"
warn_unreachable = true

# soundfile is one annotated module, which can't carry a py.typed marker; mypy reads its annotations as they are.
[[tool.mypy.overrides]]
module = "soundfile"
follow_untyped_imports = true
