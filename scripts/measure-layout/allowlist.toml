# The layout harness's accepted findings (scripts/measure-layout.sh, docs/agents/layout-harness.md): each one a cut,
# off-page or overlapping text that's known and accepted, and why. A finding none of these match is new, and fails
# the run.
#
# Each [[allow]] needs `kind` ("cut", "out" or "overlap"), `text` and `reason`; `other` (the text or "(rule)" an
# overlap meets), `stop` (the tour stop's name, as `/pagle dev tour list` names it), `detail` (the report's detail
# line) and `languages` (["deDE"]; every language if left out) narrow it. `text`, `other`, `stop` and `detail` are
# globs: `*` any run of characters, `?` one, `[[]` a literal `[`. Keep each entry as narrow as the case it accepts.

[[allow]]
kind = "cut"
text = "Gepanzert nach Einbruch der Nacht"
stop = "hunts.b*" # the Board's stops, and its bindings' (hunts.binding.*)
languages = ["deDE"]
reason = """The Board's left list cuts this Hunt's German name with the client's "…" at its row's width, in every \
binding; the full name is on its page. Accepted for 1.1.1."""

[[allow]]
kind = "cut"
text = "Forelle im Morgengrauen"
stop = "hunts.trackerframe.*"
languages = ["deDE"]
reason = """At the tracker frames' floor sizes the German name is cut with the client's "…"; a wider tracker shows \
it whole. Accepted for 1.1.1."""

[[allow]]
kind = "overlap"
text = "*"
other = "В Реестре пока нет ничего с таким названием."
stop = "ledger.journal.search"
languages = ["ruRU"]
reason = """The Journal's search drop-down falls open over the right page on its own paper, 12 frame levels above \
it, so the page's words under it are hidden; the harness doesn't know one frame is drawn over another. Since 1.3.5 \
the no-match line takes a second line where it's too wide for one (LED-R148), and the drop-down reaches lower."""

