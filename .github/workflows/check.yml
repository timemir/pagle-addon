name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      coverage:
        description: Run the optional coverage report
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/package.sh clones this checkout; the packager reads history and tags for the version

      # The apt prerequisites of scripts/setup.sh, SETUP_APT_PACKAGES in scripts/tools.env. ubuntu-latest ships
      # them, so this usually installs nothing.
      - name: Install setup prerequisites
        run: |
          source scripts/tools.env
          missing=()
          for pkg in $SETUP_APT_PACKAGES time; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - uses: actions/cache/restore@v6
        id: tools
        with:
          path: |
            .tools
            !.tools/cache
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-${{ hashFiles('scripts/tools.env') }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-

      - name: Set up the pinned tools
        run: bash scripts/setup.sh

      - uses: actions/cache/save@v6
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          path: |
            .tools
            !.tools/cache
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - uses: actions/cache/restore@v6
        id: mypy
        with:
          path: .tools/cache/mypy
          key: mypy-${{ runner.os }}-${{ hashFiles('scripts/setup.sh', 'scripts/tools.env', 'scripts/pyproject.toml') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('scripts/setup.sh', 'scripts/tools.env', 'scripts/pyproject.toml') }}-

      - name: Run the check gate
        env:
          PAGLE_NO_COVERAGE: "1"
          GATE_JOBS: "2"
        run: /usr/bin/time -v bash scripts/check.sh

      - uses: actions/cache/save@v6
        if: steps.mypy.outputs.cache-hit != 'true'
        with:
          path: .tools/cache/mypy
          key: ${{ steps.mypy.outputs.cache-primary-key }}

      # Builds the release zip as the release workflow would, uploads off, and fails if anything but addon code
      # gets in (fix .pkgmeta), or if the packager builds more than the one zip a tag's GitHub Release gets
      # (CORE-R74). It passes no token and this workflow keeps contents: read, so nothing is published from here.
      # package.sh needs zip and jq on top of setup's prerequisites; ubuntu-latest ships both.
      - name: Package and check the release zip
        run: |
          missing=()
          for pkg in zip jq; do
            command -v "$pkg" >/dev/null || missing+=("$pkg")
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          bash scripts/package.sh

  test-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changed files are a diff against the push's or the pull request's base

      # Any doubt (a new branch with no main to diff against, a force push whose old head is gone) runs it.
      - name: Find whether the gate's machinery changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          machinery='^(scripts/(check\.sh|test-check\.sh|setup\.sh|tools\.env|pyproject\.toml|generate-data\.py|ace3\.sha256|libdeflate\.sha256|api-presence\.lua|api-inventory\.lua)$|scripts/pagle_data/|scripts/lib/|\.github/workflows/(check|release)\.yml$|spec/(support/|Pagle/adapter/Core_spec\.lua$|Pagle/Pagle_toc_spec\.lua$|Pagle_QoL/Pagle_QoL_toc_spec\.lua$)|types/|\.luacheckrc$|\.luarc\.json$|\.stylua\.toml$|\.styluaignore$|\.luacov$|\.busted$)'
          base=
          case $EVENT in
          pull_request) base=$PR_BASE ;;
          push)
            if [[ -n $BEFORE && ! $BEFORE =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base=$BEFORE
            else
              base=$(git merge-base HEAD origin/main 2>/dev/null) || base=
            fi
            ;;
          esac
          if [[ -z $base ]] || ! changed=$(git diff --name-only "$base" HEAD); then
            echo "test-check: a $EVENT run with no base to diff against; running it"
            run=true
          elif matched=$(grep -E "$machinery" <<<"$changed"); then
            echo "test-check: the gate's machinery changed since ${base:0:12}; running it:"
            echo "$matched"
            run=true
          else
            echo "test-check: nothing of the gate's machinery changed since ${base:0:12}; skipping it"
            run=false
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

      - name: Install setup prerequisites
        if: steps.changes.outputs.run == 'true'
        run: |
          source scripts/tools.env
          missing=()
          for pkg in $SETUP_APT_PACKAGES time; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      # The check job saves .tools/ under the same key.
      - uses: actions/cache/restore@v6
        if: steps.changes.outputs.run == 'true'
        with:
          path: |
            .tools
            !.tools/cache
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-${{ hashFiles('scripts/tools.env') }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-

      - name: Set up the pinned tools
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/setup.sh

      - uses: actions/cache/restore@v6
        if: steps.changes.outputs.run == 'true'
        id: mypy
        with:
          path: .tools/cache/mypy
          key: mypy-${{ runner.os }}-${{ hashFiles('scripts/setup.sh', 'scripts/tools.env', 'scripts/pyproject.toml') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('scripts/setup.sh', 'scripts/tools.env', 'scripts/pyproject.toml') }}-

      - name: Test the check gate
        if: steps.changes.outputs.run == 'true'
        run: /usr/bin/time -v bash scripts/test-check.sh

  coverage:
    if: github.event_name == 'workflow_dispatch' && inputs.coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install setup prerequisites
        run: |
          source scripts/tools.env
          missing=()
          for pkg in $SETUP_APT_PACKAGES time; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      - uses: actions/cache/restore@v6
        id: tools
        with:
          path: |
            .tools
            !.tools/cache
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-${{ hashFiles('scripts/tools.env') }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-

      - name: Set up the pinned tools
        run: bash scripts/setup.sh

      - uses: actions/cache/save@v6
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          path: |
            .tools
            !.tools/cache
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Run the check gate with coverage reporting
        run: /usr/bin/time -v bash scripts/check.sh
