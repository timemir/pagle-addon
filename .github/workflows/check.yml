# Runs the check gate, scripts/check.sh, and the release zip check, scripts/package.sh, on every push and pull
# request: the same scripts, setup and pins as local WSL. Tool versions come only from scripts/tools.env; this
# file names none. Every stage check.sh grows runs here without touching this file.
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/package.sh clones this checkout; the packager reads history for the changelog

      # The apt prerequisites of scripts/setup.sh, SETUP_APT_PACKAGES in scripts/tools.env. ubuntu-latest ships
      # them, so this usually installs nothing.
      - name: Install setup prerequisites
        run: |
          source scripts/tools.env
          missing=()
          for pkg in $SETUP_APT_PACKAGES; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      # .tools/ is where setup.sh installs (the repo root's .tools). A changed tools.env restores the last
      # .tools/ built by the same setup.sh, and setup.sh's stamps reinstall just the components whose pins
      # changed; a changed setup.sh starts from nothing.
      - uses: actions/cache/restore@v6
        id: tools
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-${{ hashFiles('scripts/tools.env') }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-

      - name: Set up the pinned tools
        run: bash scripts/setup.sh

      # Saved right after setup, so a failing check still leaves the tools cached.
      - uses: actions/cache/save@v6
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          path: .tools
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Run the check gate
        run: bash scripts/check.sh

      # Builds the release zip as the release workflow would, uploads off, and fails if anything but addon code
      # gets in (fix .pkgmeta). package.sh needs zip and jq on top of setup's prerequisites; ubuntu-latest ships both.
      - name: Package and check the release zip
        run: |
          missing=()
          for pkg in zip jq; do
            command -v "$pkg" >/dev/null || missing+=("$pkg")
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          bash scripts/package.sh

      # The gate's own regression test: each planted mistake must fail at the stage meant to catch it.
      - name: Test the check gate
        run: bash scripts/test-check.sh
