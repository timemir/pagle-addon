# Runs the check gate, scripts/check.sh, and the release zip check, scripts/package.sh, on every push and pull
# request: the same scripts, setup and pins as local WSL. Tool versions come only from scripts/tools.env; this
# file names none. Every stage check.sh grows runs here without touching this file. The gate's own regression test,
# scripts/test-check.sh, runs in a job of its own, test-check, when the gate's machinery changes, or on a manual run.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch: # runs test-check whatever changed

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scripts/package.sh clones this checkout; the packager reads history and tags for the version

      # The apt prerequisites of scripts/setup.sh, SETUP_APT_PACKAGES in scripts/tools.env. ubuntu-latest ships
      # them, so this usually installs nothing.
      - name: Install setup prerequisites
        run: |
          source scripts/tools.env
          missing=()
          for pkg in $SETUP_APT_PACKAGES; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      # .tools/ is where setup.sh installs (the repo root's .tools). A changed tools.env restores the last
      # .tools/ built by the same setup.sh, and setup.sh's stamps reinstall just the components whose pins
      # changed; a changed setup.sh starts from nothing.
      - uses: actions/cache/restore@v6
        id: tools
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-${{ hashFiles('scripts/tools.env') }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-

      - name: Set up the pinned tools
        run: bash scripts/setup.sh

      # Saved right after setup, so a failing check still leaves the tools cached.
      - uses: actions/cache/save@v6
        if: steps.tools.outputs.cache-hit != 'true'
        with:
          path: .tools
          key: ${{ steps.tools.outputs.cache-primary-key }}

      - name: Run the check gate
        run: bash scripts/check.sh

      # Builds the release zip as the release workflow would, uploads off, and fails if anything but addon code
      # gets in (fix .pkgmeta). package.sh needs zip and jq on top of setup's prerequisites; ubuntu-latest ships both.
      - name: Package and check the release zip
        run: |
          missing=()
          for pkg in zip jq; do
            command -v "$pkg" >/dev/null || missing+=("$pkg")
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          bash scripts/package.sh

  # The gate's own regression test, scripts/test-check.sh: each planted mistake must fail at the stage meant to catch
  # it. It runs the gate some fifty times, so only when what it tests changes: the gate's scripts, this workflow, the
  # tool configs, the type stubs and spec/support/. The job runs and passes either way, so a required check never
  # waits on it; with none of those changed it stops after its first step.
  test-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changed files are a diff against the push's or the pull request's base

      # Any doubt (a new branch with no main to diff against, a force push whose old head is gone) runs it.
      - name: Find whether the gate's machinery changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          machinery='^(scripts/|\.github/|spec/support/|types/|\.luacheckrc$|\.luarc\.json$|\.stylua\.toml$|\.styluaignore$|\.luacov$|\.busted$)'
          base=
          case $EVENT in
          pull_request) base=$PR_BASE ;;
          push)
            if [[ -n $BEFORE && ! $BEFORE =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base=$BEFORE
            else
              base=$(git merge-base HEAD origin/main 2>/dev/null) || base=
            fi
            ;;
          esac
          if [[ -z $base ]] || ! changed=$(git diff --name-only "$base" HEAD); then
            echo "test-check: a $EVENT run with no base to diff against; running it"
            run=true
          elif matched=$(grep -E "$machinery" <<<"$changed"); then
            echo "test-check: the gate's machinery changed since ${base:0:12}; running it:"
            echo "$matched"
            run=true
          else
            echo "test-check: nothing of the gate's machinery changed since ${base:0:12}; skipping it"
            run=false
          fi
          echo "run=$run" >>"$GITHUB_OUTPUT"

      - name: Install setup prerequisites
        if: steps.changes.outputs.run == 'true'
        run: |
          source scripts/tools.env
          missing=()
          for pkg in $SETUP_APT_PACKAGES; do
            dpkg -s "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${missing[@]}"
          fi

      # The check job saves .tools/ under the same key.
      - uses: actions/cache/restore@v6
        if: steps.changes.outputs.run == 'true'
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-${{ hashFiles('scripts/tools.env') }}
          restore-keys: tools-${{ runner.os }}-${{ hashFiles('scripts/setup.sh') }}-

      - name: Set up the pinned tools
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/setup.sh

      - name: Test the check gate
        if: steps.changes.outputs.run == 'true'
        run: bash scripts/test-check.sh
