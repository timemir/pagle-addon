# The Field report triage (DATA-R117): when an issue labelled field-report is opened or edited, posts one comment on
# it saying what the pasted report holds and what importing it would change, and edits that comment in place on later
# runs (found by its hidden marker). scripts/triage-field-report.py writes the comment from the issue and the default
# branch's data/ (scripts/tests/test_triage.py tests it on recorded issues, API answers and a wago.tools CSV); this
# file only fetches what GitHub holds, runs it and calls gh. It never edits data/ and never pushes; the dev imports
# reports by hand with scripts/import-field-report.py (DATA-R119).
#
# The issue form (.github/ISSUE_TEMPLATE/field-report.yml) labels its issues field-report and needs-triage, but
# GitHub drops a form label the repo doesn't have yet, so both must exist before the first report is filed. This
# workflow creates field-report and needs-info when they're missing, for the runs after that.
name: Field report triage

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write # list the open Field reports, create the two labels if missing, post or edit the comment, label

concurrency:
  # Two runs on one issue at once could both post a comment; a later edit's run waits for the earlier one.
  group: field-report-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'field-report')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The default branch: its data/ and its Catalogue.lua's fingerprint are what the report is judged against.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # the triage never pushes

      # PYTHON_VERSION in scripts/tools.env, the generator's Python; the triage needs nothing beyond its standard
      # library. A `with:` can't read that file, so this step hands the pin over.
      - name: Read the Python pin
        id: pins
        run: |
          source scripts/tools.env
          echo "python=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pins.outputs.python }}

      # The open Field reports (the report's other parts, and earlier issues it supersedes) and this issue's
      # comments (the Action's earlier one, to edit in place). The issue itself comes from the event payload.
      - name: Fetch the open Field reports and this issue's comments
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label field-report --state open --limit 1000 \
            --json number,body > "$RUNNER_TEMP/open.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" > "$RUNNER_TEMP/comments.json"

      # Writes comment.md and result.json; it downloads ItemSparse from wago.tools for the Uncharted items' names, and
      # fails the run only when its inputs can't be read.
      - name: Write the triage comment
        run: >-
          python scripts/triage-field-report.py --event "$GITHUB_EVENT_PATH"
          --open-issues "$RUNNER_TEMP/open.json" --comments "$RUNNER_TEMP/comments.json"
          --out "$RUNNER_TEMP/triage"

      - name: Post the comment and label the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          out="$RUNNER_TEMP/triage"
          comment=$(jq -r '.comment // empty' "$out/result.json")
          needs_info=$(jq -r '.needsInfo' "$out/result.json")
          labels=$(gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 --json name --jq '.[].name')
          if ! grep -qxF field-report <<<"$labels"; then
            gh label create field-report --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
              --description "A Field report pasted from Pagle (DATA-R115)"
          fi
          if ! grep -qxF needs-info <<<"$labels"; then
            gh label create needs-info --repo "$GITHUB_REPOSITORY" --color fbca04 \
              --description "Waiting on the reporter for more information"
          fi
          if [[ -n "$comment" ]]; then
            jq -n --rawfile body "$out/comment.md" '{body: $body}' |
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" --input - > /dev/null
            echo "triage: edited comment $comment"
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$out/comment.md"
          fi
          # needs-info while the paste can't be read; a fixed paste takes it off again.
          if [[ "$needs_info" == true ]]; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label needs-info
          elif jq -e '.issue.labels | any(.name == "needs-info")' "$GITHUB_EVENT_PATH" > /dev/null; then
            gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label needs-info
          fi
