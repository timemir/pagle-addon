# The Field report triage (DATA-R117): every 30 minutes, and on demand, over the open issues labelled field-report.
# On each one that is new or edited since its last triage it posts one comment saying what the pasted report holds and
# what importing it would change, and edits that comment in place on later runs (found by its hidden marker; a second
# hidden line holds a digest of the body it was written from, so an unchanged report is skipped without a download).
# It has no issues trigger on purpose: GitHub can't filter issue events by label in `on:`, so an issues trigger
# starts a run for every issue opened, edited or labelled, Field report or not.
# scripts/triage-field-report.py writes the comment from the issue and the default branch's data/
# (scripts/tests/test_triage.py tests it on recorded issues, API answers and a wago.tools CSV); this file only fetches
# what GitHub holds, runs it and calls gh. It never edits data/ and never pushes; the dev imports reports by hand with
# scripts/import-field-report.py (DATA-R119).
#
# The issue form (.github/ISSUE_TEMPLATE/field-report.yml) labels its issues field-report and needs-triage, but
# GitHub drops a form label the repo doesn't have yet, so both must exist before the first report is filed. This
# workflow creates field-report and needs-info when they're missing, for the runs after that.
name: Field report triage

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes, off the hour, when GitHub's scheduler is busiest
  workflow_dispatch:
    inputs:
      issue:
        description: "One Field report issue to triage now, even if unchanged (empty: every open one that changed)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write # list the open Field reports, create the two labels if missing, post or edit the comments, label

concurrency:
  # One triage at a time: two runs over the same issue could both post a comment.
  group: field-report-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The default branch: its data/ and its Catalogue.lua's fingerprint are what the report is judged against.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # the triage never pushes

      # PYTHON_VERSION in scripts/tools.env, the generator's Python; the triage needs nothing beyond its standard
      # library. A `with:` can't read that file, so this step hands the pin over.
      - name: Read the Python pin
        id: pins
        run: |
          source scripts/tools.env
          echo "python=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.pins.outputs.python }}

      - name: Make sure the two labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 --json name --jq '.[].name')
          if ! grep -qxF field-report <<<"$labels"; then
            gh label create field-report --repo "$GITHUB_REPOSITORY" --color 0e8a16 \
              --description "A Field report pasted from Pagle (DATA-R115)"
          fi
          if ! grep -qxF needs-info <<<"$labels"; then
            gh label create needs-info --repo "$GITHUB_REPOSITORY" --color fbca04 \
              --description "Waiting on the reporter for more information"
          fi

      # For each open Field report (or the one asked for): its comments, then the triage, which skips a report whose
      # comment was written from its current body unless one issue was asked for; then post or edit, and label.
      # One report's failure doesn't stop the others; the run fails at the end if any did.
      - name: Triage the open Field reports
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ inputs.issue }}
        run: |
          work="$RUNNER_TEMP/triage"
          mkdir -p "$work"
          gh issue list --repo "$GITHUB_REPOSITORY" --label field-report --state open --limit 1000 \
            --json number,body,labels > "$work/open.json"
          if [[ -n "$ASKED" ]]; then
            if ! jq -e --argjson n "$ASKED" 'any(.[]; .number == $n)' "$work/open.json" > /dev/null; then
              echo "::error::#$ASKED is not an open issue labelled field-report"
              exit 1
            fi
            numbers="$ASKED"
            skip=()
          else
            numbers=$(jq -r '.[].number' "$work/open.json")
            skip=(--skip-if-current)
          fi
          failed=0
          for n in $numbers; do
            dir="$work/$n"
            mkdir -p "$dir/out"
            jq --argjson n "$n" '{action: "scheduled", issue: (.[] | select(.number == $n))}' "$work/open.json" \
              > "$dir/event.json"
            if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$n/comments" > "$dir/comments.json"; then
              echo "::warning::#$n: couldn't read its comments"; failed=1; continue
            fi
            if ! python scripts/triage-field-report.py --event "$dir/event.json" --open-issues "$work/open.json" \
              --comments "$dir/comments.json" --out "$dir/out" "${skip[@]}"; then
              echo "::warning::#$n: the triage failed"; failed=1; continue
            fi
            if [[ $(jq -r '.skip // false' "$dir/out/result.json") == true ]]; then
              continue
            fi
            comment=$(jq -r '.comment // empty' "$dir/out/result.json")
            needs_info=$(jq -r '.needsInfo' "$dir/out/result.json")
            if [[ -n "$comment" ]]; then
              jq -n --rawfile body "$dir/out/comment.md" '{body: $body}' |
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" --input - > /dev/null
              echo "triage: #$n: edited comment $comment"
            else
              gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$dir/out/comment.md"
            fi
            # needs-info while the paste can't be read; a fixed paste takes it off again.
            if [[ "$needs_info" == true ]]; then
              gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --add-label needs-info
            elif jq -e '.issue.labels | any(.name == "needs-info")' "$dir/event.json" > /dev/null; then
              gh issue edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label needs-info
            fi
          done
          exit "$failed"
